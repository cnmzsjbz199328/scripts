<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>声纹文字 · Voice Kinetic Typography</title>
<style>
  :root{
    --bg:#0b0f19;
    --base:#f1f5f9;
    --hot:#ff4d6d;
    --glow:#fbbf24;
    --faded:#64748b;
    --panel:rgba(8,12,24,0.88);
    --border:#334155;
    --card:rgba(15,23,42,0.95);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{
    width:100%;height:100%;
    background:var(--bg);overflow:hidden;
    font-family:'Segoe UI',monospace;
    color:var(--base);
  }
  #stage{position:fixed;inset:0;display:block;touch-action:none;}

  .controls{
    position:fixed;top:0;left:0;right:0;
    display:flex;align-items:center;gap:14px;
    padding:10px 16px;
    background:var(--panel);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border);
    font-size:13px;z-index:10;flex-wrap:wrap;
  }
  .controls label{
    display:flex;align-items:center;gap:6px;
    color:#94a3b8;letter-spacing:0.02em;
  }
  select,button{
    background:var(--card);color:var(--base);
    border:1px solid var(--border);border-radius:6px;
    padding:6px 10px;font-size:13px;cursor:pointer;
    font-family:inherit;
    transition:background 0.15s,box-shadow 0.15s;
  }
  select:hover,button:hover{background:rgba(37,99,235,0.18);border-color:#3b82f6;}
  select:focus-visible,button:focus-visible,input:focus-visible{
    outline:2px solid #3b82f6;outline-offset:2px;
  }
  #toggleBtn{
    font-weight:700;letter-spacing:0.08em;
    background:rgba(37,99,235,0.15);
    border-color:rgba(59,130,246,0.5);
    color:#93c5fd;
  }
  #toggleBtn.on{background:#dc2626;border-color:#ef4444;color:#fff;box-shadow:0 0 10px rgba(220,38,38,0.4);}
  #toggleBtn:hover{background:rgba(37,99,235,0.3);border-color:#3b82f6;}
  #toggleBtn.on:hover{background:#ef4444;}

  input[type=range]{width:90px;accent-color:#3b82f6;}

  .status{
    margin-left:auto;display:flex;align-items:center;gap:8px;
    color:#94a3b8;font-size:12.5px;white-space:nowrap;
  }
  .dot{width:8px;height:8px;border-radius:50%;background:var(--faded);transition:background .2s;}
  .dot.live{
    background:var(--hot);
    box-shadow:0 0 8px 2px rgba(255,77,109,0.7);
    animation:blink 1.1s ease-in-out infinite;
  }
  @keyframes blink{0%,100%{opacity:1;}50%{opacity:0.35;}}

  .hint{
    position:fixed;bottom:10px;left:0;right:0;
    text-align:center;font-size:11px;color:#475569;
    z-index:10;padding:0 16px;pointer-events:none;letter-spacing:0.02em;
  }

  @media(prefers-reduced-motion:reduce){.dot.live{animation:none;}}
</style>
</head>
<body>

<canvas id="stage"></canvas>

<div class="controls">
  <label>语言
    <select id="langSel">
      <option value="zh-CN">中文</option>
      <option value="en-US">English</option>
    </select>
  </label>

  <label>灵敏度
    <input id="sensRange" type="range" min="0.5" max="2.5" step="0.1" value="1.2">
  </label>

  <button id="toggleBtn" type="button">开始</button>

  <div class="status" aria-live="polite">
    <span class="dot" id="statusDot"></span>
    <span id="statusText">待机</span>
  </div>
</div>

<div class="hint">每句话后自动切换横/竖排版 · 点击画面可手动切换 · 语音识别调用浏览器内置 API（Chrome 效果最佳），识别本身需要联网。</div>

<script src="game/config.js"></script>
<script src="game/scenes/Stage.js"></script>
<script src="game/systems/fx.js"></script>
<script src="game/systems/tokens.js"></script>
<script src="game/systems/audio.js"></script>
<script src="game/systems/particles.js"></script>
<script src="game/systems/render.js"></script>
<script src="game/main.js"></script>

</body>
</html>
