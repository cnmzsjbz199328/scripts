<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>机器人仓库 (BoxBot Warehouse)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Bungee&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0b0f19;
      color: #fff;
      font-family: 'Segoe UI', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* ── game wrapper ── */
    #game-wrapper {
      position: relative;
      border: 3px solid #3b82f6;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      overflow: hidden;
    }

    /* ── HUD overlay ── */
    #hud {
      display: none;
      position: absolute;
      top: 0; left: 0; right: 0;
      padding: 10px 14px;
      gap: 18px;
      flex-direction: row;
      align-items: center;
      background: linear-gradient(to bottom, rgba(0,0,0,0.55), transparent);
      pointer-events: none;
      z-index: 10;
      font-size: 15px;
      user-select: none;
    }

    #hud-hearts { color: #f87171; letter-spacing: 2px; font-size: 18px; }
    #hud-score  { color: #fbbf24; }
    #hud-objective { color: #a5f3fc; flex: 1; text-align: center; }
    #hud-day    { color: #86efac; margin-left: auto; }

    /* ── shared overlay styles ── */
    .game-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
      background: rgba(8, 12, 24, 0.88);
      backdrop-filter: blur(3px);
    }

    .overlay-card {
      text-align: center;
      max-width: 520px;
      padding: 36px 40px;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid #334155;
      border-radius: 12px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }

    .overlay-card h2 {
      font-size: 2rem;
      margin-bottom: 8px;
      color: #f1f5f9;
      letter-spacing: 0.08em;
    }

    .overlay-card .tagline {
      font-size: 0.95rem;
      color: #94a3b8;
      margin-bottom: 16px;
      font-style: italic;
    }

    .overlay-card .story-setting {
      font-size: 0.88rem;
      color: #64748b;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .overlay-card .controls-hint {
      font-size: 0.78rem;
      color: #475569;
      line-height: 1.8;
      margin-top: 14px;
    }

    /* ── buttons ── */
    .game-btn {
      display: inline-block;
      padding: 12px 36px;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.1s;
    }

    .game-btn:hover  { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,0,0,0.4); }
    .game-btn:active { transform: translateY(0); }

    #start-btn   { background: #2563eb; color: #fff; }
    #restart-btn { background: #dc2626; color: #fff; }

    /* ── game-over title colours ── */
    #gameover-title.win  { color: #4ade80; }
    #gameover-title.lose { color: #f87171; }
    /* ── responsive stage scaling (canvas + HUD scale together) ── */
    html, body { width: 100%; height: 100%; }
    #game-wrapper {
      width: 832px; height: 704px;
      flex: 0 0 auto;
      transform-origin: center center;
    }
    /* ── 开场遮罩 · 主题化 BEGIN（只作用于 #start-screen；胜负遮罩仍用通用卡）── */
    #start-screen { flex-direction: column; overflow: hidden; backdrop-filter: none; }    #start-screen { background: radial-gradient(ellipse at 50% 40%, rgba(30,38,58,.2), rgba(14,18,30,.82) 78%), url('assets/tiles/floor_base.png') 0 0 / 104px 104px, #1e2638; }
    #start-screen .rw-gear { position: absolute; width: 96px; height: 96px; pointer-events: none;
      background: url('assets/objects/gear.webp') 0 0 / 576px 96px no-repeat; animation: rw-gear .8s steps(6) infinite; }
    #start-screen .rw-plate { position: relative; width: 540px; margin-top: -80px; padding: 26px 36px 22px; text-align: center; color: #3a230c;
      background: linear-gradient(160deg, #f4d58d 0%, #d9a94f 45%, #b8822f 100%); border-radius: 14px;
      box-shadow: inset 0 2px 0 rgba(255,255,255,.6), inset 0 -4px 0 rgba(90,50,10,.35), 0 0 0 5px #6b4415, 0 14px 0 5px rgba(0,0,0,.35); }
    #start-screen .rw-plate i { position: absolute; width: 12px; height: 12px; border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #fff2c4, #8a5a1c 70%); box-shadow: 0 1px 1px rgba(0,0,0,.4); }
    #start-screen .rw-en { font-family: 'Bungee', sans-serif; font-size: 16px; letter-spacing: .2em; color: #6b4415; }
    #start-screen .rw-title { margin: 4px 0 0; font-family: 'ZCOOL KuaiLe', sans-serif; font-weight: 400; font-size: 66px; line-height: 1.1; letter-spacing: .08em; color: #4a2a0a;
      text-shadow: 0 2px 0 rgba(255,240,200,.7), 0 -1px 0 rgba(80,40,0,.5); }
    #start-screen .rw-story { margin-top: 10px; font-size: 14px; font-weight: 600; line-height: 1.85; color: #4a2e10; }
    #start-screen .rw-btn { margin-top: 16px; padding: 9px 38px; cursor: pointer; font-family: 'ZCOOL KuaiLe', sans-serif; font-size: 26px; letter-spacing: .12em; color: #fff;
      background: radial-gradient(ellipse at 50% 30%, #ff7a6b, #d62f2f 70%); border: 4px solid #5a5f6b; border-radius: 16px;
      box-shadow: 0 0 0 3px #a9afbb, 0 6px 0 3px #3b3f48; transition: transform .08s, box-shadow .08s; }
    #start-screen .rw-btn:hover { filter: brightness(1.08); }
    #start-screen .rw-btn:active { transform: translateY(4px); box-shadow: 0 0 0 3px #a9afbb, 0 2px 0 3px #3b3f48; }
    #start-screen .rw-keys { margin-top: 16px; display: flex; justify-content: center; gap: 16px; font-size: 13px; font-weight: 700; color: #4a2e10; }
    #start-screen kbd { display: inline-block; margin-right: 4px; padding: 0 6px; font-family: 'Bungee', sans-serif; font-size: 11px; color: #f4d58d; background: #4a2a0a; border-radius: 4px; }
    #start-screen .rw-belt { position: absolute; left: 0; right: 0; bottom: 40px; height: 64px;
      background: url('assets/tiles/belt_right_base.png') 0 0 / 64px 64px repeat-x; animation: rw-belt .6s linear infinite; box-shadow: 0 -4px 0 rgba(0,0,0,.25); }
    #start-screen .rw-bot { position: absolute; left: 70px; bottom: 104px; width: 96px; height: 104px;
      background: url('assets/sprites/Botty.webp') 0 0 / 864px 312px no-repeat; animation: rw-walk .9s steps(9) infinite; }
    #start-screen .rw-box { position: absolute; left: -64px; bottom: 44px; width: 56px; height: 56px; background-repeat: no-repeat; background-size: 224px 56px;
      animation: rw-boxf .6s steps(4) infinite, rw-ride 9s linear infinite; }
    @keyframes rw-belt { to { background-position: 64px 0; } }
    @keyframes rw-walk { to { background-position: -864px 0; } }
    @keyframes rw-gear { to { background-position: -576px 0; } }
    @keyframes rw-boxf { to { background-position: -224px 0; } }
    @keyframes rw-ride { to { transform: translateX(960px); } }
    @media (prefers-reduced-motion: reduce) { #start-screen, #start-screen * { animation: none !important; } }
    /* ── 开场遮罩 · 主题化 END ── */
  </style>
</head>
<body>
  <div id="game-wrapper">
    <div id="game-container"></div>

    <!-- HUD overlay -->
    <div id="hud">
      <div id="hud-score">当前关卡: <span id="hud-score-value">0</span></div>
        <div id="hud-objective"><span id="hud-objective-text">关卡 1/5：单色方块练习</span></div>
    </div>

    <!-- Start screen overlay：黄铜铭牌 · 传送带主题（无选择页的游戏保留这一次点击，样式见 style 末尾） -->
    <div id="start-screen" class="game-overlay">
      <div class="rw-gear" style="left:28px;top:24px" aria-hidden="true"></div>
      <div class="rw-gear" style="right:34px;top:70px;animation-direction:reverse" aria-hidden="true"></div>
      <div class="rw-plate">
        <i style="left:12px;top:12px"></i><i style="right:12px;top:12px"></i><i style="left:12px;bottom:12px"></i><i style="right:12px;bottom:12px"></i>
        <div class="rw-en">BOXBOT WAREHOUSE</div>
        <h2 class="rw-title">机器人仓库</h2>
        <p class="rw-story">齿轮转个不停、管道喷着彩虹蒸汽的卡通工厂。<br>推动彩色能量方块，把它们送到同色的目标格。</p>
        <button id="start-btn" class="rw-btn" onclick="window.__hudStart()">启动 Botty</button>
        <div class="rw-keys"><span><kbd>WASD</kbd>移动/推箱</span><span><kbd>Z</kbd>撤销</span><span><kbd>R</kbd>重开本关</span></div>
      </div>
      <div class="rw-belt" aria-hidden="true"></div>
      <div class="rw-box" style="background-image:url('assets/objects/box_red.webp');animation-delay:0s,0s"></div>
      <div class="rw-box" style="background-image:url('assets/objects/box_blue.webp');animation-delay:0s,-3s"></div>
      <div class="rw-box" style="background-image:url('assets/objects/box_green.webp');animation-delay:0s,-6s"></div>
      <div class="rw-bot" aria-hidden="true"></div>
    </div>

    <!-- Game over overlay -->
    <div id="gameover-screen" class="game-overlay" style="display:none">
      <div class="overlay-card">
        <h2 id="gameover-title">GAME OVER</h2>
        <p id="gameover-message" class="story-setting"></p>
        <button id="restart-btn" class="game-btn" onclick="location.reload()">↩ RESTART</button>
      </div>
    </div>
  </div>

  <!-- 共享引擎层 -->
  <script src="../_engine/hud.js"></script>
  <!-- 数据(地图/瓦片/实体 + 深度常量 + 关卡) -->
  <script src="game/config.js"></script>
  <script src="game/data.js"></script>
  <script src="game/levels.js"></script>
  <!-- 场景核心 + 系统模块(原型分割) -->
  <script src="game/scenes/MainScene.js"></script>
  <script src="game/systems/world.js"></script>
  <script src="game/systems/player.js"></script>
  <script src="game/systems/mechanics.js"></script>
  <script src="game/systems/fx.js"></script>
  <!-- Phaser 装配 -->
  <script src="game/main.js"></script>
  <script>
    /* Fit the whole stage (canvas + HUD overlays) to the viewport so everything
       scales as one piece — keeps HUD proportions correct at any screen size. */
    (function () {
      var W = 832, H = 704;
      var wrap = document.getElementById('game-wrapper');
      function fit() {
        if (!wrap) return;
        var s = Math.min(window.innerWidth / W, window.innerHeight / H, 1);
        wrap.style.transform = 'scale(' + s + ')';
      }
      window.addEventListener('resize', fit);
      window.addEventListener('orientationchange', fit);
      fit();
    })();
  </script>
</body>
</html>
