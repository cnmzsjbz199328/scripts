<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
    <!-- Back Rock Layer -->
    <rect x="0" y="0" width="128" height="128" fill="#0d111d" />
    <!-- Waterfall stream pattern -->
    <g stroke="#38bdf8" stroke-width="3" opacity="0.6">
      
          <line x1="34" y1="16" x2="34" y2="128" stroke-dasharray="24, 16" stroke-width="4" />
          <line x1="28" y1="40" x2="28" y2="128" stroke-dasharray="16, 24" stroke-width="2" />
        

          <line x1="54" y1="16" x2="54" y2="128" stroke-dasharray="24, 16" stroke-width="3" />
          <line x1="48" y1="40" x2="48" y2="128" stroke-dasharray="16, 24" stroke-width="2" />
        

          <line x1="74" y1="16" x2="74" y2="128" stroke-dasharray="24, 16" stroke-width="4" />
          <line x1="68" y1="40" x2="68" y2="128" stroke-dasharray="16, 24" stroke-width="2" />
        

          <line x1="94" y1="16" x2="94" y2="128" stroke-dasharray="24, 16" stroke-width="3" />
          <line x1="88" y1="40" x2="88" y2="128" stroke-dasharray="16, 24" stroke-width="2" />
        
    </g>
    <!-- Top Ledger -->
    <rect x="24" y="0" width="80" height="24" rx="4" fill="#1e293b" />
    <!-- Splashes at bottom -->
    <g fill="#ffffff" opacity="0.9">
      <circle cx="46.72789228047704" cy="117.16770632690572" r="5" />
      <circle cx="62.751559490358574" cy="118.72789228047705" r="4" />
      <circle cx="81.72959251407622" cy="116.69271275827278" r="3" />
    </g>
  </svg>