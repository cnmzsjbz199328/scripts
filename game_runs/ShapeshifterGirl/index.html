<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>百变少女冒险记 (ShapeshifterGirl)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #060913;
      color: #fff;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* ── game wrapper ── */
    #game-wrapper {
      position: relative;
      border: 3px solid #ff4f4f; /* 珊瑚红主题边框 */
      border-radius: 8px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
      overflow: hidden;
    }

    /* ── HUD overlay ── */
    #hud {
      display: none;
      position: absolute;
      top: 0; left: 0; right: 0;
      padding: 12px 16px;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(to bottom, rgba(0,0,0,0.75), transparent);
      pointer-events: none;
      z-index: 10;
      font-size: 15px;
      user-select: none;
    }

    #hud-left { display: flex; align-items: center; gap: 16px; }
    #hud-hearts { color: #ff4f4f; letter-spacing: 2px; font-size: 20px; text-shadow: 0 0 6px rgba(255,79,79,0.6); }
    #hud-form { color: #00ffcc; font-weight: bold; background: rgba(0,255,204,0.15); padding: 2px 8px; border-radius: 4px; border: 1px solid rgba(0,255,204,0.3); font-size: 13px; }
    #hud-score { color: #ffaa00; font-weight: 700; text-shadow: 0 0 4px rgba(255,170,0,0.4); }
    #hud-objective { color: #e2e8f0; font-weight: 500; font-size: 14px; text-shadow: 0 1px 3px rgba(0,0,0,0.8); flex: 1; text-align: center; }
    #hud-right { display: flex; align-items: center; gap: 10px; }

    /* ── shared overlay styles ── */
    .game-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
      background: rgba(8, 12, 24, 0.95);
      backdrop-filter: blur(5px);
    }

    .overlay-card {
      text-align: center;
      max-width: 560px;
      padding: 40px 48px;
      background: #0f172a;
      border: 2px solid #ff4f4f;
      border-radius: 12px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
    }

    .overlay-card h2 {
      font-size: 2.2rem;
      margin-bottom: 8px;
      color: #ff4f4f;
      letter-spacing: 0.05em;
      text-shadow: 0 0 10px rgba(255,79,79,0.3);
    }

    .overlay-card .tagline {
      font-size: 1rem;
      color: #00ffcc;
      margin-bottom: 20px;
      font-style: italic;
    }

    .overlay-card .story-setting {
      font-size: 0.9rem;
      color: #94a3b8;
      line-height: 1.6;
      margin-bottom: 28px;
      text-align: left;
    }

    .overlay-card .controls-hint {
      font-size: 0.8rem;
      color: #64748b;
      line-height: 1.8;
      margin-top: 18px;
      border-top: 1px solid #1e293b;
      padding-top: 14px;
    }

    /* ── buttons ── */
    .game-btn {
      display: inline-block;
      padding: 14px 42px;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.1s;
    }

    .game-btn:hover  { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(255,79,79,0.4); }
    .game-btn:active { transform: translateY(0); }

    #start-btn   { background: #ff4f4f; color: #fff; }
    #restart-btn { background: #c0524a; color: #fff; }

    /* ── game-over title colours ── */
    #gameover-title.win  { color: #00ffcc; text-shadow: 0 0 10px rgba(0,255,204,0.4); }
    #gameover-title.lose { color: #ff4f4f; text-shadow: 0 0 10px rgba(255,79,79,0.4); }

    /* ── responsive stage scaling ── */
    html, body { width: 100%; height: 100%; }
    #game-wrapper {
      width: 960px; height: 540px; /* 与 Phaser 画布 960x540 对齐，避免底部空带 */
      flex: 0 0 auto;
      transform-origin: center center;
    }
    /* ── 开场遮罩 · 主题化 BEGIN（只作用于 #start-screen；胜负遮罩仍用通用卡）── */
    #start-screen { flex-direction: column; overflow: hidden; backdrop-filter: none; }    #start-screen { color: #2f4a2c; font-family: 'Microsoft YaHei', 'Segoe UI', sans-serif;
      background: linear-gradient(rgba(246,251,242,.5), rgba(246,251,242,.2)), url('assets/bg/l1_mid.png') center bottom / auto 100% repeat-x,
        url('assets/bg/l1_far.png') center bottom / auto 100% repeat-x, linear-gradient(180deg, #f6fbf2 0%, #e3f0dd 60%, #cfe3c7 100%); }
    #start-screen .sg-wrap { position: relative; display: flex; flex-direction: column; align-items: center; text-align: center; padding: 18px 40px 16px;
      background: rgba(252,253,248,.86); border: 2px solid rgba(232,67,63,.35); border-radius: 22px; box-shadow: 0 10px 30px rgba(47,74,44,.25); }
    #start-screen .sg-title { margin: 0; font-family: 'ZCOOL KuaiLe', sans-serif; font-weight: 400; font-size: 60px; line-height: 1.1; letter-spacing: .06em; color: #e8433f;
      text-shadow: 0 3px 0 #fff, 0 5px 0 rgba(232,67,63,.25); }
    #start-screen .sg-sub { margin-top: 4px; font-size: 15px; letter-spacing: .2em; color: #4d7a46; }
    #start-screen .sg-forms { margin-top: 12px; display: flex; gap: 12px; }
    #start-screen .sg-form { display: flex; flex-direction: column; align-items: center; font-size: 12px; color: #4d6b48; }
    #start-screen .sg-form b { width: 74px; height: 74px; overflow: hidden; border-radius: 50%; background: #eef6e8; border: 2px solid #b9d6ae; }
    #start-screen .sg-form i { display: block; width: 72px; height: 78px; margin: -3px 0 0; background-repeat: no-repeat; }
    #start-screen .sg-form span { margin-top: 4px; }
    #start-screen .sg-form em { font-style: normal; font-weight: 700; color: #e8433f; margin-right: 3px; }
    #start-screen .sg-girl  { background: url('assets/sprites/girl.webp') 0 0 / 1512px 312px; animation: sg-21 2.6s steps(21) infinite; }
    #start-screen .sg-cat   { background: url('assets/sprites/cat.webp') 0 0 / 1512px 234px; animation: sg-21 2.6s steps(21) infinite; }
    #start-screen .sg-fish  { background: url('assets/sprites/fish.webp') 0 -78px / 1512px 156px; animation: sg-fish 2.6s steps(21) infinite; }
    #start-screen .sg-eagle { background: url('assets/sprites/eagle.webp') 0 0 / 1440px 156px; animation: sg-20 1.4s steps(20) infinite; }
    #start-screen .sg-bear  { background: url('assets/sprites/bear.webp') 0 0 / 1512px 234px; animation: sg-8 1.2s steps(8) infinite; }
    #start-screen .sg-btn { margin-top: 14px; padding: 8px 46px; cursor: pointer; font-family: 'ZCOOL KuaiLe', sans-serif; font-size: 26px; letter-spacing: .2em; color: #fff;
      background: #e8433f; border: none; border-radius: 999px; box-shadow: 0 5px 0 #b72d2a; transition: transform .08s, box-shadow .08s; }
    #start-screen .sg-btn:hover { background: #f05a55; }
    #start-screen .sg-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #b72d2a; }
    #start-screen .sg-keys { margin-top: 12px; display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 14px; max-width: 580px; font-size: 12px; color: #4d6b48; }
    #start-screen kbd { display: inline-block; margin-right: 3px; padding: 0 6px; font-family: 'Segoe UI', sans-serif; font-size: 11px; font-weight: 700; color: #fff;
      background: #6c9a5f; border-radius: 4px; }
    @keyframes sg-21   { to { background-position: -1512px 0; } }
    @keyframes sg-fish { to { background-position: -1512px -78px; } }
    @keyframes sg-20   { to { background-position: -1440px 0; } }
    @keyframes sg-8    { to { background-position: -576px 0; } }
    @media (prefers-reduced-motion: reduce) { #start-screen, #start-screen * { animation: none !important; } }
    /* ── 开场遮罩 · 主题化 END ── */
  </style>
</head>
<body>
  <div id="game-wrapper">
    <div id="game-container"></div>

    <!-- HUD overlay -->
    <div id="hud" style="display:none">
      <div id="hud-left">
        <div id="hud-hearts" title="生命值">❤❤❤❤</div>
        <div id="hud-form">少女</div>
      </div>
      <div id="hud-objective"><span id="hud-objective-text">探索林间小径</span></div>
      <div id="hud-right">
        <div id="hud-score">进度: <span id="hud-score-value">0%</span></div>
      </div>
    </div>

    <!-- Start screen overlay：剪纸森林绘本主题（无选择页的游戏保留这一次点击，样式见 style 末尾） -->
    <div id="start-screen" class="game-overlay">
      <div class="sg-wrap">
        <h2 class="sg-title">百变少女冒险记</h2>
        <div class="sg-sub">掌握自然之灵，拯救被魔雾掳走的弟弟</div>
        <div class="sg-forms" aria-hidden="true">
          <div class="sg-form"><b><i class="sg-girl"></i></b><span><em>1</em>少女</span></div>
          <div class="sg-form"><b><i class="sg-cat"></i></b><span><em>2</em>猫·攀墙</span></div>
          <div class="sg-form"><b><i class="sg-fish"></i></b><span><em>3</em>鱼·渡水</span></div>
          <div class="sg-form"><b><i class="sg-eagle"></i></b><span><em>4</em>鹰·滑翔</span></div>
          <div class="sg-form"><b><i class="sg-bear"></i></b><span><em>5</em>熊·破石</span></div>
        </div>
        <button id="start-btn" class="sg-btn" onclick="window.__hudStart()">开始冒险</button>
        <div class="sg-keys">
          <span><kbd>A</kbd><kbd>D</kbd>移动</span><span><kbd>W</kbd>/<kbd>空格</kbd>跳跃（猫二段跳，鹰长按 W 滑翔）</span>
          <span><kbd>1–5</kbd>变身（需读条）</span><span><kbd>J</kbd>互动/熊重击</span><span><kbd>R</kbd>重开本关</span><span><kbd>M</kbd>静音</span>
        </div>
      </div>
    </div>

    <!-- Game over overlay -->
    <div id="gameover-screen" class="game-overlay" style="display:none">
      <div class="overlay-card">
        <h2 id="gameover-title">冒险结束</h2>
        <p id="gameover-message" class="story-setting"></p>
        <button id="restart-btn" class="game-btn" onclick="location.reload()">↩ 重新开始</button>
      </div>
    </div>
  </div>

  <script>
    // HUD 心形字形与初始 ❤❤❤❤ 保持一致（_engine/hud.js 默认是 ◆◇）
    window.GAME_HUD_GLYPHS = { full: '❤', empty: '♡' };

    // 关卡脚手架数据 (符合 verify.ts 与 playtest 契约)
    window.GAME_CONFIG = {
      "map": { "width": 18000, "height": 540, "tileWidth": 64, "tileHeight": 64 },
      "player": { "spawn": { "x": 100, "y": 452 }, "speed": 240 },
      "renderMode": "parallax-scroller",
      "engine": "phaser3-custom",
      "note": "Side-scrolling shape-shifting action platformer with 5 forms, interactive obstacle puzzles, distance triggers, and lock-point wave encounters."
    };
    window.TILEMAP_DATA = { "width": 281, "height": 9, "tileWidth": 64, "tileHeight": 64, "layers": { "obstacles": [] } };
    window.ENTITIES_DATA = [];
  </script>

  <!-- ── 共享引擎层 ── -->
  <script src="../_engine/audio.js"></script>
  <script src="../_engine/hud.js"></script>

  <!-- ── 本游戏：配置 → 数据 → 系统 → 场景 → 控制装配 ── -->
  <script src="assets/bg/manifest.js"></script>
  <script src="game/config.js"></script>
  <script src="game/levels.js"></script>
  <script src="game/systems/form.js"></script>
  <script src="game/systems/movement.js"></script>
  <script src="game/systems/combat.js"></script>
  <script src="game/systems/gates.js"></script>
  <script src="game/systems/collect.js"></script>
  <script src="game/render.js"></script>
  <script src="game/scenes/BootScene.js"></script>
  <script src="game/scenes/LevelScene.js"></script>
  <script src="game/main.js"></script>

  <script>
    /* 容器自适应缩放 */
    (function () {
      var W = 960, H = 576;
      var wrap = document.getElementById('game-wrapper');
      function fit() {
        if (!wrap) return;
        var s = Math.min(window.innerWidth / W, window.innerHeight / H, 1);
        wrap.style.transform = 'scale(' + s + ')';
      }
      window.addEventListener('resize', fit);
      window.addEventListener('orientationchange', fit);
      fit();
    })();
  </script>
</body>
</html>
