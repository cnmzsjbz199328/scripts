<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>猫咪忍者大冒险 (Ninja Cat)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Bangers&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0b0f19;
      color: #fff;
      font-family: 'Segoe UI', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* ── game wrapper ── */
    #game-wrapper {
      position: relative;
      border: 3px solid #3b82f6;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      overflow: hidden;
    }

    /* ── HUD overlay ── */
    #hud {
      display: none;
      position: absolute;
      top: 0; left: 0; right: 0;
      padding: 10px 14px;
      gap: 18px;
      flex-direction: row;
      align-items: center;
      background: linear-gradient(to bottom, rgba(0,0,0,0.55), transparent);
      pointer-events: none;
      z-index: 10;
      font-size: 15px;
      user-select: none;
    }

    #hud-hearts { color: #f87171; letter-spacing: 2px; font-size: 18px; }
    #hud-score  { color: #fbbf24; }
    #hud-objective { color: #a5f3fc; flex: 1; text-align: center; }
    #hud-day    { color: #86efac; margin-left: auto; }

    /* ── shared overlay styles ── */
    .game-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
      background: rgba(8, 12, 24, 0.88);
      backdrop-filter: blur(3px);
    }

    .overlay-card {
      text-align: center;
      max-width: 520px;
      padding: 36px 40px;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid #334155;
      border-radius: 12px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }

    .overlay-card h2 {
      font-size: 2rem;
      margin-bottom: 8px;
      color: #f1f5f9;
      letter-spacing: 0.08em;
    }

    .overlay-card .tagline {
      font-size: 0.95rem;
      color: #94a3b8;
      margin-bottom: 16px;
      font-style: italic;
    }

    .overlay-card .story-setting {
      font-size: 0.88rem;
      color: #64748b;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .overlay-card .controls-hint {
      font-size: 0.78rem;
      color: #475569;
      line-height: 1.8;
      margin-top: 14px;
    }

    /* ── buttons ── */
    .game-btn {
      display: inline-block;
      padding: 12px 36px;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.1s;
    }

    .game-btn:hover  { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,0,0,0.4); }
    .game-btn:active { transform: translateY(0); }

    #start-btn   { background: #2563eb; color: #fff; }
    #restart-btn { background: #dc2626; color: #fff; }

    /* ── game-over title colours ── */
    #gameover-title.win  { color: #4ade80; }
    #gameover-title.lose { color: #f87171; }
    /* ── responsive stage scaling (canvas + HUD scale together) ── */
    html, body { width: 100%; height: 100%; }
    #game-wrapper {
      width: 960px; height: 640px;
      flex: 0 0 auto;
      transform-origin: center center;
    }
    /* ── 开场遮罩 · 主题化 BEGIN（只作用于 #start-screen；胜负遮罩仍用通用卡）── */
    #start-screen { flex-direction: column; overflow: hidden; backdrop-filter: none; }    #start-screen { background: linear-gradient(180deg, rgba(255,250,235,.08), rgba(30,50,20,.42)), url('scene/panorama.jpg') center 35% / cover, #9ccf7a; }
    #start-screen .nc-sun { position: absolute; left: 50%; top: 92px; width: 300px; height: 300px; margin-left: -150px; border-radius: 50%; pointer-events: none;
      background: radial-gradient(circle, #ff6a3d 0 58%, rgba(255,106,61,0) 61%); box-shadow: 0 0 70px rgba(255,120,60,.45); }
    #start-screen .nc-wrap { position: relative; display: flex; flex-direction: column; align-items: center; text-align: center; }
    #start-screen .nc-en { font-family: 'Bangers', cursive; font-size: 28px; letter-spacing: .14em; color: #fff; -webkit-text-stroke: 1.5px #2a1a0e; }
    #start-screen .nc-title { margin: 0; font-family: 'ZCOOL KuaiLe', sans-serif; font-weight: 400; font-size: 100px; line-height: 1.05; letter-spacing: .04em; color: #fff;
      text-shadow: 4px 0 0 #2a1a0e, -4px 0 0 #2a1a0e, 0 4px 0 #2a1a0e, 0 -4px 0 #2a1a0e, 4px 4px 0 #2a1a0e, -4px 4px 0 #2a1a0e, 4px -4px 0 #2a1a0e, -4px -4px 0 #2a1a0e, 0 10px 0 rgba(0,0,0,.25); }
    #start-screen .nc-ribbon { margin-top: 8px; padding: 4px 40px; font-family: 'ZCOOL KuaiLe', sans-serif; font-size: 26px; letter-spacing: .3em; color: #fff4d6; background: #c62828;
      clip-path: polygon(0 0, 100% 0, 94% 50%, 100% 100%, 0 100%, 6% 50%); }
    #start-screen .nc-story { margin-top: 16px; max-width: 470px; padding: 8px 18px; font-size: 14px; line-height: 1.8; color: #2a1a0e;
      background: rgba(255,250,235,.86); border: 2px solid #2a1a0e; border-radius: 12px; }
    #start-screen .nc-btn { margin-top: 18px; padding: 8px 42px 10px; cursor: pointer; font-family: 'ZCOOL KuaiLe', sans-serif; font-size: 28px; letter-spacing: .12em; color: #fff4d6;
      background: linear-gradient(#e53935, #b71c1c); border: 3px solid #2a1a0e; border-radius: 14px; box-shadow: 0 6px 0 #2a1a0e; transition: transform .08s, box-shadow .08s; }
    #start-screen .nc-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 0 #2a1a0e; }
    #start-screen .nc-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #2a1a0e; }
    #start-screen .nc-keys { margin-top: 18px; display: flex; gap: 18px; font-size: 13px; font-weight: 700; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.8); }
    #start-screen kbd { display: inline-block; margin: 0 2px; padding: 0 7px; font-family: 'Bangers', cursive; font-size: 15px; letter-spacing: .05em; color: #2a1a0e;
      background: #fff4d6; border: 2px solid #2a1a0e; border-radius: 6px; box-shadow: 0 2px 0 #2a1a0e; text-shadow: none; }
    #start-screen .nc-cat { position: absolute; right: 96px; bottom: 96px; width: 144px; height: 156px;
      background: url('assets/sprites/CatNinja.webp') 0 0 / 1296px 468px no-repeat; animation: nc-idle 1s steps(9) infinite, nc-hop 1.6s ease-in-out infinite;
      filter: drop-shadow(0 8px 4px rgba(0,0,0,.35)); }
    @keyframes nc-idle { to { background-position: -1296px 0; } }
    @keyframes nc-hop { 0%,60%,100% { transform: translateY(0); } 75% { transform: translateY(-26px); } }
    @media (prefers-reduced-motion: reduce) { #start-screen, #start-screen * { animation: none !important; } }
    /* ── 开场遮罩 · 主题化 END ── */
  </style>
</head>
<body>
  <div id="game-wrapper">
    <div id="game-container"></div>

    <!-- HUD overlay -->
    <div id="hud">
      <div id="hud-hearts" title="生命值">♥♥♥</div>
        <div id="hud-score">金币: <span id="hud-score-value">0</span></div>
        <div id="hud-objective"><span id="hud-objective-text">关卡 1: 收集金币并到达竹林终点的石门！</span></div>
    </div>

    <!-- Start screen overlay：卡通红日主题（无选择页的游戏保留这一次点击，样式见 style 末尾） -->
    <div id="start-screen" class="game-overlay">
      <div class="nc-sun" aria-hidden="true"></div>
      <div class="nc-cat" aria-hidden="true"></div>
      <div class="nc-wrap">
        <div class="nc-en">NINJA CAT</div>
        <h2 class="nc-title">猫咪忍者</h2>
        <div class="nc-ribbon">大冒险</div>
        <p class="nc-story">竹林、城堡屋顶、云端仙境！收集金币，小心刺球和巡逻的机器人，一路跑到终点的石门。</p>
        <button id="start-btn" class="nc-btn" onclick="window.__hudStart()">出发喵！</button>
        <div class="nc-keys"><span><kbd>A</kbd><kbd>D</kbd> / <kbd>←</kbd><kbd>→</kbd> 移动</span><span><kbd>W</kbd> / <kbd>↑</kbd> 跳跃</span></div>
      </div>
    </div>

    <!-- Game over overlay -->
    <div id="gameover-screen" class="game-overlay" style="display:none">
      <div class="overlay-card">
        <h2 id="gameover-title">GAME OVER</h2>
        <p id="gameover-message" class="story-setting"></p>
        <button id="restart-btn" class="game-btn" onclick="location.reload()">↩ RESTART</button>
      </div>
    </div>
  </div>

  <script>
    // NinjaCat 有生命值(♥)，沿用 ♥/♡ 字形。
    window.GAME_HUD_GLYPHS = { full: '♥', empty: '♡' };
  </script>
  <!-- 共享引擎层 -->
  <script src="../_engine/hud.js"></script>
  <!-- 数据(内联平移：GAME_CONFIG/TILEMAP_DATA/ENTITIES_DATA + DEPTH) -->
  <script src="game/config.js"></script>
  <!-- 场景核心 + 系统模块(原型分割) -->
  <script src="game/scenes/MainScene.js"></script>
  <script src="game/systems/world.js"></script>
  <script src="game/systems/player.js"></script>
  <script src="game/systems/flow.js"></script>
  <script src="game/systems/fx.js"></script>
  <!-- Phaser 装配 -->
  <script src="game/main.js"></script>
  <script>
    /* Fit the whole stage (canvas + HUD overlays) to the viewport so everything
       scales as one piece — keeps HUD proportions correct at any screen size. */
    (function () {
      var W = 960, H = 640;
      var wrap = document.getElementById('game-wrapper');
      function fit() {
        if (!wrap) return;
        var s = Math.min(window.innerWidth / W, window.innerHeight / H, 1);
        wrap.style.transform = 'scale(' + s + ')';
      }
      window.addEventListener('resize', fit);
      window.addEventListener('orientationchange', fit);
      fit();
    })();
  </script>
</body>
</html>
