<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>三剑流</title>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0b0f19;
      color: #fff;
      font-family: 'Segoe UI', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* ── game wrapper ── */
    #game-wrapper {
      position: relative;
      border: 3px solid #c9714a;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      overflow: hidden;
    }

    /* ── HUD overlay ── */
    #hud {
      display: none;
      position: absolute;
      top: 0; left: 0; right: 0;
      padding: 10px 14px;
      gap: 18px;
      flex-direction: row;
      align-items: center;
      background: linear-gradient(to bottom, rgba(0,0,0,0.55), transparent);
      pointer-events: none;
      z-index: 10;
      font-size: 15px;
      user-select: none;
    }

    #hud-hearts { color: #f87171; letter-spacing: 2px; font-size: 18px; }
    #hud-score  { color: #fbbf24; }
    #hud-objective { color: #a5f3fc; flex: 1; text-align: center; }
    #hud-day    { color: #86efac; margin-left: auto; }

    /* ── responsive stage scaling (canvas + HUD scale together) ── */
    html, body { width: 100%; height: 100%; }
    #game-wrapper {
      width: 960px; height: 540px;
      flex: 0 0 auto;
      transform-origin: center center;
    }
  </style>
</head>
<body>
  <div id="game-wrapper">
    <div id="game-container"></div>

    <!-- HUD overlay -->
    <div id="hud">
      <div id="hud-objective"><span id="hud-objective-text"></span></div>
    </div>

    <!-- 无 START 遮罩：开页直接是选人屏（场景 create 里自调 __hudStart，契约保留） -->
  </div>

  <!-- 共享引擎层（格斗自绘血条，不用 ♥ HUD；仅用 onStart/setObjective） -->
  <script src="../_engine/hud.js"></script>
  <!-- Joy-Con 2 协议 v2 客户端（共享层；只在本机或 ?joycon 时连 ws://127.0.0.1:8765） -->
  <script src="../_engine/joycon.js"></script>
  <!-- 数据：config(命名空间) → atlases(图集元数据) → data(数值/帧数据) -->
  <script src="game/config.js"></script>
  <script src="assets/bg/manifest.js"></script>
  <script src="assets/sprites/atlases.js"></script>
  <script src="assets/sprites/transformations.js"></script>
  <script src="game/data.js"></script>
  <!-- 场景核心 + 系统模块（MIGRATION.md §4B 原型分割） -->
  <script src="game/scenes/BladeTrinityScene.js"></script>
  <script src="game/systems/input.js"></script>
  <script src="game/systems/select.js"></script>
  <script src="game/systems/fight.js"></script>
  <script src="game/systems/combat.js"></script>
  <script src="game/systems/defense.js"></script>
  <script src="game/systems/transformation.js"></script>
  <script src="game/systems/bullettime.js"></script>
  <script src="game/systems/charge.js"></script>
  <script src="game/systems/crit.js"></script>
  <script src="game/systems/realm.js"></script>
  <script src="game/systems/arte.js"></script>
  <script src="game/systems/move.js"></script>
  <script src="game/systems/routine.js"></script>
  <script src="game/systems/loop.js"></script>
  <script src="game/systems/foregroundPhysics.js"></script>
  <script src="game/systems/restart.js"></script>
  <!-- Phaser 装配 -->
  <script src="game/main.js"></script>
  <script>
    /* Fit the whole stage (canvas + HUD overlays) to the viewport so everything
       scales as one piece — keeps HUD proportions correct at any screen size. */
    (function () {
      var W = 960, H = 540;
      var wrap = document.getElementById('game-wrapper');
      function fit() {
        if (!wrap) return;
        var s = Math.min(window.innerWidth / W, window.innerHeight / H, 1);
        wrap.style.transform = 'scale(' + s + ')';
      }
      window.addEventListener('resize', fit);
      window.addEventListener('orientationchange', fit);
      fit();
    })();
  </script>
</body>
</html>
