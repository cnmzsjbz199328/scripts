<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>吉卜力遗迹：浣熊魔法师的地牢探险</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&family=Noto+Serif+SC:wght@500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0b0f19;
      color: #fff;
      font-family: 'Segoe UI', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* ── game wrapper ── */
    #game-wrapper {
      position: relative;
      border: 3px solid #3b82f6;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      overflow: hidden;
    }

    /* ── HUD overlay ── */
    #hud {
      display: none;
      position: absolute;
      top: 0; left: 0; right: 0;
      padding: 10px 14px;
      gap: 18px;
      flex-direction: row;
      align-items: center;
      background: linear-gradient(to bottom, rgba(0,0,0,0.55), transparent);
      pointer-events: none;
      z-index: 10;
      font-size: 15px;
      user-select: none;
    }

    #hud-hearts { color: #f87171; letter-spacing: 2px; font-size: 18px; }
    #hud-score  { color: #fbbf24; }
    #hud-objective { color: #a5f3fc; flex: 1; text-align: center; }
    #hud-day    { color: #86efac; margin-left: auto; }

    /* ── shared overlay styles ── */
    .game-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
      background: rgba(8, 12, 24, 0.88);
      backdrop-filter: blur(3px);
    }

    .overlay-card {
      text-align: center;
      max-width: 520px;
      padding: 36px 40px;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid #334155;
      border-radius: 12px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }

    .overlay-card h2 {
      font-size: 2rem;
      margin-bottom: 8px;
      color: #f1f5f9;
      letter-spacing: 0.08em;
    }

    .overlay-card .tagline {
      font-size: 0.95rem;
      color: #94a3b8;
      margin-bottom: 16px;
      font-style: italic;
    }

    .overlay-card .story-setting {
      font-size: 0.88rem;
      color: #64748b;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .overlay-card .controls-hint {
      font-size: 0.78rem;
      color: #475569;
      line-height: 1.8;
      margin-top: 14px;
    }

    /* ── buttons ── */
    .game-btn {
      display: inline-block;
      padding: 12px 36px;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.1s;
    }

    .game-btn:hover  { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,0,0,0.4); }
    .game-btn:active { transform: translateY(0); }

    #start-btn   { background: #2563eb; color: #fff; }
    #restart-btn { background: #dc2626; color: #fff; }

    /* ── game-over title colours ── */
    #gameover-title.win  { color: #4ade80; }
    #gameover-title.lose { color: #f87171; }
    /* ── responsive stage scaling (canvas + HUD scale together) ── */
    html, body { width: 100%; height: 100%; }
    #game-wrapper {
      width: 800px; height: 600px;
      flex: 0 0 auto;
      transform-origin: center center;
    }
    /* ── 开场遮罩 · 主题化 BEGIN（只作用于 #start-screen；胜负遮罩仍用通用卡）── */
    #start-screen { flex-direction: column; overflow: hidden; backdrop-filter: none; }    #start-screen { color: #fff3d6; font-family: 'Noto Serif SC', 'SimSun', serif;
      background: linear-gradient(115deg, rgba(255,226,150,.2) 0%, transparent 35%), radial-gradient(ellipse at 50% 45%, rgba(20,30,18,.2), rgba(10,16,10,.82) 75%),
        url('scene/raccoon_dungeon_panorama_1781620650483.jpg') center / cover, #1d2a1b; }
    #start-screen .rd-beam { position: absolute; top: -20%; width: 120px; height: 140%; pointer-events: none; transform: rotate(18deg); filter: blur(6px);
      background: linear-gradient(180deg, rgba(255,232,170,.28), transparent 80%); animation: rd-beam 6s ease-in-out infinite alternate; }
    #start-screen .rd-spore { position: absolute; width: 6px; height: 6px; border-radius: 50%; pointer-events: none;
      background: radial-gradient(circle, #f6ffb8, rgba(200,255,140,0) 70%); box-shadow: 0 0 10px #d9ff9a; animation: rd-float 7s ease-in-out infinite; }
    #start-screen .rd-tablet { position: relative; width: 520px; padding: 28px 34px 22px; text-align: center;
      background: linear-gradient(180deg, rgba(74,86,70,.95), rgba(52,62,50,.95)); border-radius: 18px 18px 8px 8px;
      box-shadow: inset 0 0 0 2px rgba(190,210,160,.25), inset 0 0 30px rgba(0,0,0,.45), 0 16px 40px rgba(0,0,0,.55); }
    #start-screen .rd-tablet::before { content: ''; position: absolute; left: 10px; right: 10px; top: -9px; height: 24px; border-radius: 12px;
      background: radial-gradient(ellipse at 15% 60%, #6f9a3e 0 30%, transparent 32%), radial-gradient(ellipse at 40% 40%, #7fae46 0 26%, transparent 28%),
        radial-gradient(ellipse at 70% 65%, #5d8a33 0 30%, transparent 32%), radial-gradient(ellipse at 90% 45%, #86b84e 0 24%, transparent 26%); }
    #start-screen .rd-kicker { font-size: 13px; letter-spacing: .5em; color: #cfe7a6; }
    #start-screen .rd-title { margin: 8px 0 0; font-family: 'ZCOOL XiaoWei', serif; font-weight: 400; font-size: 54px; line-height: 1.15; letter-spacing: .1em; color: #fff1cf;
      text-shadow: 0 0 18px rgba(255,220,140,.35), 0 3px 0 rgba(0,0,0,.35); }
    #start-screen .rd-sub { margin-top: 4px; font-size: 15px; letter-spacing: .3em; color: #e6d3a3; }
    #start-screen .rd-story { margin-top: 12px; font-size: 13.5px; line-height: 1.9; color: #ece3c8; }
    #start-screen .rd-row { margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 14px; }
    #start-screen .rd-mage { width: 96px; height: 104px; background: url('assets/sprites/RaccoonMage.webp') 0 -520px / 864px 832px no-repeat;
      animation: rd-heal 1.1s steps(9) infinite; filter: drop-shadow(0 0 10px rgba(200,255,150,.5)); }
    #start-screen .rd-btn { padding: 10px 34px; cursor: pointer; font-family: 'ZCOOL XiaoWei', serif; font-size: 24px; letter-spacing: .25em; color: #1f2a12;
      background: radial-gradient(ellipse at 50% 30%, #e9ffb0, #9ccf4f 70%); border: 2px solid #f4ffd6; border-radius: 30px 8px 30px 8px;
      box-shadow: 0 0 22px rgba(190,255,120,.55); transition: transform .15s, box-shadow .15s; }
    #start-screen .rd-btn:hover { transform: translateY(-2px); box-shadow: 0 0 32px rgba(210,255,140,.85); }
    #start-screen .rd-keys { margin-top: 12px; display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 14px; font-size: 12.5px; color: #d9cfae; }
    #start-screen kbd { display: inline-block; margin-right: 4px; padding: 0 6px; font-family: 'Segoe UI', sans-serif; font-size: 11px; font-weight: 700; color: #2b2a18;
      background: #e8dcb0; border-radius: 4px; box-shadow: inset 0 -2px 0 #b9a979; }
    @keyframes rd-heal { to { background-position: -864px -520px; } }
    @keyframes rd-float { 0%,100% { transform: translate(0,0); opacity: .3; } 50% { transform: translate(14px,-26px); opacity: 1; } }
    @keyframes rd-beam { from { opacity: .45; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { #start-screen, #start-screen * { animation: none !important; } }
    /* ── 开场遮罩 · 主题化 END ── */
  </style>
</head>
<body>
  <div id="game-wrapper">
    <div id="game-container"></div>

    <!-- HUD overlay -->
    <div id="hud">
      <div id="hud-hearts" title="生命值">♥♥♥♥♥</div>
        <div id="hud-score">当前层数: <span id="hud-score-value">0</span></div>
        <div id="hud-objective"><span id="hud-objective-text">击败所有怪物以激活传送阵！</span></div>
    </div>

    <!-- Start screen overlay：青苔石碑主题（无选择页的游戏保留这一次点击，样式见 style 末尾） -->
    <div id="start-screen" class="game-overlay">
      <span class="rd-beam" style="left:12%"></span><span class="rd-beam" style="left:60%;animation-delay:-3s"></span>
      <span class="rd-spore" style="left:12%;top:30%;animation-delay:0s"></span>
      <span class="rd-spore" style="left:22%;top:62%;animation-delay:-2s"></span>
      <span class="rd-spore" style="left:34%;top:18%;animation-delay:-4s"></span>
      <span class="rd-spore" style="left:48%;top:74%;animation-delay:-1s"></span>
      <span class="rd-spore" style="left:63%;top:26%;animation-delay:-5s"></span>
      <span class="rd-spore" style="left:72%;top:58%;animation-delay:-3s"></span>
      <span class="rd-spore" style="left:85%;top:36%;animation-delay:-6s"></span>
      <span class="rd-spore" style="left:90%;top:70%;animation-delay:-2.5s"></span>
      <div class="rd-tablet">
        <div class="rd-kicker">吉卜力遗迹</div>
        <h2 class="rd-title">浣熊魔法师</h2>
        <div class="rd-sub">地牢探险</div>
        <p class="rd-story">神秘黑雾笼罩着长满青苔的古老遗迹。<br>深入随机地牢，击败守卫，让森林重见阳光。</p>
        <div class="rd-row"><div class="rd-mage" aria-hidden="true"></div><button id="start-btn" class="rd-btn" onclick="window.__hudStart()">踏入遗迹</button></div>
        <div class="rd-keys"><span><kbd>WASD</kbd>移动</span><span><kbd>J</kbd>法杖挥击</span><span><kbd>K</kbd>火球</span><span><kbd>L</kbd>治疗</span><span><kbd>E</kbd>宝箱/传送门</span></div>
      </div>
    </div>

    <!-- Game over overlay -->
    <div id="gameover-screen" class="game-overlay" style="display:none">
      <div class="overlay-card">
        <h2 id="gameover-title">GAME OVER</h2>
        <p id="gameover-message" class="story-setting"></p>
        <button id="restart-btn" class="game-btn" onclick="location.reload()">↩ RESTART</button>
      </div>
    </div>
  </div>

  <script>
    // RaccoonDungeon 有玩家血量,沿用 ♥/♡ 字形。
    window.GAME_HUD_GLYPHS = { full: '♥', empty: '♡' };
  </script>
  <!-- 共享引擎层 -->
  <script src="../_engine/hud.js"></script>
  <!-- 数据(地图/瓦片/实体 + 深度常量) -->
  <script src="game/config.js"></script>
  <script src="game/data.js"></script>
  <!-- 场景核心 + 系统模块(原型分割) -->
  <script src="game/scenes/MainScene.js"></script>
  <script src="game/systems/world.js"></script>
  <script src="game/systems/player.js"></script>
  <script src="game/systems/enemies.js"></script>
  <script src="game/systems/collisions.js"></script>
  <script src="game/systems/fx.js"></script>
  <script src="game/systems/boss.js"></script>
  <!-- Phaser 装配 -->
  <script src="game/main.js"></script>
  <script>
    /* Fit the whole stage (canvas + HUD overlays) to the viewport so everything
       scales as one piece — keeps HUD proportions correct at any screen size. */
    (function () {
      var W = 800, H = 600;
      var wrap = document.getElementById('game-wrapper');
      function fit() {
        if (!wrap) return;
        var s = Math.min(window.innerWidth / W, window.innerHeight / H, 1);
        wrap.style.transform = 'scale(' + s + ')';
      }
      window.addEventListener('resize', fit);
      window.addEventListener('orientationchange', fit);
      fit();
    })();
  </script>
</body>
</html>
