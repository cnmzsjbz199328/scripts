<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>霓虹狂飙：赛博漂移</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=ZCOOL+QingKe+HuangYou&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0b0f19;
      color: #fff;
      font-family: 'Segoe UI', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }


    /* ── game wrapper ── */
    #game-wrapper {
      position: relative;
      border: 3px solid #3b82f6;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      overflow: hidden;
    }

    /* ── HUD overlay ── */
    #hud {
      display: none;
      position: absolute;
      top: 0; left: 0; right: 0;
      padding: 10px 14px;
      gap: 18px;
      flex-direction: row;
      align-items: center;
      background: linear-gradient(to bottom, rgba(0,0,0,0.55), transparent);
      pointer-events: none;
      z-index: 10;
      font-size: 15px;
      user-select: none;
    }

    #hud-hearts { color: #f87171; letter-spacing: 2px; font-size: 18px; }
    #hud-score  { color: #fbbf24; }
    #hud-objective { color: #a5f3fc; flex: 1; text-align: center; }
    #hud-day    { color: #86efac; margin-left: auto; }

    /* ── shared overlay styles ── */
    .game-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
      background: rgba(8, 12, 24, 0.88);
      backdrop-filter: blur(3px);
    }

    .overlay-card {
      text-align: center;
      max-width: 520px;
      padding: 36px 40px;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid #334155;
      border-radius: 12px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }

    .overlay-card h2 {
      font-size: 2rem;
      margin-bottom: 8px;
      color: #f1f5f9;
      letter-spacing: 0.08em;
    }

    .overlay-card .tagline {
      font-size: 0.95rem;
      color: #94a3b8;
      margin-bottom: 16px;
      font-style: italic;
    }

    .overlay-card .story-setting {
      font-size: 0.88rem;
      color: #64748b;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .overlay-card .controls-hint {
      font-size: 0.78rem;
      color: #475569;
      line-height: 1.8;
      margin-top: 14px;
    }

    /* ── buttons ── */
    .game-btn {
      display: inline-block;
      padding: 12px 36px;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.1s;
    }

    .game-btn:hover  { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,0,0,0.4); }
    .game-btn:active { transform: translateY(0); }

    #start-btn   { background: #2563eb; color: #fff; }
    #restart-btn { background: #dc2626; color: #fff; }

    /* ── game-over title colours ── */
    #gameover-title.win  { color: #4ade80; }
    #gameover-title.lose { color: #f87171; }
    /* ── responsive stage scaling (canvas + HUD scale together) ── */
    html, body { width: 100%; height: 100%; }
    #game-wrapper {
      width: 960px; height: 600px;
      flex: 0 0 auto;
      transform-origin: center center;
    }

    /* ── 开场遮罩 · 赛博霓虹（只作用于 #start-screen；胜负遮罩仍用上面的通用卡）── */
    #start-screen {
      flex-direction: column; overflow: hidden; backdrop-filter: none;
      background:
        radial-gradient(ellipse at 50% 38%, rgba(2,8,20,.15), rgba(2,6,16,.7) 72%),
        linear-gradient(180deg, rgba(2,6,16,.3), rgba(2,6,16,.82)),
        url('assets/scene/neon_city_bg.jpg') center 30% / cover;
      font-family: 'Orbitron', 'Segoe UI', sans-serif;
    }
    #start-screen .nr-scan {
      position: absolute; inset: 0; pointer-events: none;
      background: repeating-linear-gradient(0deg, rgba(0,0,0,.22) 0 1px, transparent 1px 3px);
    }
    #start-screen .nr-grid {
      position: absolute; left: -50%; right: -50%; bottom: -30px; height: 230px; pointer-events: none;
      background-image:
        linear-gradient(rgba(255,79,216,.85) 2px, transparent 2px),
        linear-gradient(90deg, rgba(0,229,255,.75) 2px, transparent 2px);
      background-size: 64px 40px;
      transform: perspective(260px) rotateX(64deg); transform-origin: bottom center;
      -webkit-mask-image: linear-gradient(transparent, #000 70%); mask-image: linear-gradient(transparent, #000 70%);
      animation: nr-grid .55s linear infinite;
    }
    #start-screen .nr-wrap {
      position: relative; z-index: 1; margin-top: -78px;
      display: flex; flex-direction: column; align-items: center; text-align: center;
    }
    #start-screen .nr-kicker {
      font-size: 12px; letter-spacing: .42em; color: #00e5ff;
      text-shadow: 0 0 8px rgba(0,229,255,.75); margin-bottom: 12px;
    }
    #start-screen .nr-title {
      margin: 0; font-family: 'ZCOOL QingKe HuangYou', 'Microsoft YaHei', sans-serif;
      font-size: 88px; line-height: 1; font-weight: 400; letter-spacing: .06em; color: #f0feff;
      text-shadow: 0 0 6px #fff, 0 0 18px #00e5ff, 0 0 44px #00e5ff,
                   4px 0 0 rgba(255,46,196,.55), -4px 0 0 rgba(0,229,255,.4);
      animation: nr-flicker 6s infinite;
    }
    #start-screen .nr-sub {
      margin-top: 10px; font-family: 'ZCOOL QingKe HuangYou', sans-serif; font-size: 20px;
      letter-spacing: .3em; color: #ff4fd8; text-shadow: 0 0 10px rgba(255,79,216,.85);
    }
    #start-screen .nr-sub b { font-family: 'Orbitron', sans-serif; font-style: italic; font-weight: 700; font-size: 15px; margin-right: .7em; }
    #start-screen .nr-story {
      margin-top: 16px; max-width: 540px; font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
      font-size: 14px; line-height: 1.8; color: #a6dbe8;
    }
    #start-screen .nr-car {
      width: 64px; height: 64px; margin: 14px 0 8px;
      background: url('assets/sprites/PlayerCar.webp') -128px -192px / 320px 320px no-repeat;
      image-rendering: pixelated; filter: drop-shadow(0 0 12px rgba(255,90,90,.65));
      animation: nr-hover 1.1s ease-in-out infinite;
    }
    #start-screen .nr-btn {
      padding: 12px 42px; border: 2px solid #00e5ff; background: rgba(0,229,255,.08);
      color: #e6fdff; cursor: pointer; transform: skewX(-14deg);
      box-shadow: 0 0 14px rgba(0,229,255,.55), inset 0 0 14px rgba(0,229,255,.22);
      transition: background .15s, color .15s; animation: nr-pulse 1.8s ease-in-out infinite;
    }
    #start-screen .nr-btn > * { display: inline-block; transform: skewX(14deg); }
    #start-screen .nr-btn span { font-family: 'ZCOOL QingKe HuangYou', sans-serif; font-size: 26px; letter-spacing: .22em; }
    #start-screen .nr-btn em { font-style: normal; font-size: 12px; letter-spacing: .3em; margin-left: 14px; color: #ff4fd8; }
    #start-screen .nr-btn:hover { background: #00e5ff; color: #021018; }
    #start-screen .nr-btn:hover em { color: #021018; }
    #start-screen .nr-keys {
      margin-top: 22px; display: flex; gap: 26px;
      font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif; font-size: 13px; color: #82bccb;
    }
    #start-screen kbd {
      display: inline-block; min-width: 22px; padding: 2px 6px; margin: 0 2px;
      border: 1px solid rgba(0,229,255,.55); border-radius: 4px; background: rgba(0,229,255,.08);
      color: #cffaff; font-family: 'Orbitron', sans-serif; font-size: 11px; text-align: center;
      box-shadow: 0 0 6px rgba(0,229,255,.3);
    }
    @keyframes nr-grid    { to { background-position: 0 40px, 0 0; } }
    @keyframes nr-flicker { 0%,18%,20%,61%,63%,100% { opacity: 1; } 19%,62% { opacity: .55; } }
    @keyframes nr-pulse   { 50% { box-shadow: 0 0 28px rgba(0,229,255,.9), inset 0 0 18px rgba(0,229,255,.4); } }
    @keyframes nr-hover   { 50% { transform: translateY(-5px); } }
    @media (prefers-reduced-motion: reduce) { #start-screen, #start-screen * { animation: none !important; } }
  </style>
</head>
<body>
  <div id="game-wrapper">
    <div id="game-container"></div>

    <!-- HUD overlay -->
    <div id="hud">
      <div id="hud-hearts" title="生命值">♥♥♥</div>
        <div id="hud-score">速度: <span id="hud-score-value">0</span></div>
        <div id="hud-objective"><span id="hud-objective-text">闪避障碍，安全越过 AI 防线！</span></div>
    </div>

    <!-- Start screen overlay：赛博霓虹主题（无选择页的游戏保留这一次点击，样式见 style 末尾） -->
    <div id="start-screen" class="game-overlay">
      <div class="nr-scan" aria-hidden="true"></div>
      <div class="nr-grid" aria-hidden="true"></div>
      <div class="nr-wrap">
        <div class="nr-kicker">NEO-TOKYO 2099 · NIGHT CIRCUIT</div>
        <h2 class="nr-title">霓虹狂飙</h2>
        <div class="nr-sub"><b>CYBER DRIFT</b>赛博漂移</div>
        <p class="nr-story">高楼之间悬着错综的电子光带赛道。<br>避开路障，在 45 秒内冲过终点线。</p>
        <div class="nr-car" aria-hidden="true"></div>
        <button id="start-btn" class="nr-btn" onclick="window.__hudStart()"><span>点火出发</span><em>IGNITION ▶</em></button>
        <div class="nr-keys">
          <span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> / <kbd>←</kbd><kbd>→</kbd> 驾驶</span>
          <span><kbd>SPACE</kbd> 量子加速</span>
        </div>
      </div>
    </div>

    <!-- Game over overlay -->
    <div id="gameover-screen" class="game-overlay" style="display:none">
      <div class="overlay-card">
        <h2 id="gameover-title">GAME OVER</h2>
        <p id="gameover-message" class="story-setting"></p>
        <button id="restart-btn" class="game-btn" onclick="location.reload()">↩ RESTART</button>
      </div>
    </div>
  </div>

  <script>
    // NeonRacer 有护盾(♥)，沿用 ♥/♡ 字形。
    window.GAME_HUD_GLYPHS = { full: '♥', empty: '♡' };
  </script>
  <!-- 共享引擎层 -->
  <script src="../_engine/hud.js"></script>
  <!-- 数据(内联平移：GAME_CONFIG/TILEMAP_DATA/ENTITIES_DATA + DEPTH) -->
  <script src="game/config.js"></script>
  <!-- 场景核心 + 系统模块(原型分割) -->
  <script src="game/scenes/MainScene.js"></script>
  <script src="game/systems/world.js"></script>
  <script src="game/systems/spawn.js"></script>
  <script src="game/systems/player.js"></script>
  <script src="game/systems/flow.js"></script>
  <script src="game/systems/fx.js"></script>
  <!-- Phaser 装配 -->
  <script src="game/main.js"></script>
  <script>
    /* Fit the whole stage (canvas + HUD overlays) to the viewport so everything
       scales as one piece — keeps HUD proportions correct at any screen size. */
    (function () {
      var W = 960, H = 600;
      var wrap = document.getElementById('game-wrapper');
      function fit() {
        if (!wrap) return;
        var s = Math.min(window.innerWidth / W, window.innerHeight / H, 1);
        wrap.style.transform = 'scale(' + s + ')';
      }
      window.addEventListener('resize', fit);
      window.addEventListener('orientationchange', fit);
      fit();
    })();
  </script>
</body>
</html>
