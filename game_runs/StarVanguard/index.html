<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>星际先锋：堡垒决战</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=ZCOOL+QingKe+HuangYou&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0b0f19;
      color: #fff;
      font-family: 'Segoe UI', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* ── game wrapper ── */
    #game-wrapper {
      position: relative;
      border: 3px solid #3b82f6;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      overflow: hidden;
    }

    /* ── HUD overlay ── */
    #hud {
      display: none;
      position: absolute;
      top: 0; left: 0; right: 0;
      padding: 10px 14px;
      gap: 18px;
      flex-direction: row;
      align-items: center;
      background: linear-gradient(to bottom, rgba(0,0,0,0.55), transparent);
      pointer-events: none;
      z-index: 10;
      font-size: 15px;
      user-select: none;
    }

    #hud-hearts { color: #f87171; letter-spacing: 2px; font-size: 18px; }
    #hud-score  { color: #fbbf24; }
    #hud-objective { color: #a5f3fc; flex: 1; text-align: center; }
    #hud-day    { color: #86efac; margin-left: auto; }

    /* ── shared overlay styles ── */
    .game-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
      background: rgba(8, 12, 24, 0.88);
      backdrop-filter: blur(3px);
    }

    .overlay-card {
      text-align: center;
      max-width: 520px;
      padding: 36px 40px;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid #334155;
      border-radius: 12px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }

    .overlay-card h2 {
      font-size: 2rem;
      margin-bottom: 8px;
      color: #f1f5f9;
      letter-spacing: 0.08em;
    }

    .overlay-card .tagline {
      font-size: 0.95rem;
      color: #94a3b8;
      margin-bottom: 16px;
      font-style: italic;
    }

    .overlay-card .story-setting {
      font-size: 0.88rem;
      color: #64748b;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .overlay-card .controls-hint {
      font-size: 0.78rem;
      color: #475569;
      line-height: 1.8;
      margin-top: 14px;
    }

    /* ── buttons ── */
    .game-btn {
      display: inline-block;
      padding: 12px 36px;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.1s;
    }

    .game-btn:hover  { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,0,0,0.4); }
    .game-btn:active { transform: translateY(0); }

    #start-btn   { background: #2563eb; color: #fff; }
    #restart-btn { background: #dc2626; color: #fff; }

    /* ── game-over title colours ── */
    #gameover-title.win  { color: #4ade80; }
    #gameover-title.lose { color: #f87171; }
    /* ── responsive stage scaling (canvas + HUD scale together) ── */
    html, body { width: 100%; height: 100%; }
    #game-wrapper {
      width: 800px; height: 600px;
      flex: 0 0 auto;
      transform-origin: center center;
    }
    /* ── 开场遮罩 · 主题化 BEGIN（只作用于 #start-screen；胜负遮罩仍用通用卡）── */
    #start-screen { flex-direction: column; overflow: hidden; backdrop-filter: none; }    #start-screen { color: #dbeafe; background: radial-gradient(ellipse at 50% 40%, rgba(4,8,24,.3), rgba(2,4,14,.9) 75%), url('scene/establishing_shot.jpg') center 20% / cover, #02040e; }
    #start-screen .sv-stars { position: absolute; inset: 0; pointer-events: none; opacity: .85;
      background-image: radial-gradient(1.5px 1.5px at 20px 30px, #fff, transparent), radial-gradient(1px 1px at 90px 120px, #cde, transparent),
        radial-gradient(1.5px 1.5px at 160px 60px, #fff, transparent), radial-gradient(1px 1px at 230px 170px, #9cf, transparent);
      background-size: 260px 200px; animation: sv-near 2.5s linear infinite; }
    #start-screen .sv-stars.far { opacity: .45; background-size: 180px 140px; animation: sv-far 6s linear infinite; }
    #start-screen .sv-hud { position: absolute; top: 18px; left: 24px; right: 24px; display: flex; justify-content: space-between;
      font-family: 'Press Start 2P', monospace; font-size: 11px; color: #ff4d4d; }
    #start-screen .sv-hud b { margin-left: 10px; font-weight: 400; color: #fff; }
    #start-screen .sv-wrap { position: relative; display: flex; flex-direction: column; align-items: center; text-align: center; }
    #start-screen .sv-title { margin: 0; font-family: 'ZCOOL QingKe HuangYou', sans-serif; font-weight: 400; font-size: 96px; line-height: 1.1; letter-spacing: .06em;
      background: linear-gradient(180deg, #ffffff 0%, #cfe8ff 38%, #4a8fe0 52%, #e8f4ff 70%, #8fc4ff 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
      filter: drop-shadow(3px 3px 0 #b91c1c) drop-shadow(0 0 18px rgba(80,150,255,.45)); }
    #start-screen .sv-sub { margin-top: 6px; font-family: 'Press Start 2P', monospace; font-size: 12px; letter-spacing: .2em; color: #fbbf24; }
    #start-screen .sv-story { margin-top: 18px; max-width: 540px; font-size: 14px; line-height: 1.85; color: #b8cbe8; }
    #start-screen .sv-btn { margin-top: 22px; padding: 12px 30px; cursor: pointer; font-family: 'Press Start 2P', monospace; font-size: 13px; letter-spacing: .1em; color: #fff;
      background: rgba(2,4,14,.4); border: 3px solid #fff; box-shadow: 4px 4px 0 #b91c1c; transition: background .1s, color .1s; }
    #start-screen .sv-btn span { margin-right: 12px; font-family: 'ZCOOL QingKe HuangYou', sans-serif; font-size: 24px; letter-spacing: .25em; vertical-align: -3px; }
    #start-screen .sv-btn:hover { background: #fff; color: #02040e; }
    #start-screen .sv-keys { margin-top: 20px; display: flex; gap: 18px; font-size: 13px; color: #9fb4d6; }
    #start-screen kbd { display: inline-block; margin: 0 2px; padding: 3px 5px 2px; font-family: 'Press Start 2P', monospace; font-size: 9px; color: #02040e; background: #dbeafe; }
    @keyframes sv-near { to { background-position: 0 200px, 0 200px, 0 200px, 0 200px; } }
    @keyframes sv-far  { to { background-position: 0 140px, 0 140px, 0 140px, 0 140px; } }
    @media (prefers-reduced-motion: reduce) { #start-screen, #start-screen * { animation: none !important; } }
    /* ── 开场遮罩 · 主题化 END ── */
  </style>
</head>
<body>
  <div id="game-wrapper">
    <div id="game-container"></div>

    <!-- HUD overlay -->
    <div id="hud">
      <div id="hud-hearts" title="生命值">♥♥♥</div>
        <div id="hud-score">水晶: <span id="hud-score-value">0</span></div>
        <div id="hud-objective"><span id="hud-objective-text">第一关：冲出陨石风暴带！</span></div>
    </div>

    <!-- Start screen overlay：街机星空主题（无选择页的游戏保留这一次点击，样式见 style 末尾） -->
    <div id="start-screen" class="game-overlay">
      <div class="sv-stars far" aria-hidden="true"></div>
      <div class="sv-stars" aria-hidden="true"></div>
      <div class="sv-hud" aria-hidden="true"><span>1UP<b>000000</b></span><span>STAGE<b>01</b></span></div>
      <div class="sv-wrap">
        <h2 class="sv-title">星际先锋</h2>
        <div class="sv-sub">FORTRESS ASSAULT</div>
        <p class="sv-story">银河系边缘，帝国的终极防御工事「星际堡垒」即将启动。<br>驾驶战机冲破陨石带与敌军编队，击毁它。</p>
        <button id="start-btn" class="sv-btn" onclick="window.__hudStart()"><span>出击</span>LAUNCH</button>
        <div class="sv-keys"><span><kbd>A</kbd><kbd>D</kbd> / <kbd>←</kbd><kbd>→</kbd> 移动</span><span>自动射击</span><span><kbd>X</kbd> 清屏炸弹</span></div>
      </div>
    </div>

    <!-- Game over overlay -->
    <div id="gameover-screen" class="game-overlay" style="display:none">
      <div class="overlay-card">
        <h2 id="gameover-title">GAME OVER</h2>
        <p id="gameover-message" class="story-setting"></p>
        <button id="restart-btn" class="game-btn" onclick="location.reload()">↩ RESTART</button>
      </div>
    </div>
  </div>

  <script>
    // StarVanguard 有玩家血量,沿用 ♥/♡ 字形。
    window.GAME_HUD_GLYPHS = { full: '♥', empty: '♡' };
  </script>
  <!-- 共享引擎层 -->
  <script src="../_engine/hud.js"></script>
  <!-- 数据 + 程序化资源(音效/纹理) -->
  <script src="game/config.js"></script>
  <script src="game/data.js"></script>
  <script src="game/audio.js"></script>
  <script src="game/textures.js"></script>
  <!-- 场景核心 + 系统模块(原型分割) -->
  <script src="game/scenes/MainScene.js"></script>
  <script src="game/systems/weapons.js"></script>
  <script src="game/systems/spawning.js"></script>
  <script src="game/systems/collisions.js"></script>
  <script src="game/systems/boss.js"></script>
  <script src="game/systems/flow.js"></script>
  <script src="game/systems/fx.js"></script>
  <!-- Phaser 装配 -->
  <script src="game/main.js"></script>
  <script>
    /* Fit the whole stage (canvas + HUD overlays) to the viewport so everything
       scales as one piece — keeps HUD proportions correct at any screen size. */
    (function () {
      var W = 800, H = 600;
      var wrap = document.getElementById('game-wrapper');
      function fit() {
        if (!wrap) return;
        var s = Math.min(window.innerWidth / W, window.innerHeight / H, 1);
        wrap.style.transform = 'scale(' + s + ')';
      }
      window.addEventListener('resize', fit);
      window.addEventListener('orientationchange', fit);
      fit();
    })();
  </script>
</body>
</html>
