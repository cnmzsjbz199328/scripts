<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>像素农场：黄金种子的传承</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0b0f19;
      color: #fff;
      font-family: 'Segoe UI', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }


    /* ── game wrapper ── */
    #game-wrapper {
      position: relative;
      border: 3px solid #3b82f6;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      overflow: hidden;
    }

    /* ── HUD overlay ── */
    #hud {
      display: none;
      position: absolute;
      top: 0; left: 0; right: 0;
      padding: 10px 14px;
      gap: 18px;
      flex-direction: row;
      align-items: center;
      background: linear-gradient(to bottom, rgba(0,0,0,0.55), transparent);
      pointer-events: none;
      z-index: 10;
      font-size: 15px;
      user-select: none;
    }

    #hud-hearts { color: #f87171; letter-spacing: 2px; font-size: 18px; }
    #hud-score  { color: #fbbf24; }
    #hud-objective { color: #a5f3fc; flex: 1; text-align: center; }
    #hud-day    { color: #86efac; margin-left: auto; }

    /* ── shared overlay styles ── */
    .game-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
      background: rgba(8, 12, 24, 0.88);
      backdrop-filter: blur(3px);
    }

    .overlay-card {
      text-align: center;
      max-width: 520px;
      padding: 36px 40px;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid #334155;
      border-radius: 12px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }

    .overlay-card h2 {
      font-size: 2rem;
      margin-bottom: 8px;
      color: #f1f5f9;
      letter-spacing: 0.08em;
    }

    .overlay-card .tagline {
      font-size: 0.95rem;
      color: #94a3b8;
      margin-bottom: 16px;
      font-style: italic;
    }

    .overlay-card .story-setting {
      font-size: 0.88rem;
      color: #64748b;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .overlay-card .controls-hint {
      font-size: 0.78rem;
      color: #475569;
      line-height: 1.8;
      margin-top: 14px;
    }

    /* ── buttons ── */
    .game-btn {
      display: inline-block;
      padding: 12px 36px;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.1s;
    }

    .game-btn:hover  { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,0,0,0.4); }
    .game-btn:active { transform: translateY(0); }

    #start-btn   { background: #2563eb; color: #fff; }
    #restart-btn { background: #dc2626; color: #fff; }

    /* ── game-over title colours ── */
    #gameover-title.win  { color: #4ade80; }
    #gameover-title.lose { color: #f87171; }
    /* ── responsive stage scaling (canvas + HUD scale together) ── */
    html, body { width: 100%; height: 100%; }
    #game-wrapper {
      width: 800px; height: 600px;
      flex: 0 0 auto;
      transform-origin: center center;
    }

    /* ── 开场遮罩 · 像素田园黄昏（只作用于 #start-screen；胜负遮罩仍用上面的通用卡）── */
    #start-screen {
      flex-direction: column; overflow: hidden; backdrop-filter: none;
      background:
        radial-gradient(ellipse at 50% 42%, rgba(255,190,110,.10), rgba(30,14,4,.62) 78%),
        linear-gradient(180deg, rgba(255,150,70,.18), rgba(40,18,6,.38)),
        url('assets/tiles/grass_base.png') 0 0 / 160px 160px;
      image-rendering: pixelated;
      font-family: 'Microsoft YaHei', 'Segoe UI', sans-serif;
    }
    #start-screen .pf-sign {
      position: relative; z-index: 1; margin-top: -96px; width: 540px;
      padding: 24px 36px 22px; text-align: center; color: #fff4dc;
      background:
        repeating-linear-gradient(180deg, transparent 0 38px, rgba(70,34,10,.55) 38px 41px),
        linear-gradient(180deg, #b98149, #8f5b2d);
      box-shadow: 0 0 0 4px #5a3214, 0 0 0 8px #2b170a, 10px 12px 0 8px rgba(20,8,2,.38);
    }
    /* 四角铁钉 */
    #start-screen .pf-sign::before, #start-screen .pf-sign::after {
      content: ''; position: absolute; top: 10px; width: 6px; height: 6px; background: #3a2412;
      box-shadow: 0 calc(100% + 0px) 0 #3a2412;
    }
    #start-screen .pf-sign::before { left: 10px; box-shadow: 0 0 0 1px #c99a62; }
    #start-screen .pf-sign::after  { right: 10px; box-shadow: 0 0 0 1px #c99a62; }
    #start-screen .pf-kicker {
      font-family: 'Press Start 2P', monospace; font-size: 10px; letter-spacing: .28em;
      color: #ffe08a; text-shadow: 2px 2px 0 #4a2a12;
    }
    #start-screen .pf-title {
      margin: 10px 0 0; font-family: 'ZCOOL KuaiLe', 'Microsoft YaHei', sans-serif; font-weight: 400;
      font-size: 60px; line-height: 1.05; letter-spacing: .08em; color: #ffeaa8;
      text-shadow: 4px 4px 0 #4a2a12, -2px -2px 0 #4a2a12, 2px -2px 0 #4a2a12, -2px 2px 0 #4a2a12;
    }
    #start-screen .pf-sub {
      margin-top: 6px; font-family: 'ZCOOL KuaiLe', sans-serif; font-size: 20px; letter-spacing: .2em;
      color: #ffd25e; text-shadow: 2px 2px 0 #4a2a12;
    }
    #start-screen .pf-story {
      margin-top: 14px; font-size: 14px; line-height: 1.85; color: #fff1d6;
      text-shadow: 1px 1px 0 rgba(40,18,6,.6);
    }
    #start-screen .pf-btn {
      margin-top: 18px; padding: 9px 34px 12px; border: none; cursor: pointer;
      font-family: 'ZCOOL KuaiLe', sans-serif; font-size: 26px; letter-spacing: .18em; color: #3a2a06;
      background: #ffd34d;
      box-shadow: 0 0 0 4px #4a2a12, inset 0 -5px 0 #e0a52a, inset 0 4px 0 #fff2b0, 0 6px 0 4px #2b170a;
      transition: transform .06s;
    }
    #start-screen .pf-btn:hover  { background: #ffe07a; }
    #start-screen .pf-btn:active { transform: translateY(4px); box-shadow: 0 0 0 4px #4a2a12, inset 0 -3px 0 #e0a52a, 0 2px 0 4px #2b170a; }
    #start-screen .pf-keys {
      margin-top: 22px; display: flex; justify-content: center; gap: 18px; font-size: 13px; color: #ffeccc;
    }
    #start-screen kbd {
      display: inline-block; margin-right: 5px; padding: 5px 6px 4px; background: #3a2412; color: #ffe08a;
      font-family: 'Press Start 2P', monospace; font-size: 9px;
      box-shadow: 0 0 0 2px #2b170a, inset 0 -2px 0 #1e1006;
    }
    /* 地面：翻过的土 + 农夫锄地 + 宝箱 + 篝火 */
    #start-screen .pf-ground {
      position: absolute; left: 0; right: 0; bottom: 0; height: 96px;
      background: url('assets/tiles/dirt_tilled.png') 0 0 / 128px 128px;
      box-shadow: inset 0 6px 0 rgba(40,18,6,.45);
    }
    #start-screen .pf-farmer {
      position: absolute; left: 84px; bottom: 30px; width: 96px; height: 104px;
      background: url('assets/sprites/Farmer.webp') 0 -312px / 864px 520px no-repeat;
      animation: pf-hoe 1.15s steps(9) infinite;
    }
    #start-screen .pf-chest {
      position: absolute; right: 190px; bottom: 36px; width: 64px; height: 64px;
      background: url('assets/objects/chest.webp') 0 0 / 256px 64px no-repeat;
    }
    #start-screen .pf-fire {
      position: absolute; right: 86px; bottom: 30px; width: 80px; height: 80px;
      background: url('assets/objects/bonfire.webp') 0 0 / 480px 80px no-repeat;
      animation: pf-fire .75s steps(6) infinite;
      filter: drop-shadow(0 0 14px rgba(255,140,60,.75));
    }
    @keyframes pf-hoe  { to { background-position: -864px -312px; } }
    @keyframes pf-fire { to { background-position: -480px 0; } }
    @media (prefers-reduced-motion: reduce) { #start-screen, #start-screen * { animation: none !important; } }
  </style>
</head>
<body>
  <div id="game-wrapper">
    <div id="game-container"></div>

    <!-- HUD overlay -->
    <div id="hud">
      <div id="hud-score">金币: <span id="hud-score-value">0</span></div>
        <div id="hud-objective"><span id="hud-objective-text">打开祖父留下的左侧宝箱 📦</span></div>
    </div>

    <!-- Start screen overlay：像素田园主题（无选择页的游戏保留这一次点击，样式见 style 末尾） -->
    <div id="start-screen" class="game-overlay">
      <div class="pf-sign">
        <div class="pf-kicker">GOLDEN SEED</div>
        <h2 class="pf-title">像素农场</h2>
        <div class="pf-sub">黄金种子的传承</div>
        <p class="pf-story">山谷里那座被遗忘的家族农场：大门紧锁，土地荒芜。<br>祖父留下的宝箱里，藏着让它重新苏醒的东西。</p>
        <button id="start-btn" class="pf-btn" onclick="window.__hudStart()">开始耕种</button>
        <div class="pf-keys">
          <span><kbd>WASD</kbd>移动</span><span><kbd>E</kbd>互动</span><span><kbd>Z</kbd>使用</span><span><kbd>X</kbd>睡觉</span>
        </div>
      </div>
      <div class="pf-ground" aria-hidden="true">
        <div class="pf-farmer"></div>
        <div class="pf-chest"></div>
        <div class="pf-fire"></div>
      </div>
    </div>

    <!-- Game over overlay -->
    <div id="gameover-screen" class="game-overlay" style="display:none">
      <div class="overlay-card">
        <h2 id="gameover-title">GAME OVER</h2>
        <p id="gameover-message" class="story-setting"></p>
        <button id="restart-btn" class="game-btn" onclick="location.reload()">↩ RESTART</button>
      </div>
    </div>
  </div>

  <!-- 共享引擎层(PixelFarm 自绘 Phaser HUD,DOM HUD 仅用 score/objective/gameover) -->
  <script src="../_engine/hud.js"></script>
  <!-- 数据(地图/瓦片/实体 + 深度常量) -->
  <script src="game/config.js"></script>
  <script src="game/data.js"></script>
  <!-- 场景核心 + 系统模块(原型分割) -->
  <script src="game/scenes/MainScene.js"></script>
  <script src="game/systems/world.js"></script>
  <script src="game/systems/hud.js"></script>
  <script src="game/systems/items.js"></script>
  <script src="game/systems/fx.js"></script>
  <script src="game/systems/flow.js"></script>
  <!-- Phaser 装配 -->
  <script src="game/main.js"></script>
  <script>
    /* Fit the whole stage (canvas + HUD overlays) to the viewport so everything
       scales as one piece — keeps HUD proportions correct at any screen size. */
    (function () {
      var W = 800, H = 600;
      var wrap = document.getElementById('game-wrapper');
      function fit() {
        if (!wrap) return;
        var s = Math.min(window.innerWidth / W, window.innerHeight / H, 1);
        wrap.style.transform = 'scale(' + s + ')';
      }
      window.addEventListener('resize', fit);
      window.addEventListener('orientationchange', fit);
      fit();
    })();
  </script>
</body>
</html>
