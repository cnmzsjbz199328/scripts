<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#080c18"/>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop stop-color="#60a5fa"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
  </defs>
  <!-- controller body -->
  <rect x="4" y="9" width="24" height="14" rx="7" fill="url(#g)"/>
  <!-- grips -->
  <rect x="4" y="16" width="8" height="9" rx="4" fill="url(#g)"/>
  <rect x="20" y="16" width="8" height="9" rx="4" fill="url(#g)"/>
  <!-- d-pad horizontal -->
  <rect x="7" y="13" width="7" height="3" rx="1" fill="#060a14" opacity="0.7"/>
  <!-- d-pad vertical -->
  <rect x="10" y="10" width="3" height="9" rx="1" fill="#060a14" opacity="0.7"/>
  <!-- face buttons -->
  <circle cx="22" cy="13" r="1.8" fill="#060a14" opacity="0.7"/>
  <circle cx="25" cy="16" r="1.8" fill="#060a14" opacity="0.7"/>
  <circle cx="19" cy="16" r="1.8" fill="#060a14" opacity="0.7"/>
  <circle cx="22" cy="19" r="1.8" fill="#060a14" opacity="0.7"/>
</svg>
