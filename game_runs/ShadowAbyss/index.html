<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>影渊：但丁的下降</title>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #05060c; color: #e8d6b0;
      font-family: 'Georgia', 'Segoe UI', serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; overflow: hidden;
    }
    #game-wrapper {
      position: relative; width: 960px; height: 540px; flex: 0 0 auto;
      border: 3px solid #3a2418; border-radius: 8px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
      overflow: hidden; transform-origin: center center;
    }
    #hud {
      display: none; position: absolute; top: 0; left: 0; right: 0;
      padding: 10px 16px; gap: 18px; flex-direction: row; align-items: center;
      background: linear-gradient(to bottom, rgba(0,0,0,0.6), transparent);
      pointer-events: none; z-index: 10; font-size: 15px; user-select: none;
    }
    #hud-hearts { color: #ff5a4a; letter-spacing: 2px; font-size: 17px; }
    #hud-objective { color: #d8b98a; flex: 1; text-align: center; font-style: italic; }
    .game-overlay {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      z-index: 20; background: rgba(5, 6, 12, 0.92);
    }
    .overlay-card {
      text-align: center; max-width: 560px; padding: 36px 42px;
      background: rgba(10, 8, 14, 0.95); border: 1px solid #3a2418; border-radius: 12px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.7);
    }
    .overlay-card h2 { font-size: 2rem; margin-bottom: 10px; color: #e8d6b0; letter-spacing: 0.1em; }
    .overlay-card .tagline { font-size: 0.95rem; color: #9a8f7a; margin-bottom: 16px; font-style: italic; }
    .overlay-card .story-setting { font-size: 0.9rem; color: #6f6657; line-height: 1.7; margin-bottom: 24px; }
    .overlay-card .controls-hint { font-size: 0.78rem; color: #564e42; line-height: 1.8; margin-top: 14px; }
    .game-btn {
      display: inline-block; padding: 12px 38px; font-size: 1rem; font-weight: 700;
      letter-spacing: 0.12em; border: none; border-radius: 6px; cursor: pointer;
      transition: transform 0.1s, box-shadow 0.1s; font-family: 'Georgia', serif;
    }
    .game-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(0,0,0,0.5); }
    #start-btn { background: #8a3a1e; color: #f3e3c4; }
    #restart-btn { background: #6a2618; color: #f3e3c4; }
    #gameover-title.win { color: #e8b86a; }
    #gameover-title.lose { color: #c4503a; }
    html, body { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="game-wrapper">
    <div id="game-container"></div>

    <div id="hud">
      <div id="hud-hearts" title="生命">❤❤❤</div>
      <div id="hud-objective"><span id="hud-objective-text">跟随维吉尔，走向地狱第一层。</span></div>
    </div>

    <div id="start-screen" class="game-overlay">
      <div class="overlay-card">
        <h2>影渊：但丁的下降</h2>
        <p class="tagline">地狱有九层，光在最底下——跟着维吉尔，一层层走下去。</p>
        <p class="story-setting">一片永夜的幽冥深渊。九层地狱沿着不断下沉的螺旋旋落，每一层封存着一种罪。你是手持微光的旅人但丁，被一道比你亮一线的引路魂魄领着，向最深处走去。</p>
        <button id="start-btn" class="game-btn" onclick="window.__hudStart()">▶ 进入地狱</button>
        <p class="controls-hint">
          ← → / A D 行走　·　↑ / W / 空格 跳（长按更高）<br>
          叙事卡：空格继续　·　抉择：1 拉住 / 2 冲过
        </p>
      </div>
    </div>

    <div id="gameover-screen" class="game-overlay" style="display:none">
      <div class="overlay-card">
        <h2 id="gameover-title">GAME OVER</h2>
        <p id="gameover-message" class="story-setting"></p>
        <button id="restart-btn" class="game-btn" onclick="location.reload()">↩ 重来</button>
      </div>
    </div>
  </div>

  <script src="../_engine/hud.js"></script>
  <script src="game/config.js"></script>
  <script src="game/levels.js"></script>
  <script src="game/scenes/AbyssScene.js"></script>
  <script src="game/systems/world.js"></script>
  <script src="game/systems/hazards.js"></script>
  <script src="game/systems/cards.js"></script>
  <script src="game/systems/flow.js"></script>
  <script src="game/main.js"></script>
  <script>
    (function () {
      var W = 960, H = 540, wrap = document.getElementById('game-wrapper');
      function fit() {
        if (!wrap) return;
        var s = Math.min(window.innerWidth / W, window.innerHeight / H, 1);
        wrap.style.transform = 'scale(' + s + ')';
      }
      window.addEventListener('resize', fit);
      window.addEventListener('orientationchange', fit);
      fit();
    })();
  </script>
</body>
</html>
