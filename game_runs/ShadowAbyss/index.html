<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>影渊：神曲</title>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #05060c; color: #e8d6b0;
      font-family: 'Georgia', 'Segoe UI', serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; overflow: hidden;
    }
    #game-wrapper {
      position: relative; width: 960px; height: 540px; flex: 0 0 auto;
      border: 3px solid #3a2418; border-radius: 8px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
      overflow: hidden; transform-origin: center center;
    }
    #hud {
      display: none; position: absolute; top: 0; left: 0; right: 0;
      padding: 10px 16px; gap: 18px; flex-direction: row; align-items: center;
      background: linear-gradient(to bottom, rgba(0,0,0,0.55), transparent);
      pointer-events: none; z-index: 10; font-size: 15px; user-select: none;
    }
    #hud-objective { color: #d8b98a; flex: 1; text-align: center; font-style: italic; }
    .game-overlay {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      z-index: 20; background: rgba(5, 6, 12, 0.92);
      background-size: cover; background-position: center;
    }
    #start-screen { background-image: linear-gradient(rgba(5,6,12,0.72), rgba(5,6,12,0.88)), url('scene/cover.png'); }
    .overlay-card {
      text-align: center; max-width: 600px; padding: 36px 42px;
      background: rgba(10, 8, 14, 0.9); border: 1px solid #3a2418; border-radius: 12px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.7);
    }
    .overlay-card h2 { font-size: 2rem; margin-bottom: 10px; color: #e8d6b0; letter-spacing: 0.14em; }
    .overlay-card .tagline { font-size: 0.95rem; color: #9a8f7a; margin-bottom: 16px; font-style: italic; }
    .overlay-card .story-setting { font-size: 0.9rem; color: #8a8071; line-height: 1.8; margin-bottom: 24px; white-space: pre-line; }
    .overlay-card .controls-hint { font-size: 0.78rem; color: #564e42; line-height: 1.8; margin-top: 14px; }
    .game-btn {
      display: inline-block; padding: 12px 38px; font-size: 1rem; font-weight: 700;
      letter-spacing: 0.12em; border: none; border-radius: 6px; cursor: pointer;
      transition: transform 0.1s, box-shadow 0.1s; font-family: 'Georgia', serif;
    }
    .game-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(0,0,0,0.5); }
    #start-btn { background: #8a3a1e; color: #f3e3c4; }
    #restart-btn { background: #6a2618; color: #f3e3c4; }
    #gameover-title.win { color: #e8b86a; }
    #gameover-title.lose { color: #c4503a; }
    #gameover-message { white-space: pre-line; }
    html, body { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="game-wrapper">
    <div id="game-container"></div>

    <div id="hud">
      <div id="hud-objective"><span id="hud-objective-text">Ⅰ 黑暗森林</span></div>
    </div>

    <div id="start-screen" class="game-overlay">
      <div class="overlay-card">
        <h2>影渊：神曲</h2>
        <p class="tagline">地狱、炼狱与天堂——一场必须走完的旅程。</p>
        <p class="story-setting">你在人生旅程的中途醒来，发觉自己迷失于一座幽暗的森林。
穿越地狱、炼狱与天堂三界，唯有走完全程，才能见到那推动太阳和群星的爱。
你的每一次抉择都会积聚或耗散「光照」——它决定你最终能否承受那至高的幻象。六种结局。</p>
        <button id="start-btn" class="game-btn" onclick="window.__hudStart()">▶ 启程</button>
        <p class="controls-hint">
          空格 / 点击 推进叙事　·　数字 1 / 2 做出抉择<br>
          抉择没有对错，但地狱会记住每一次伸出的手
        </p>
      </div>
    </div>

    <div id="gameover-screen" class="game-overlay" style="display:none">
      <div class="overlay-card">
        <h2 id="gameover-title">FIN</h2>
        <p id="gameover-message" class="story-setting"></p>
        <button id="restart-btn" class="game-btn" onclick="location.reload()">↩ 再走一次</button>
      </div>
    </div>
  </div>

  <script src="../_engine/hud.js"></script>
  <script src="game/config.js"></script>
  <script src="game/storyData.js"></script>
  <script src="game/scenes/StoryScene.js"></script>
  <script src="game/systems/runtime.js"></script>
  <script src="game/systems/ui.js"></script>
  <script src="game/main.js"></script>
  <script>
    (function () {
      var W = 960, H = 540, wrap = document.getElementById('game-wrapper');
      function fit() {
        if (!wrap) return;
        var s = Math.min(window.innerWidth / W, window.innerHeight / H, 1);
        wrap.style.transform = 'scale(' + s + ')';
      }
      window.addEventListener('resize', fit);
      window.addEventListener('orientationchange', fit);
      fit();
    })();
  </script>
</body>
</html>
