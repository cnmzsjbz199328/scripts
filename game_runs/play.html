<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#000">
  <title>Loading…</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root { --pad-h: 180px; }

    html, body {
      width: 100%; height: 100%; background: #000;
      overflow: hidden; touch-action: none;
      -webkit-user-select: none; -moz-user-select: none; user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* ── Back button ── */
    #back-btn {
      position: fixed; top: 12px; left: 12px; z-index: 200;
      background: rgba(8,12,24,.82); border: 1px solid #1a2540;
      color: #94a3b8; font-size: .76rem; font-family: 'Segoe UI', system-ui, sans-serif;
      padding: 6px 14px; border-radius: 6px; cursor: pointer;
      text-decoration: none; display: flex; align-items: center; gap: 6px;
      backdrop-filter: blur(10px); transition: color .15s, border-color .15s;
    }
    #back-btn:hover { color: #e2e8f0; border-color: #2a3d5e; }
    #back-btn { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }

    /* ── Frame wrap ── */
    #frame-wrap {
      position: fixed; inset: 0;
      overflow: hidden; background: #000;
    }
    .touch-device #frame-wrap { bottom: var(--pad-h); }

    /* Games are self-responsive (Phaser Scale.FIT), so the frame just fills
       the available space — no transform scaling or viewport hacks needed. */
    #game-frame {
      border: none; display: block;
      width: 100%; height: 100%;
    }

    /* ── Virtual gamepad ── */
    #gamepad {
      display: none;
      position: fixed; bottom: 0; left: 0; right: 0;
      height: var(--pad-h);
      background: rgba(4,8,20,.94);
      border-top: 1px solid #1a2540;
      backdrop-filter: blur(16px);
      align-items: center; justify-content: space-between;
      padding: 14px 28px;
      touch-action: none; user-select: none; z-index: 100;
    }
    .touch-device #gamepad { display: flex; }

    /* D-pad */
    #dpad {
      display: grid;
      grid-template-columns: repeat(3, 48px);
      grid-template-rows: repeat(3, 48px);
      gap: 6px;
    }
    .dp {
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(145deg, rgba(255,255,255,.11), rgba(255,255,255,.04));
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 12px; color: #cbd5e1;
      font-size: 1.15rem; cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.08);
      -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      transition: transform .06s ease, background .1s, border-color .1s, box-shadow .1s;
    }
    .dp.active {
      background: linear-gradient(145deg, rgba(96,165,250,.45), rgba(96,165,250,.20));
      border-color: rgba(96,165,250,.7);
      color: #fff;
      box-shadow: 0 0 14px rgba(96,165,250,.6), inset 0 1px 0 rgba(255,255,255,.18);
      transform: scale(.9);
    }
    .dp-center {
      background: rgba(255,255,255,.03) !important;
      border-color: rgba(255,255,255,.06) !important;
      border-radius: 50% !important;
      box-shadow: none !important;
      pointer-events: none;
    }

    /* Action buttons */
    #action-btns {
      display: flex; flex-wrap: wrap;
      gap: 10px; justify-content: flex-end; align-items: center;
      max-width: 240px;
    }
    .ab {
      width: 56px; height: 56px; border-radius: 50%;
      border: 2px solid; background: rgba(0,0,0,.4);
      font-size: .66rem; font-weight: 700; letter-spacing: .02em;
      text-align: center; line-height: 1.2;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.06);
      -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      transition: transform .06s ease, background .1s, box-shadow .1s;
    }
    .ab.active {
      transform: scale(.88);
      background: rgba(255,255,255,.12);
      box-shadow: 0 0 16px currentColor, inset 0 0 10px rgba(255,255,255,.14);
    }

    /* ── Portrait orientation adjustments ── */
    /* In portrait the landscape game canvas is constrained by width (~40% scale).
       Top-align it so the black gap is below the game (near thumbs) not above. */
    @media (orientation: portrait) {
      .touch-device #frame-wrap { padding-top: 30px; } /* clearance for #orient-tip */
    }

    /* Landscape orientation tip */
    #orient-tip {
      display: none;
      position: fixed; top: 0; left: 0; right: 0; z-index: 300;
      background: rgba(10,16,32,.92); border-bottom: 1px solid #1a2540;
      color: #64748b; font-size: .72rem; font-family: system-ui, sans-serif;
      text-align: center; padding: 6px 12px;
      letter-spacing: .02em;
    }
    @media (orientation: portrait) {
      #orient-tip { display: block; }
    }
  </style>
</head>
<body>

<div id="orient-tip">↺ 横屏游玩效果更佳</div>
<a id="back-btn" href="./">← 返回</a>

<div id="frame-wrap">
  <iframe id="game-frame"
    allow="autoplay"
    sandbox="allow-scripts allow-same-origin allow-forms"
    allowfullscreen
  ></iframe>
</div>

<div id="gamepad">
  <div id="dpad"></div>
  <div id="action-btns"></div>
</div>

<script>
(() => {
  'use strict';

  // ── Phaser KeyCode name → browser key info ────────────────────
  // label is only set when the key name differs from what we show on the button
  const KC = {
    A:{key:'a',code:'KeyA',keyCode:65},   B:{key:'b',code:'KeyB',keyCode:66},
    C:{key:'c',code:'KeyC',keyCode:67},   D:{key:'d',code:'KeyD',keyCode:68},
    E:{key:'e',code:'KeyE',keyCode:69},   F:{key:'f',code:'KeyF',keyCode:70},
    G:{key:'g',code:'KeyG',keyCode:71},   H:{key:'h',code:'KeyH',keyCode:72},
    I:{key:'i',code:'KeyI',keyCode:73},   J:{key:'j',code:'KeyJ',keyCode:74},
    K:{key:'k',code:'KeyK',keyCode:75},   L:{key:'l',code:'KeyL',keyCode:76},
    M:{key:'m',code:'KeyM',keyCode:77},   N:{key:'n',code:'KeyN',keyCode:78},
    O:{key:'o',code:'KeyO',keyCode:79},   P:{key:'p',code:'KeyP',keyCode:80},
    Q:{key:'q',code:'KeyQ',keyCode:81},   R:{key:'r',code:'KeyR',keyCode:82},
    S:{key:'s',code:'KeyS',keyCode:83},   T:{key:'t',code:'KeyT',keyCode:84},
    U:{key:'u',code:'KeyU',keyCode:85},   V:{key:'v',code:'KeyV',keyCode:86},
    W:{key:'w',code:'KeyW',keyCode:87},   X:{key:'x',code:'KeyX',keyCode:88},
    Y:{key:'y',code:'KeyY',keyCode:89},   Z:{key:'z',code:'KeyZ',keyCode:90},
    ONE:  {key:'1',code:'Digit1',keyCode:49,label:'1'},
    TWO:  {key:'2',code:'Digit2',keyCode:50,label:'2'},
    THREE:{key:'3',code:'Digit3',keyCode:51,label:'3'},
    FOUR: {key:'4',code:'Digit4',keyCode:52,label:'4'},
    FIVE: {key:'5',code:'Digit5',keyCode:53,label:'5'},
    SIX:  {key:'6',code:'Digit6',keyCode:54,label:'6'},
    SEVEN:{key:'7',code:'Digit7',keyCode:55,label:'7'},
    EIGHT:{key:'8',code:'Digit8',keyCode:56,label:'8'},
    NINE: {key:'9',code:'Digit9',keyCode:57,label:'9'},
    ZERO: {key:'0',code:'Digit0',keyCode:48,label:'0'},
    SPACE:{key:' ',code:'Space', keyCode:32,label:'SPC'},
    ENTER:{key:'Enter',code:'Enter',keyCode:13,label:'ENT'},
    SHIFT:{key:'Shift',code:'ShiftLeft',keyCode:16,label:'SHF'},
    // Arrow keys — handled by D-pad, listed only for the exclusion set
    UP:   {key:'ArrowUp',   code:'ArrowUp',   keyCode:38},
    DOWN: {key:'ArrowDown', code:'ArrowDown', keyCode:40},
    LEFT: {key:'ArrowLeft', code:'ArrowLeft', keyCode:37},
    RIGHT:{key:'ArrowRight',code:'ArrowRight',keyCode:39},
  };

  // Keys covered by the D-pad — never generate action buttons for these
  const DPAD_EXCLUDE = new Set(['W','A','S','D','UP','DOWN','LEFT','RIGHT']);

  // Rotating palette for auto-generated buttons
  const COLORS = [
    '#f97316','#a78bfa','#4ade80','#fbbf24',
    '#00e5ff','#ef4444','#60a5fa','#f472b6',
    '#34d399','#fb923c','#e879f9','#38bdf8',
  ];

  // Script injected into the iframe on load.
  // 1. Intercepts 'blur' in capture phase — Phaser's bubble-phase blur handler
  //    never fires, so it never clears keyboard state when the gamepad is touched.
  // 2. Receives postMessage from play.html and re-dispatches a KeyboardEvent
  //    inside the iframe's own window — same-window events are fully trusted by Phaser.
  const BRIDGE = `(function(){
    window.addEventListener('blur',function(e){e.stopImmediatePropagation();},true);
    window.addEventListener('message',function(e){
      var d=e.data;
      if(!d||d._t!=='gk') return;
      window.dispatchEvent(new KeyboardEvent(d.ev,{
        key:d.key,code:d.code,keyCode:d.kc,which:d.kc,bubbles:true,cancelable:true
      }));
    });
  })();`;

  // D-pad directions: each fires both the arrow key AND the WASD equivalent
  const DPAD_DIRS = [
    { row:1,col:2,label:'▲',pairs:[['ArrowUp','ArrowUp',38],['w','KeyW',87]] },
    { row:2,col:1,label:'◀',pairs:[['ArrowLeft','ArrowLeft',37],['a','KeyA',65]] },
    { row:2,col:3,label:'▶',pairs:[['ArrowRight','ArrowRight',39],['d','KeyD',68]] },
    { row:3,col:2,label:'▼',pairs:[['ArrowDown','ArrowDown',40],['s','KeyS',83]] },
  ];

  // ── Setup ─────────────────────────────────────────────────────
  const params = new URLSearchParams(location.search);
  const gameId = params.get('game') || '';
  const frame  = document.getElementById('game-frame');

  const isTouch = navigator.maxTouchPoints > 0 || 'ontouchstart' in window;
  if (isTouch) document.body.classList.add('touch-device');

  fetch('./games.json')
    .then(r => r.json())
    .then(games => {
      const g = games.find(x => x.id === gameId);
      document.title = g ? g.title : gameId;
      frame.src = g ? `./${g.path}` : `./${gameId}/index.html`;
    })
    .catch(() => { frame.src = `./${gameId}/index.html`; });

  // ── Send key event via postMessage (bridge inside iframe handles it) ──
  function fireKey(type, key, code, keyCode) {
    try {
      frame.contentWindow?.postMessage({ _t:'gk', ev:type, key, code, kc:keyCode }, '*');
    } catch(_) {}
  }

  // ── Button press tracking — prevents stuck keys on blur/overlay ──
  const pressed = new Set();
  function bindBtn(el, onDown, onUp) {
    const press = () => {
      if (pressed.has(el)) return;
      pressed.add(el); el.classList.add('active'); onDown();
    };
    el._release = () => {
      if (!pressed.has(el)) return;
      pressed.delete(el); el.classList.remove('active'); onUp();
    };
    el.addEventListener('touchstart', e => { e.preventDefault(); press();       }, { passive:false });
    el.addEventListener('touchend',   e => { e.preventDefault(); el._release(); }, { passive:false });
    el.addEventListener('touchcancel',e => { e.preventDefault(); el._release(); }, { passive:false });
    el.addEventListener('mousedown',  () => press());
    el.addEventListener('mouseup',    () => el._release());
    el.addEventListener('mouseleave', () => el._release());
  }
  function releaseAll() { [...pressed].forEach(el => el._release && el._release()); }
  window.addEventListener('blur', releaseAll);
  document.addEventListener('visibilitychange', () => { if (document.hidden) releaseAll(); });

  // ── Build D-pad (always present) ─────────────────────────────
  const dpadEl = document.getElementById('dpad');
  const dirMap = {};
  DPAD_DIRS.forEach(d => { dirMap[`${d.row},${d.col}`] = d; });
  for (let r = 1; r <= 3; r++) {
    for (let c = 1; c <= 3; c++) {
      const el = document.createElement('div');
      const dir = dirMap[`${r},${c}`];
      if (r === 2 && c === 2) {
        el.className = 'dp dp-center';
      } else if (dir) {
        el.className = 'dp';
        el.textContent = dir.label;
        bindBtn(el,
          () => dir.pairs.forEach(([k,co,kc]) => fireKey('keydown',k,co,kc)),
          () => dir.pairs.forEach(([k,co,kc]) => fireKey('keyup',  k,co,kc))
        );
      } else {
        el.style.visibility = 'hidden';
      }
      dpadEl.appendChild(el);
    }
  }

  // ── Auto-scan the game's own <script src> files for registered keys ──
  // Older games bundle everything into one game/game-logic.js; newer games
  // (the multi-file "golden template": config.js + systems/*.js + scenes/*.js
  // + main.js) have no such file, so we read index.html itself to find every
  // local <script src> it loads and scan all of them concatenated.
  // Primary scan: every Phaser.Input.Keyboard.KeyCodes.X reference.
  // Secondary scan: createCursorKeys() implicit keys — cursors.space /
  //   cursors.shift are not registered via addKey(), so the primary regex
  //   misses them (affects e.g. NinjaCat / MermaidPrincess jump).
  // Filters out D-pad keys (W/A/S/D + arrows). Returns keys in source order.
  async function scanKeys(frameSrc) {
    const base = frameSrc.replace(/\/index\.html(\?.*)?$/, '/');
    try {
      const html = await fetch(frameSrc).then(r => {
        if (!r.ok) throw new Error(r.status);
        return r.text();
      });

      // Local scripts only — skip the Phaser CDN / absolute URLs.
      const srcs = [...html.matchAll(/<script[^>]+src=["']([^"']+)["']/gi)]
        .map(m => m[1])
        .filter(s => !/^(https?:)?\/\//.test(s));

      const texts = await Promise.all(srcs.map(s =>
        fetch(new URL(s, base)).then(r => r.ok ? r.text() : '').catch(() => '')));
      const text = texts.join('\n');
      const seen = new Set();

      // Primary: explicit addKey / KeyCodes references
      const re = /Phaser\.Input\.Keyboard\.KeyCodes\.([A-Z0-9_]+)/g;
      let m;
      while ((m = re.exec(text)) !== null) {
        const name = m[1];
        if (KC[name] && !DPAD_EXCLUDE.has(name)) seen.add(name);
      }

      // Primary-b: addKeys('W,A,S,D,J,K,L,SPACE,ENTER') string shorthand.
      // Several games register keys this way instead of KeyCodes.X, so the
      // regex above misses them and their action buttons silently vanish
      // (e.g. ShadowArena J/K/L, DustOutlaw J, the SPACE-jump platformers).
      const ak = /addKeys\s*\(\s*['"`]([^'"`]+)['"`]/g;
      while ((m = ak.exec(text)) !== null) {
        m[1].split(',').forEach(raw => {
          const name = raw.trim().toUpperCase();
          if (KC[name] && !DPAD_EXCLUDE.has(name)) seen.add(name);
        });
      }

      // Secondary: implicit keys from createCursorKeys()
      if (/cursors\.space\b/.test(text) && !seen.has('SPACE')) seen.add('SPACE');
      if (/cursors\.shift\b/.test(text) && !seen.has('SHIFT')) seen.add('SHIFT');

      if (seen.size) return [...seen];

      // Fallback for inline / non-Phaser games with no scannable script tags:
      // the game declares its action keys via <meta name="mobile-keys" content="F,G">
      // in index.html. D-pad still covers movement (WASD + arrows) as usual.
      const m2 = html.match(/<meta\s+name=["']mobile-keys["']\s+content=["']([^"']+)["']/i);
      if (m2) {
        return m2[1].split(',')
          .map(s => s.trim().toUpperCase())
          .filter(name => KC[name] && !DPAD_EXCLUDE.has(name));
      }
      return [];
    } catch(_) {
      return [];
    }
  }

  // ── Build action buttons from scanned key names ───────────────
  function buildActionBtns(keyNames) {
    const actEl = document.getElementById('action-btns');
    actEl.innerHTML = '';
    keyNames.forEach((name, i) => {
      const info = KC[name];
      const el   = document.createElement('div');
      el.className = 'ab';
      el.textContent = info.label ?? name;   // e.g. 'J', 'SPC', '1'
      const color = COLORS[i % COLORS.length];
      el.style.borderColor = color;
      el.style.color = color;
      bindBtn(el,
        () => fireKey('keydown', info.key, info.code, info.keyCode),
        () => fireKey('keyup',   info.key, info.code, info.keyCode)
      );
      actEl.appendChild(el);
    });
  }

  // ── On iframe load: inject bridge, scan keys, build buttons ───
  frame.addEventListener('load', async () => {
    const src = frame.src;
    // Skip the initial empty/about:blank load
    if (!src || !src.includes('index.html')) return;

    // 1. Inject bridge into iframe (blur-intercept + postMessage relay)
    try {
      const doc = frame.contentDocument;
      const s = doc.createElement('script');
      s.textContent = BRIDGE;
      (doc.head || doc.body || doc.documentElement).appendChild(s);
    } catch(_) {}

    // 2. Only build buttons on touch devices
    if (!isTouch) return;

    // 3. Scan & build
    const keyNames = await scanKeys(src);
    buildActionBtns(keyNames);
  });

})();
</script>
</body>
</html>
