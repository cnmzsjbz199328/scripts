<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>美人鱼公主梦幻历险 (Mermaid Princess)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: radial-gradient(circle at center, #0b1a3d 0%, #040710 100%);
      color: #f8f8f2;
      font-family: 'Outfit', 'Segoe UI', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* Floating background bubbles */
    .bg-bubbles {
      position: absolute;
      inset: 0;
      overflow: hidden;
      z-index: 0;
      pointer-events: none;
    }
    .bg-bubble {
      position: absolute;
      bottom: -100px;
      background: rgba(139, 233, 253, 0.12);
      border: 1.5px solid rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      animation: floatUp 8s infinite linear;
    }
    @keyframes floatUp {
      0% { transform: translateY(0) translateX(0); opacity: 0; }
      10% { opacity: 0.6; }
      90% { opacity: 0.6; }
      100% { transform: translateY(-120vh) translateX(50px); opacity: 0; }
    }

    /* ── game wrapper ── */
    #game-wrapper {
      position: relative;
      border: 4px solid #8be9fd;
      border-radius: 16px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 35px rgba(139, 233, 253, 0.2);
      overflow: hidden;
      z-index: 1;
      background: #000;
    }

    /* ── HUD overlay ── */
    #hud {
      display: none;
      position: absolute;
      top: 16px; left: 16px; right: 16px;
      padding: 12px 24px;
      gap: 20px;
      flex-direction: row;
      align-items: center;
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(139, 233, 253, 0.25);
      border-radius: 50px;
      pointer-events: none;
      z-index: 10;
      font-size: 16px;
      font-weight: 600;
      user-select: none;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }

    #hud-hearts { 
      color: #ff79c6; 
      letter-spacing: 4px; 
      font-size: 22px; 
      text-shadow: 0 0 8px rgba(255, 121, 198, 0.6);
    }
    #hud-score { 
      color: #ffb86c; 
      text-shadow: 0 0 8px rgba(255, 184, 108, 0.4);
    }
    #hud-objective { 
      color: #8be9fd; 
      flex: 1; 
      text-align: center;
      font-size: 14px;
      font-weight: 500;
      text-shadow: 0 0 6px rgba(139, 233, 253, 0.4);
      background: rgba(255,255,255,0.05);
      padding: 6px 16px;
      border-radius: 20px;
    }

    /* ── shared overlay styles ── */
    .game-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
      background: rgba(6, 11, 25, 0.82);
      backdrop-filter: blur(10px);
    }

    .overlay-card {
      text-align: center;
      max-width: 580px;
      padding: 40px 48px;
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.9) 0%, rgba(30, 41, 59, 0.95) 100%);
      border: 2px solid rgba(139, 233, 253, 0.3);
      border-radius: 24px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.6), 0 0 40px rgba(139, 233, 253, 0.15);
      animation: cardAppear 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes cardAppear {
      from { transform: scale(0.8) translateY(20px); opacity: 0; }
      to { transform: scale(1) translateY(0); opacity: 1; }
    }

    .overlay-card h2 {
      font-size: 2.4rem;
      font-weight: 800;
      margin-bottom: 12px;
      background: linear-gradient(to right, #8be9fd, #ff79c6, #ffb86c);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 10px 20px rgba(0,0,0,0.3);
      letter-spacing: 0.05em;
    }

    .overlay-card .tagline {
      font-size: 1.1rem;
      color: #bd93f9;
      margin-bottom: 20px;
      font-style: italic;
      font-weight: 600;
    }

    .overlay-card .story-setting {
      font-size: 0.95rem;
      color: #a4b0be;
      line-height: 1.7;
      margin-bottom: 28px;
      background: rgba(255, 255, 255, 0.03);
      padding: 16px 20px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .overlay-card .controls-hint {
      font-size: 0.85rem;
      color: #6272a4;
      line-height: 1.8;
      margin-top: 18px;
      background: rgba(0,0,0,0.2);
      padding: 8px;
      border-radius: 8px;
    }

    /* ── buttons ── */
    .game-btn {
      display: inline-block;
      padding: 14px 44px;
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      color: #fff;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }

    .game-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(139, 233, 253, 0.4);
    }

    .game-btn:active {
      transform: translateY(-1px);
    }

    #start-btn {
      background: linear-gradient(90deg, #ff79c6 0%, #bd93f9 100%);
      border: 1px solid rgba(255,255,255,0.2);
    }
    
    #start-btn:hover {
      background: linear-gradient(90deg, #ff92d0 0%, #c8a2ff 100%);
    }

    #restart-btn {
      background: linear-gradient(90deg, #ff5555 0%, #ff79c6 100%);
      border: 1px solid rgba(255,255,255,0.2);
    }

    /* ── game-over title colours ── */
    #gameover-title.win {
      background: linear-gradient(to right, #50fa7b, #8be9fd);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 800;
    }
    #gameover-title.lose {
      background: linear-gradient(to right, #ff5555, #ff79c6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 800;
    }
    /* ── responsive stage scaling (canvas + HUD scale together) ── */
    html, body { width: 100%; height: 100%; }
    #game-wrapper {
      width: 960px; height: 640px;
      flex: 0 0 auto;
      transform-origin: center center;
    }
    /* ── 开场遮罩 · 主题化 BEGIN（只作用于 #start-screen；胜负遮罩仍用通用卡）── */
    #start-screen { flex-direction: column; overflow: hidden; backdrop-filter: none; }    #start-screen { background: linear-gradient(180deg, rgba(10,30,70,.1), rgba(8,14,40,.6)), url('scene/panorama.jpg') center / cover, #0b1a3a; }
    #start-screen .mp-rays { position: absolute; inset: -20% -10% 0; pointer-events: none;
      background: repeating-linear-gradient(100deg, rgba(180,230,255,.10) 0 28px, transparent 28px 90px);
      -webkit-mask-image: linear-gradient(#000, transparent 70%); mask-image: linear-gradient(#000, transparent 70%);
      animation: mp-sway 7s ease-in-out infinite alternate; }
    #start-screen .mp-bubble { position: absolute; bottom: -24px; border-radius: 50%; border: 1.5px solid rgba(220,245,255,.65); pointer-events: none;
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,.75) 0 14%, rgba(180,230,255,.08) 42%, transparent 70%);
      animation-name: mp-rise; animation-timing-function: linear; animation-iteration-count: infinite; }
    #start-screen .mp-wrap { position: relative; display: flex; flex-direction: column; align-items: center; text-align: center; margin-top: -20px; }
    #start-screen .mp-script { margin-bottom: -6px; font-family: 'Dancing Script', cursive; font-size: 36px; color: #ffd6f0; transform: rotate(-4deg);
      text-shadow: 0 0 14px rgba(255,140,220,.7); }
    #start-screen .mp-title { margin: 0; font-family: 'ZCOOL XiaoWei', serif; font-weight: 400; font-size: 76px; line-height: 1.2; letter-spacing: .12em;
      background: linear-gradient(90deg, #ffd1ef, #fff6fd 35%, #b9f3ff 65%, #ffd1ef); background-size: 200% 100%;
      -webkit-background-clip: text; background-clip: text; color: transparent;
      filter: drop-shadow(0 0 12px rgba(160,220,255,.55)); animation: mp-shimmer 5s linear infinite; }
    #start-screen .mp-sub { margin-top: 2px; font-family: 'ZCOOL XiaoWei', serif; font-size: 20px; letter-spacing: .6em; color: #bfeaff; }
    #start-screen .mp-story { margin-top: 14px; max-width: 520px; font-size: 14px; line-height: 1.9; color: #d6ecff; text-shadow: 0 1px 4px rgba(0,0,30,.6); }
    #start-screen .mp-pearls { display: flex; gap: 14px; margin: 14px 0 2px; }
    #start-screen .mp-pearl { width: 32px; height: 32px; background: url('assets/objects/pearl.webp') 0 0 / 192px 32px no-repeat; animation: mp-pearl .9s steps(6) infinite; }
    #start-screen .mp-btn { margin-top: 12px; padding: 11px 46px; cursor: pointer; border-radius: 999px; border: 1px solid rgba(255,255,255,.75);
      font-family: 'ZCOOL XiaoWei', serif; font-size: 24px; letter-spacing: .3em; color: #5b2a6e;
      background: linear-gradient(120deg, #fff 0%, #ffd6f0 30%, #e0d4ff 55%, #c8f4ff 80%, #fff 100%); background-size: 220% 100%;
      box-shadow: 0 0 22px rgba(255,200,240,.55), inset 0 -3px 8px rgba(150,110,200,.25); animation: mp-shimmer 4s linear infinite; transition: transform .15s; }
    #start-screen .mp-btn:hover { transform: scale(1.05); }
    #start-screen .mp-keys { margin-top: 16px; display: flex; gap: 20px; font-size: 13px; color: #bfe0f5; }
    #start-screen kbd { display: inline-block; margin: 0 2px; padding: 1px 7px; border-radius: 999px; font-family: 'Segoe UI', sans-serif; font-size: 11px;
      color: #fff; background: rgba(190,235,255,.18); border: 1px solid rgba(190,235,255,.55); }
    #start-screen .mp-girl { position: absolute; left: 64px; bottom: 80px; width: 192px; height: 208px;
      background: url('assets/sprites/MermaidPrincess.webp') 0 0 / 1728px 624px no-repeat;
      animation: mp-idle 1.1s steps(9) infinite, mp-bob 3s ease-in-out infinite; filter: drop-shadow(0 0 14px rgba(255,190,230,.45)); }
    @keyframes mp-idle { to { background-position: -1728px 0; } }
    @keyframes mp-bob { 50% { transform: translateY(-14px); } }
    @keyframes mp-rise { 0% { transform: translate(0,0); opacity: 0; } 10% { opacity: 1; } 100% { transform: translate(24px,-720px); opacity: 0; } }
    @keyframes mp-sway { from { transform: translateX(-30px) skewX(-4deg); } to { transform: translateX(30px) skewX(4deg); } }
    @keyframes mp-shimmer { to { background-position: 200% 0; } }
    @keyframes mp-pearl { to { background-position: -192px 0; } }
    @media (prefers-reduced-motion: reduce) { #start-screen, #start-screen * { animation: none !important; } }
    /* ── 开场遮罩 · 主题化 END ── */
  </style>
</head>
<body>
  <!-- Floating bubbles in document background -->
  <div class="bg-bubbles">
    <div class="bg-bubble" style="left: 8%; width: 32px; height: 32px; animation-delay: 0s; animation-duration: 8s;"></div>
    <div class="bg-bubble" style="left: 22%; width: 18px; height: 18px; animation-delay: 2s; animation-duration: 10s;"></div>
    <div class="bg-bubble" style="left: 38%; width: 50px; height: 50px; animation-delay: 1s; animation-duration: 12s;"></div>
    <div class="bg-bubble" style="left: 56%; width: 26px; height: 26px; animation-delay: 4s; animation-duration: 9s;"></div>
    <div class="bg-bubble" style="left: 72%; width: 44px; height: 44px; animation-delay: 3s; animation-duration: 11s;"></div>
    <div class="bg-bubble" style="left: 88%; width: 22px; height: 22px; animation-delay: 5s; animation-duration: 7s;"></div>
  </div>
  <div id="game-wrapper">
    <div id="game-container"></div>

    <!-- HUD overlay -->
    <div id="hud">
      <div id="hud-hearts" title="生命值">♥♥♥</div>
        <div id="hud-score">珍珠: <span id="hud-score-value">0</span></div>
        <div id="hud-objective"><span id="hud-objective-text">关卡 1: 在深海珊瑚礁中游动，收集珍珠，踩踏消灭章鱼怪和鲨鱼，并到达珊瑚螺门！</span></div>
    </div>

    <!-- Start screen overlay：海底光束 · 珍珠主题（无选择页的游戏保留这一次点击，样式见 style 末尾） -->
    <div id="start-screen" class="game-overlay">
      <div class="mp-rays" aria-hidden="true"></div>
      <span class="mp-bubble" style="left:8%;width:14px;height:14px;animation-duration:9s;animation-delay:0s"></span>
      <span class="mp-bubble" style="left:18%;width:8px;height:8px;animation-duration:7s;animation-delay:-3s"></span>
      <span class="mp-bubble" style="left:30%;width:18px;height:18px;animation-duration:11s;animation-delay:-6s"></span>
      <span class="mp-bubble" style="left:64%;width:10px;height:10px;animation-duration:8s;animation-delay:-2s"></span>
      <span class="mp-bubble" style="left:74%;width:16px;height:16px;animation-duration:10s;animation-delay:-5s"></span>
      <span class="mp-bubble" style="left:86%;width:9px;height:9px;animation-duration:7s;animation-delay:-1s"></span>
      <span class="mp-bubble" style="left:93%;width:13px;height:13px;animation-duration:12s;animation-delay:-8s"></span>
      <div class="mp-girl" aria-hidden="true"></div>
      <div class="mp-wrap">
        <div class="mp-script">Mermaid Princess</div>
        <h2 class="mp-title">美人鱼公主</h2>
        <div class="mp-sub">梦幻历险</div>
        <p class="mp-story">阳光穿过水面，洒在珊瑚礁、水母林与沉船宝窟之间。<br>游过深海，收集 100 颗珍珠，开启胜利之门。</p>
        <div class="mp-pearls" aria-hidden="true"><div class="mp-pearl"></div><div class="mp-pearl" style="animation-delay:-.15s"></div><div class="mp-pearl" style="animation-delay:-.3s"></div><div class="mp-pearl" style="animation-delay:-.45s"></div><div class="mp-pearl" style="animation-delay:-.6s"></div></div>
        <button id="start-btn" class="mp-btn" onclick="window.__hudStart()">潜入深海</button>
        <div class="mp-keys"><span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 游动</span><span><kbd>SHIFT</kbd> 冲刺</span></div>
      </div>
    </div>

    <!-- Game over overlay -->
    <div id="gameover-screen" class="game-overlay" style="display:none">
      <div class="overlay-card">
        <h2 id="gameover-title">GAME OVER</h2>
        <p id="gameover-message" class="story-setting"></p>
        <button id="restart-btn" class="game-btn" onclick="location.reload()">↩ RESTART</button>
      </div>
    </div>
  </div>

  <script>
    // MermaidPrincess 有玩家血量,沿用 ♥/♡ 字形。
    window.GAME_HUD_GLYPHS = { full: '♥', empty: '♡' };
  </script>
  <!-- 共享引擎层 -->
  <script src="../_engine/hud.js"></script>
  <!-- 数据(地图/瓦片/实体 + 深度常量) -->
  <script src="game/config.js"></script>
  <script src="game/data.js"></script>
  <!-- 场景核心 + 系统模块(原型分割) -->
  <script src="game/scenes/MainScene.js"></script>
  <script src="game/systems/world.js"></script>
  <script src="game/systems/player.js"></script>
  <script src="game/systems/flow.js"></script>
  <script src="game/systems/fx.js"></script>
  <!-- Phaser 装配 -->
  <script src="game/main.js"></script>
  <script>
    /* Fit the whole stage (canvas + HUD overlays) to the viewport so everything
       scales as one piece — keeps HUD proportions correct at any screen size. */
    (function () {
      var W = 960, H = 640;
      var wrap = document.getElementById('game-wrapper');
      function fit() {
        if (!wrap) return;
        var s = Math.min(window.innerWidth / W, window.innerHeight / H, 1);
        wrap.style.transform = 'scale(' + s + ')';
      }
      window.addEventListener('resize', fit);
      window.addEventListener('orientationchange', fit);
      fit();
    })();
  </script>
</body>
</html>
