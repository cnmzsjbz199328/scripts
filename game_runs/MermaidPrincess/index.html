<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>美人鱼公主梦幻历险 (Mermaid Princess)</title>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: radial-gradient(circle at center, #0b1a3d 0%, #040710 100%);
      color: #f8f8f2;
      font-family: 'Outfit', 'Segoe UI', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* Floating background bubbles */
    .bg-bubbles {
      position: absolute;
      inset: 0;
      overflow: hidden;
      z-index: 0;
      pointer-events: none;
    }
    .bg-bubble {
      position: absolute;
      bottom: -100px;
      background: rgba(139, 233, 253, 0.12);
      border: 1.5px solid rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      animation: floatUp 8s infinite linear;
    }
    @keyframes floatUp {
      0% { transform: translateY(0) translateX(0); opacity: 0; }
      10% { opacity: 0.6; }
      90% { opacity: 0.6; }
      100% { transform: translateY(-120vh) translateX(50px); opacity: 0; }
    }

    /* ── game wrapper ── */
    #game-wrapper {
      position: relative;
      border: 4px solid #8be9fd;
      border-radius: 16px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 35px rgba(139, 233, 253, 0.2);
      overflow: hidden;
      z-index: 1;
      background: #000;
    }

    /* ── HUD overlay ── */
    #hud {
      display: none;
      position: absolute;
      top: 16px; left: 16px; right: 16px;
      padding: 12px 24px;
      gap: 20px;
      flex-direction: row;
      align-items: center;
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(139, 233, 253, 0.25);
      border-radius: 50px;
      pointer-events: none;
      z-index: 10;
      font-size: 16px;
      font-weight: 600;
      user-select: none;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }

    #hud-hearts { 
      color: #ff79c6; 
      letter-spacing: 4px; 
      font-size: 22px; 
      text-shadow: 0 0 8px rgba(255, 121, 198, 0.6);
    }
    #hud-score { 
      color: #ffb86c; 
      text-shadow: 0 0 8px rgba(255, 184, 108, 0.4);
    }
    #hud-objective { 
      color: #8be9fd; 
      flex: 1; 
      text-align: center;
      font-size: 14px;
      font-weight: 500;
      text-shadow: 0 0 6px rgba(139, 233, 253, 0.4);
      background: rgba(255,255,255,0.05);
      padding: 6px 16px;
      border-radius: 20px;
    }

    /* ── shared overlay styles ── */
    .game-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
      background: rgba(6, 11, 25, 0.82);
      backdrop-filter: blur(10px);
    }

    .overlay-card {
      text-align: center;
      max-width: 580px;
      padding: 40px 48px;
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.9) 0%, rgba(30, 41, 59, 0.95) 100%);
      border: 2px solid rgba(139, 233, 253, 0.3);
      border-radius: 24px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.6), 0 0 40px rgba(139, 233, 253, 0.15);
      animation: cardAppear 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes cardAppear {
      from { transform: scale(0.8) translateY(20px); opacity: 0; }
      to { transform: scale(1) translateY(0); opacity: 1; }
    }

    .overlay-card h2 {
      font-size: 2.4rem;
      font-weight: 800;
      margin-bottom: 12px;
      background: linear-gradient(to right, #8be9fd, #ff79c6, #ffb86c);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 10px 20px rgba(0,0,0,0.3);
      letter-spacing: 0.05em;
    }

    .overlay-card .tagline {
      font-size: 1.1rem;
      color: #bd93f9;
      margin-bottom: 20px;
      font-style: italic;
      font-weight: 600;
    }

    .overlay-card .story-setting {
      font-size: 0.95rem;
      color: #a4b0be;
      line-height: 1.7;
      margin-bottom: 28px;
      background: rgba(255, 255, 255, 0.03);
      padding: 16px 20px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .overlay-card .controls-hint {
      font-size: 0.85rem;
      color: #6272a4;
      line-height: 1.8;
      margin-top: 18px;
      background: rgba(0,0,0,0.2);
      padding: 8px;
      border-radius: 8px;
    }

    /* ── buttons ── */
    .game-btn {
      display: inline-block;
      padding: 14px 44px;
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      color: #fff;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }

    .game-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(139, 233, 253, 0.4);
    }

    .game-btn:active {
      transform: translateY(-1px);
    }

    #start-btn {
      background: linear-gradient(90deg, #ff79c6 0%, #bd93f9 100%);
      border: 1px solid rgba(255,255,255,0.2);
    }
    
    #start-btn:hover {
      background: linear-gradient(90deg, #ff92d0 0%, #c8a2ff 100%);
    }

    #restart-btn {
      background: linear-gradient(90deg, #ff5555 0%, #ff79c6 100%);
      border: 1px solid rgba(255,255,255,0.2);
    }

    /* ── game-over title colours ── */
    #gameover-title.win {
      background: linear-gradient(to right, #50fa7b, #8be9fd);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 800;
    }
    #gameover-title.lose {
      background: linear-gradient(to right, #ff5555, #ff79c6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 800;
    }
    /* ── responsive scaling ── */
    html, body { width: 100%; height: 100%; }
    #game-wrapper {
      width: min(960px, 96vw, calc(96vh * 960 / 640));
      aspect-ratio: 960 / 640;
    }
    #game-container { width: 100%; height: 100%; }
  </style>
</head>

  <!-- Floating bubbles in document background -->
  <div class="bg-bubbles">
    <div class="bg-bubble" style="left: 8%; width: 32px; height: 32px; animation-delay: 0s; animation-duration: 8s;"></div>
    <div class="bg-bubble" style="left: 22%; width: 18px; height: 18px; animation-delay: 2s; animation-duration: 10s;"></div>
    <div class="bg-bubble" style="left: 38%; width: 50px; height: 50px; animation-delay: 1s; animation-duration: 12s;"></div>

  <div id="game-wrapper">
    <div id="game-container"></div>

    <!-- HUD overlay -->
    <div id="hud">
      <div id="hud-hearts" title="生命值">♥♥♥</div>
        <div id="hud-score">珍珠: <span id="hud-score-value">0</span></div>
        <div id="hud-objective"><span id="hud-objective-text">关卡 1: 在深海珊瑚礁中游动，收集珍珠，踩踏消灭章鱼怪和鲨鱼，并到达珊瑚螺门！</span></div>
    </div>

    <!-- Start screen overlay -->
    <div id="start-screen" class="game-overlay">
      <div class="overlay-card">
        <h2>美人鱼公主梦幻历险 (Mermaid Princess)</h2>
        <p class="tagline">游过深海、水母林与沉船，收集100颗珍珠开启胜利之门！</p>
        <p class="story-setting">一个充满海底奇幻色彩、唯美浪漫的深海世界。阳光穿过水面，在摇曳的珊瑚礁、荧光闪烁的水母林与神秘沉船宝窟间洒下斑驳的光影。</p>
        <button id="start-btn" class="game-btn" onclick="window.__hudStart()">▶ START GAME</button>
        <p class="controls-hint">
          Controls: WASD / Arrow Keys to move
        </p>
      </div>
    </div>

    <!-- Game over overlay -->
    <div id="gameover-screen" class="game-overlay" style="display:none">
      <div class="overlay-card">
        <h2 id="gameover-title">GAME OVER</h2>
        <p id="gameover-message" class="story-setting"></p>
        <button id="restart-btn" class="game-btn" onclick="location.reload()">↩ RESTART</button>
      </div>
    </div>
  </div>

    // Expose GameHUD API before game-logic.js loads
    window.GameHUD = (function () {
      let _startCallback = null;
      let _started = false;
      let _isPvP = false;

      function showHud() {
        document.getElementById('hud').style.display = 'flex';
      }

      // __hudStart must be before return to capture _startCallback and showHud from closure
      window.__hudStart = function (isPvP = false) {
        if (_started) return;
        _started = true;
        _isPvP = isPvP;
        document.getElementById('start-screen').style.display = 'none';
        showHud();
        if (_startCallback) _startCallback(isPvP);
      };

      return {
    setHearts(current, maxHp) {
      const el = document.getElementById('hud-hearts');
      if (!el) return;
      const filled = Math.max(0, Math.min(current, maxHp ?? 3));
      const empty  = (maxHp ?? 3) - filled;
      el.textContent = '♥'.repeat(filled) + '♡'.repeat(empty);
    },
    setScore(value) {
      const el = document.getElementById('hud-score-value');
      if (el) el.textContent = value;
    },
    setObjective(text) {
      const el = document.getElementById('hud-objective-text');
      if (el) el.textContent = text;
    },

        onStart(cb) {
          _startCallback = cb;
          if (_started) {
            cb(_isPvP);
          }
        },

        showGameOver(win, message) {
          const overlay = document.getElementById('gameover-screen');
          const title   = document.getElementById('gameover-title');
          const msg     = document.getElementById('gameover-message');
          if (title) title.textContent = win ? '🎉 YOU WIN' : 'GAME OVER';
          if (msg)   msg.textContent   = message ?? '';
          if (overlay) overlay.style.display = 'flex';
          document.getElementById('hud').style.display = 'none';
        },
      };
    })();

    // Wire gameover title colour after DOM is ready
    const _origShowGameOver = window.GameHUD.showGameOver.bind(window.GameHUD);
    window.GameHUD.showGameOver = function(win, message) {
      _origShowGameOver(win, message);
      const title = document.getElementById('gameover-title');
      if (title) {
        title.className = win ? 'win' : 'lose';
        if (!win) title.textContent = 'GAME OVER';
      }
    };

    // Headless autostart trigger for gameplay screenshot capture
    if (window.location.search.includes('autostart')) {
      setTimeout(() => {
        if (window.__hudStart) {
          const isPvP = window.location.search.includes('pvp');
          window.__hudStart(isPvP);
        }
      }, 300);
    }
