<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>荒尘亡命徒</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rye&family=Noto+Serif+SC:wght@700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0b0f19;
      color: #fff;
      font-family: 'Segoe UI', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* ── game wrapper ── */
    #game-wrapper {
      position: relative;
      border: 3px solid #3b82f6;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      overflow: hidden;
    }

    /* ── HUD overlay ── */
    #hud {
      display: none;
      position: absolute;
      top: 0; left: 0; right: 0;
      padding: 10px 14px;
      gap: 18px;
      flex-direction: row;
      align-items: center;
      background: linear-gradient(to bottom, rgba(0,0,0,0.55), transparent);
      pointer-events: none;
      z-index: 10;
      font-size: 15px;
      user-select: none;
    }

    #hud-hearts { color: #f87171; letter-spacing: 2px; font-size: 18px; }
    #hud-score  { color: #fbbf24; }
    #hud-objective { color: #a5f3fc; flex: 1; text-align: center; }
    #hud-day    { color: #86efac; margin-left: auto; }

    /* ── shared overlay styles ── */
    .game-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
      background: rgba(8, 12, 24, 0.88);
      backdrop-filter: blur(3px);
    }

    .overlay-card {
      text-align: center;
      max-width: 520px;
      padding: 36px 40px;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid #334155;
      border-radius: 12px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }

    .overlay-card h2 {
      font-size: 2rem;
      margin-bottom: 8px;
      color: #f1f5f9;
      letter-spacing: 0.08em;
    }

    .overlay-card .tagline {
      font-size: 0.95rem;
      color: #94a3b8;
      margin-bottom: 16px;
      font-style: italic;
    }

    .overlay-card .story-setting {
      font-size: 0.88rem;
      color: #64748b;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .overlay-card .controls-hint {
      font-size: 0.78rem;
      color: #475569;
      line-height: 1.8;
      margin-top: 14px;
    }

    /* ── buttons ── */
    .game-btn {
      display: inline-block;
      padding: 12px 36px;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.1s;
    }

    .game-btn:hover  { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,0,0,0.4); }
    .game-btn:active { transform: translateY(0); }

    #start-btn   { background: #2563eb; color: #fff; }
    #restart-btn { background: #dc2626; color: #fff; }

    /* ── game-over title colours ── */
    #gameover-title.win  { color: #4ade80; }
    #gameover-title.lose { color: #f87171; }

    /* ── responsive stage scaling (canvas + HUD scale together) ── */
    html, body { width: 100%; height: 100%; }
    #game-wrapper {
      width: 960px; height: 576px;
      flex: 0 0 auto;
      transform-origin: center center;
    }
    /* ── 开场遮罩 · 主题化 BEGIN（只作用于 #start-screen；胜负遮罩仍用通用卡）── */
    #start-screen { flex-direction: column; overflow: hidden; backdrop-filter: none; }    #start-screen { background: radial-gradient(ellipse at 50% 45%, rgba(120,50,10,.2), rgba(25,8,2,.86) 75%),
      linear-gradient(180deg, rgba(255,120,40,.28), rgba(40,12,2,.6)), url('scene/panorama.png') center / cover, #2a1206; }
    #start-screen .do-poster { position: relative; width: 430px; padding: 22px 34px 20px; text-align: center; color: #3b1f0e;
      font-family: 'Noto Serif SC', 'SimSun', serif; transform: rotate(-1.2deg);
      background: radial-gradient(ellipse at 30% 20%, rgba(255,255,255,.28), transparent 60%), radial-gradient(ellipse at 80% 90%, rgba(120,70,20,.28), transparent 55%), linear-gradient(#f2ddb0, #e2c088);
      box-shadow: inset 0 0 38px rgba(120,66,18,.55), 0 18px 40px rgba(0,0,0,.6); }
    #start-screen .do-poster::before { content: ''; position: absolute; top: 9px; left: 50%; width: 10px; height: 10px; margin-left: -5px; border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #d8d2c4, #5a544c); box-shadow: 0 1px 2px rgba(0,0,0,.6); }
    #start-screen .do-wanted { margin-top: 8px; font-family: 'Rye', serif; font-size: 60px; line-height: 1; letter-spacing: .04em; color: #3b1f0e; }
    #start-screen .do-rule { margin: 9px 0; border-top: 4px double #5a3418; }
    #start-screen .do-title { margin: 0; font-weight: 900; font-size: 40px; letter-spacing: .14em; color: #6b1d0c; }
    #start-screen .do-tag { margin-top: 4px; font-size: 14px; font-weight: 700; color: #5a3418; }
    #start-screen .do-story { margin-top: 10px; font-size: 12.5px; line-height: 1.85; color: #4a2c14; }
    #start-screen .do-btn { margin-top: 6px; padding: 5px 24px 7px; cursor: pointer; font-family: 'Rye', 'Noto Serif SC', serif; font-size: 22px; letter-spacing: .06em;
      color: #9b1c1c; background: transparent; border: 4px double #9b1c1c; transform: rotate(-3deg); transition: background .15s, color .15s; }
    #start-screen .do-btn:hover { background: #9b1c1c; color: #f2ddb0; }
    #start-screen .do-keys { margin-top: 14px; display: flex; justify-content: center; gap: 16px; font-size: 12px; font-weight: 700; color: #5a3418; }
    #start-screen kbd { display: inline-block; margin: 0 2px; padding: 1px 5px; font-family: 'Rye', serif; font-size: 11px; color: #f2ddb0; background: #4a2c14; border-radius: 2px; }
    #start-screen .do-cowboy { position: absolute; left: 70px; bottom: 30px; width: 144px; height: 156px;
      background: url('assets/sprites/DustCowboy.webp') 0 -312px / 1296px 468px no-repeat; animation: do-shoot 1.3s steps(9) infinite;
      filter: drop-shadow(0 6px 4px rgba(0,0,0,.55)); }
    @keyframes do-shoot { to { background-position: -1296px -312px; } }
    @media (prefers-reduced-motion: reduce) { #start-screen, #start-screen * { animation: none !important; } }
    /* ── 开场遮罩 · 主题化 END ── */
  </style>
</head>
<body>
  <div id="game-wrapper">
    <div id="game-container"></div>

    <!-- HUD overlay -->
    <div id="hud">
      <div id="hud-hearts" title="生命值">♥♥♥♥</div>
        <div id="hud-score">赏金: <span id="hud-score-value">0</span></div>
        <div id="hud-objective"><span id="hud-objective-text">清空响尾蛇帮：击倒 20 名亡命徒</span></div>
    </div>

    <!-- Start screen overlay：西部通缉令主题（无选择页的游戏保留这一次点击，样式见 style 末尾） -->
    <div id="start-screen" class="game-overlay">
      <div class="do-cowboy" aria-hidden="true"></div>
      <div class="do-poster">
        <div class="do-wanted">WANTED</div>
        <div class="do-rule"></div>
        <h2 class="do-title">荒尘亡命徒</h2>
        <div class="do-tag">落日染红镇口的尘土，最后一颗子弹该给谁？</div>
        <p class="do-story">红石镇的人早已逃光，只剩响尾蛇帮的枪声与铁轨的回响。<br>清空这群亡命徒，把小镇还给黄昏。</p>
        <div class="do-rule"></div>
        <button id="start-btn" class="do-btn" onclick="window.__hudStart()">DRAW · 拔枪</button>
        <div class="do-keys"><span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 移动</span><span><kbd>SPACE</kbd>/<kbd>J</kbd> 开火</span></div>
      </div>
    </div>

    <!-- Game over overlay -->
    <div id="gameover-screen" class="game-overlay" style="display:none">
      <div class="overlay-card">
        <h2 id="gameover-title">GAME OVER</h2>
        <p id="gameover-message" class="story-setting"></p>
        <button id="restart-btn" class="game-btn" onclick="location.reload()">↩ RESTART</button>
      </div>
    </div>
  </div>

  <script>
    // DustOutlaw 有死亡预算(心数)，沿用 ♥/♡ 字形。
    window.GAME_HUD_GLYPHS = { full: '♥', empty: '♡' };
  </script>
  <!-- 共享引擎层 -->
  <script src="../_engine/hud.js"></script>
  <!-- 数据：config 先于 data(data.js 顶层引用 TILEMAP_DATA 时序保险) -->
  <script src="game/config.js"></script>
  <script src="game/data.js"></script>
  <!-- 场景核心 + 系统模块(原型分割) -->
  <script src="game/scenes/DustOutlawScene.js"></script>
  <script src="game/systems/world.js"></script>
  <script src="game/systems/spawn.js"></script>
  <script src="game/systems/combat.js"></script>
  <script src="game/systems/flow.js"></script>
  <!-- Phaser 装配 -->
  <script src="game/main.js"></script>
  <script>
    /* Fit the whole stage (canvas + HUD overlays) to the viewport so everything
       scales as one piece — keeps HUD proportions correct at any screen size. */
    (function () {
      var W = 960, H = 576;
      var wrap = document.getElementById('game-wrapper');
      function fit() {
        if (!wrap) return;
        var s = Math.min(window.innerWidth / W, window.innerHeight / H, 1);
        wrap.style.transform = 'scale(' + s + ')';
      }
      window.addEventListener('resize', fit);
      window.addEventListener('orientationchange', fit);
      fit();
    })();
  </script>
</body>
</html>
