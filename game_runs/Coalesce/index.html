<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>聚水成珠：墨水滴的远行</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zhi+Mang+Xing&family=Caveat:wght@600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0b0f19;
      color: #fff;
      font-family: 'Segoe UI', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    #game-wrapper {
      position: relative;
      border: 3px solid #2f6fb0;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      overflow: hidden;
    }

    #hud {
      display: none;
      position: absolute;
      top: 0; left: 0; right: 0;
      padding: 10px 14px;
      gap: 18px;
      flex-direction: row;
      align-items: center;
      background: linear-gradient(to bottom, rgba(0,0,0,0.45), transparent);
      pointer-events: none;
      z-index: 10;
      font-size: 15px;
      user-select: none;
    }

    #hud-hearts { color: #f87171; letter-spacing: 2px; font-size: 18px; }
    #hud-score  { color: #2f6fb0; font-weight: 700; text-shadow: 0 1px 2px rgba(255,255,255,0.5); }
    #hud-objective { color: #1f3a5f; flex: 1; text-align: center; font-weight: 600; text-shadow: 0 1px 2px rgba(255,255,255,0.6); }

    .game-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
      background: rgba(250, 246, 234, 0.92);
      backdrop-filter: blur(3px);
    }

    .overlay-card {
      text-align: center;
      max-width: 540px;
      padding: 36px 40px;
      background: #fffdf6;
      border: 2px solid #1f3a5f;
      border-radius: 12px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.25);
    }

    .overlay-card h2 {
      font-size: 2rem;
      margin-bottom: 8px;
      color: #1f3a5f;
      letter-spacing: 0.06em;
    }

    .overlay-card .tagline {
      font-size: 0.95rem;
      color: #2f6fb0;
      margin-bottom: 16px;
      font-style: italic;
    }

    .overlay-card .story-setting {
      font-size: 0.88rem;
      color: #5a6a83;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .overlay-card .controls-hint {
      font-size: 0.78rem;
      color: #8a7f63;
      line-height: 1.8;
      margin-top: 14px;
    }

    .game-btn {
      display: inline-block;
      padding: 12px 36px;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.1s;
    }

    .game-btn:hover  { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,0,0,0.2); }
    .game-btn:active { transform: translateY(0); }

    #start-btn   { background: #2f6fb0; color: #fff; }
    #restart-btn { background: #c0524a; color: #fff; }

    #gameover-title.win  { color: #2f6fb0; }
    #gameover-title.lose { color: #c0524a; }

    html, body { width: 100%; height: 100%; }
    #game-wrapper {
      width: 960px; height: 576px;
      flex: 0 0 auto;
      transform-origin: center center;
    }
    /* ── 开场遮罩 · 主题化 BEGIN（只作用于 #start-screen；胜负遮罩仍用通用卡）── */
    #start-screen { flex-direction: column; overflow: hidden; backdrop-filter: none; }    #start-screen { color: #1d3f6e; font-family: 'Microsoft YaHei', 'Segoe UI', sans-serif;
      background: linear-gradient(rgba(251,246,233,.6), rgba(251,246,233,.8)), url('scene/panorama.png') center 70% / cover, #fbf6e9; }
    #start-screen .co-grid { position: absolute; inset: 0; pointer-events: none;
      background-image: linear-gradient(rgba(47,111,176,.10) 1px, transparent 1px), linear-gradient(90deg, rgba(47,111,176,.10) 1px, transparent 1px);
      background-size: 28px 28px; }
    #start-screen .co-wrap { position: relative; display: flex; flex-direction: column; align-items: center; text-align: center; padding: 26px 90px; background: radial-gradient(ellipse at center, rgba(251,246,233,.94) 45%, rgba(251,246,233,0) 72%); }
    #start-screen .co-kicker { font-family: 'Caveat', cursive; font-size: 24px; color: #5a7fae; transform: rotate(-2deg); }
    #start-screen .co-title { margin: 0; font-family: 'Zhi Mang Xing', 'KaiTi', serif; font-weight: 400; font-size: 96px; line-height: 1.05;
      color: #1d4f8f; text-shadow: 2px 3px 0 rgba(29,79,143,.16); }
    #start-screen .co-sub { margin-top: 2px; font-size: 15px; letter-spacing: .35em; color: #2f6fb0; }
    #start-screen .co-drop { width: 30px; height: 30px; margin: 20px 0 12px; border-radius: 0 50% 50% 50%; transform: rotate(45deg);
      background: radial-gradient(circle at 62% 62%, #cfe8ff 0 10%, #4d8fd1 34%, #1d4f8f 88%); animation: co-drip 1.6s ease-in-out infinite; }
    #start-screen .co-story { max-width: 540px; font-size: 14px; line-height: 1.9; color: #34557f; }
    #start-screen .co-btn { margin-top: 18px; padding: 6px 40px 8px; cursor: pointer; font-family: 'Zhi Mang Xing', 'KaiTi', serif; font-size: 36px;
      color: #1d4f8f; background: rgba(77,143,209,.10); border: 2.5px solid #1d4f8f;
      border-radius: 255px 18px 225px 18px / 18px 225px 18px 255px; transition: background .15s, transform .15s; }
    #start-screen .co-btn:hover { background: rgba(77,143,209,.22); transform: rotate(-1.5deg) scale(1.04); }
    #start-screen .co-keys { margin-top: 16px; display: flex; gap: 18px; font-size: 13px; color: #4a6a93; }
    #start-screen kbd { display: inline-block; margin: 0 2px; padding: 0 6px; font-family: 'Caveat', 'Microsoft YaHei', cursive; font-size: 17px; line-height: 1.2;
      color: #1d4f8f; border: 1.5px solid #1d4f8f; border-radius: 6px 3px 7px 4px; background: rgba(255,255,255,.55); }
    @keyframes co-drip { 0%,100% { transform: rotate(45deg) scale(1); } 45% { transform: rotate(45deg) translate(3px,3px) scale(1.1,.9); } 65% { transform: rotate(45deg) translate(-2px,-2px) scale(.93,1.07); } }
    @media (prefers-reduced-motion: reduce) { #start-screen, #start-screen * { animation: none !important; } }
    /* ── 开场遮罩 · 主题化 END ── */
  </style>
</head>
<body>
  <div id="game-wrapper">
    <div id="game-container"></div>

    <div id="hud">
      <div id="hud-hearts" title="生命值">♥♥♥</div>
      <div id="hud-score">墨量: <span id="hud-score-value">0</span></div>
      <div id="hud-objective"><span id="hud-objective-text">聚水/挤身，撞开堤坝</span></div>
    </div>

    <!-- Start screen overlay：速写本 · 墨滴主题（无选择页的游戏保留这一次点击，样式见 style 末尾） -->
    <div id="start-screen" class="game-overlay">
      <div class="co-grid" aria-hidden="true"></div>
      <div class="co-wrap">
        <div class="co-kicker">sketchbook · the water cave</div>
        <h2 class="co-title">聚水成珠</h2>
        <div class="co-sub">水量洞穴 · 水量就是力量</div>
        <div class="co-drop" aria-hidden="true"></div>
        <p class="co-story">一团受重力下落的蓝墨水，要穿过向右延展的岩穴。<br>吸墨变大变重，撞开裂纹堤坝；挤水变小变轻，钻过窄缝。<br>体型不是分数，而是贯穿全程的资源。</p>
        <button id="start-btn" class="co-btn" onclick="window.__hudStart()">落墨启程</button>
        <div class="co-keys"><span><kbd>A</kbd><kbd>D</kbd> 移动</span><span><kbd>W</kbd>/<kbd>空格</kbd> 跳（越小越高）</span><span><kbd>S</kbd> 挤水缩小</span></div>
      </div>
    </div>

    <div id="gameover-screen" class="game-overlay" style="display:none">
      <div class="overlay-card">
        <h2 id="gameover-title">GAME OVER</h2>
        <p id="gameover-message" class="story-setting"></p>
        <button id="restart-btn" class="game-btn" onclick="location.reload()">↩ RESTART</button>
      </div>
    </div>
  </div>

  <script>
    window.GAME_HUD_GLYPHS = { full: '♥', empty: '♡' };
  </script>
  <script src="../_engine/hud.js"></script>
  <script src="game/config.js"></script>
  <script src="game/data.js"></script>
  <script src="game/scenes/CoalesceScene.js"></script>
  <script src="game/systems/cards.js"></script>
  <script src="game/systems/physics.js"></script>
  <script src="game/systems/flow.js"></script>
  <script src="game/systems/render.js"></script>
  <script src="game/main.js"></script>
  <script>
    (function () {
      var W = 960, H = 576;
      var wrap = document.getElementById('game-wrapper');
      function fit() {
        if (!wrap) return;
        var s = Math.min(window.innerWidth / W, window.innerHeight / H, 1);
        wrap.style.transform = 'scale(' + s + ')';
      }
      window.addEventListener('resize', fit);
      window.addEventListener('orientationchange', fit);
      fit();
    })();
  </script>
</body>
</html>
