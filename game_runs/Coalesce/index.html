<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>聚水成珠：墨水滴的远行</title>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0b0f19;
      color: #fff;
      font-family: 'Segoe UI', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    #game-wrapper {
      position: relative;
      border: 3px solid #2f6fb0;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      overflow: hidden;
    }

    #hud {
      display: none;
      position: absolute;
      top: 0; left: 0; right: 0;
      padding: 10px 14px;
      gap: 18px;
      flex-direction: row;
      align-items: center;
      background: linear-gradient(to bottom, rgba(0,0,0,0.45), transparent);
      pointer-events: none;
      z-index: 10;
      font-size: 15px;
      user-select: none;
    }

    #hud-hearts { color: #f87171; letter-spacing: 2px; font-size: 18px; }
    #hud-score  { color: #2f6fb0; font-weight: 700; text-shadow: 0 1px 2px rgba(255,255,255,0.5); }
    #hud-objective { color: #1f3a5f; flex: 1; text-align: center; font-weight: 600; text-shadow: 0 1px 2px rgba(255,255,255,0.6); }

    .game-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
      background: rgba(250, 246, 234, 0.92);
      backdrop-filter: blur(3px);
    }

    .overlay-card {
      text-align: center;
      max-width: 540px;
      padding: 36px 40px;
      background: #fffdf6;
      border: 2px solid #1f3a5f;
      border-radius: 12px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.25);
    }

    .overlay-card h2 {
      font-size: 2rem;
      margin-bottom: 8px;
      color: #1f3a5f;
      letter-spacing: 0.06em;
    }

    .overlay-card .tagline {
      font-size: 0.95rem;
      color: #2f6fb0;
      margin-bottom: 16px;
      font-style: italic;
    }

    .overlay-card .story-setting {
      font-size: 0.88rem;
      color: #5a6a83;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .overlay-card .controls-hint {
      font-size: 0.78rem;
      color: #8a7f63;
      line-height: 1.8;
      margin-top: 14px;
    }

    .game-btn {
      display: inline-block;
      padding: 12px 36px;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.1s;
    }

    .game-btn:hover  { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,0,0,0.2); }
    .game-btn:active { transform: translateY(0); }

    #start-btn   { background: #2f6fb0; color: #fff; }
    #restart-btn { background: #c0524a; color: #fff; }

    #gameover-title.win  { color: #2f6fb0; }
    #gameover-title.lose { color: #c0524a; }

    html, body { width: 100%; height: 100%; }
    #game-wrapper {
      width: 960px; height: 576px;
      flex: 0 0 auto;
      transform-origin: center center;
    }
  </style>
</head>
<body>
  <div id="game-wrapper">
    <div id="game-container"></div>

    <div id="hud">
      <div id="hud-hearts" title="生命值">♥♥♥</div>
      <div id="hud-score">墨量: <span id="hud-score-value">0</span></div>
      <div id="hud-objective"><span id="hud-objective-text">聚水/挤身，撞开堤坝</span></div>
    </div>

    <div id="start-screen" class="game-overlay">
      <div class="overlay-card">
        <h2>聚水成珠：水量洞穴</h2>
        <p class="tagline">水量就是力量——何时聚大、何时挤小，是穿过这座洞穴的唯一办法。</p>
        <p class="story-setting">一团受重力下落的蓝墨水，要穿过向右延展的岩穴。吸墨滴会变大变重：跳得低、却能撞开裂纹堤坝；挤掉水会变小变轻：跳得高、能钻过窄缝。体型不是分数，而是贯穿全程的资源。聚够水量、足够大，一头撞开尽头的堤坝逸出。</p>
        <button id="start-btn" class="game-btn" onclick="window.__hudStart()">▶ START GAME</button>
        <p class="controls-hint">
          A D / ← → 移动 ·　W / ↑ / 空格 跳(越小跳越高) ·　S / ↓ 挤水缩小钻缝
        </p>
      </div>
    </div>

    <div id="gameover-screen" class="game-overlay" style="display:none">
      <div class="overlay-card">
        <h2 id="gameover-title">GAME OVER</h2>
        <p id="gameover-message" class="story-setting"></p>
        <button id="restart-btn" class="game-btn" onclick="location.reload()">↩ RESTART</button>
      </div>
    </div>
  </div>

  <script>
    window.GAME_HUD_GLYPHS = { full: '♥', empty: '♡' };
  </script>
  <script src="../_engine/hud.js"></script>
  <script src="game/config.js"></script>
  <script src="game/data.js"></script>
  <script src="game/scenes/CoalesceScene.js"></script>
  <script src="game/systems/cards.js"></script>
  <script src="game/systems/physics.js"></script>
  <script src="game/systems/flow.js"></script>
  <script src="game/systems/render.js"></script>
  <script src="game/main.js"></script>
  <script>
    (function () {
      var W = 960, H = 576;
      var wrap = document.getElementById('game-wrapper');
      function fit() {
        if (!wrap) return;
        var s = Math.min(window.innerWidth / W, window.innerHeight / H, 1);
        wrap.style.transform = 'scale(' + s + ')';
      }
      window.addEventListener('resize', fit);
      window.addEventListener('orientationchange', fit);
      fit();
    })();
  </script>
</body>
</html>
