<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>火柴人：终极决斗</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=ZCOOL+QingKe+HuangYou&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0b0f19;
      color: #fff;
      font-family: 'Segoe UI', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* ── game wrapper ── */
    #game-wrapper {
      position: relative;
      border: 3px solid #3b82f6;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      overflow: hidden;
    }

    /* ── HUD overlay ── */
    #hud {
      display: none;
      position: absolute;
      top: 0; left: 0; right: 0;
      padding: 10px 14px;
      gap: 18px;
      flex-direction: row;
      align-items: center;
      background: linear-gradient(to bottom, rgba(0,0,0,0.55), transparent);
      pointer-events: none;
      z-index: 10;
      font-size: 15px;
      user-select: none;
    }

    #hud-hearts { color: #f87171; letter-spacing: 2px; font-size: 18px; }
    #hud-score  { color: #fbbf24; }
    #hud-objective { color: #a5f3fc; flex: 1; text-align: center; }
    #hud-day    { color: #86efac; margin-left: auto; }

    /* ── shared overlay styles ── */
    .game-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
      background: rgba(8, 12, 24, 0.88);
      backdrop-filter: blur(3px);
    }

    .overlay-card {
      text-align: center;
      max-width: 520px;
      padding: 36px 40px;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid #334155;
      border-radius: 12px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }

    .overlay-card h2 {
      font-size: 2rem;
      margin-bottom: 8px;
      color: #f1f5f9;
      letter-spacing: 0.08em;
    }

    .overlay-card .tagline {
      font-size: 0.95rem;
      color: #94a3b8;
      margin-bottom: 16px;
      font-style: italic;
    }

    .overlay-card .story-setting {
      font-size: 0.88rem;
      color: #64748b;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .overlay-card .controls-hint {
      font-size: 0.78rem;
      color: #475569;
      line-height: 1.8;
      margin-top: 14px;
    }

    /* ── buttons ── */
    .game-btn {
      display: inline-block;
      padding: 12px 36px;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.1s;
    }

    .game-btn:hover  { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,0,0,0.4); }
    .game-btn:active { transform: translateY(0); }

    #start-btn   { background: #2563eb; color: #fff; }
    #restart-btn { background: #dc2626; color: #fff; }

    /* ── game-over title colours ── */
    #gameover-title.win  { color: #4ade80; }
    #gameover-title.lose { color: #f87171; }
    /* ── responsive stage scaling (canvas + HUD scale together) ── */
    html, body { width: 100%; height: 100%; }
    #game-wrapper {
      width: 960px; height: 576px;
      flex: 0 0 auto;
      transform-origin: center center;
    }
    /* ── 开场遮罩 · 主题化 BEGIN（只作用于 #start-screen；胜负遮罩仍用通用卡）── */
    #start-screen { flex-direction: column; overflow: hidden; backdrop-filter: none; }    #start-screen { color: #fff; background: radial-gradient(ellipse at 50% 45%, rgba(10,4,20,.2), rgba(6,2,12,.88) 75%), url('scene/stickman_panorama.png') center 60% / cover, #0a0614; }
    #start-screen .sf-burst { position: absolute; left: 50%; top: 42%; width: 1400px; height: 1400px; margin: -700px 0 0 -700px; pointer-events: none;
      background: repeating-conic-gradient(from 0deg, rgba(255,90,40,.11) 0 6deg, transparent 6deg 14deg); animation: sf-spin 40s linear infinite;
      -webkit-mask-image: radial-gradient(circle, #000 10%, transparent 55%); mask-image: radial-gradient(circle, #000 10%, transparent 55%); }
    #start-screen .sf-wrap { position: relative; display: flex; flex-direction: column; align-items: center; text-align: center; margin-top: -10px; }
    #start-screen .sf-round { font-family: 'Bangers', cursive; font-size: 26px; letter-spacing: .3em; color: #ffd166; }
    #start-screen .sf-title { margin: 0; font-family: 'ZCOOL QingKe HuangYou', sans-serif; font-weight: 400; font-size: 108px; line-height: 1.05; letter-spacing: .04em; transform: skewX(-10deg);
      background: linear-gradient(180deg, #fff6c2 0%, #ffb02e 45%, #ff4d1a 70%, #b3120a 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
      filter: drop-shadow(4px 4px 0 #000) drop-shadow(0 0 16px rgba(255,80,30,.55)); }
    #start-screen .sf-sub { margin-top: 4px; font-family: 'ZCOOL QingKe HuangYou', sans-serif; font-size: 30px; letter-spacing: .5em; color: #fff; transform: skewX(-10deg);
      text-shadow: 3px 3px 0 #b3120a; }
    #start-screen .sf-story { margin-top: 14px; max-width: 520px; font-size: 14px; line-height: 1.8; color: #e5dcff; text-shadow: 0 2px 6px #000; }
    #start-screen .sf-btn { margin-top: 18px; padding: 8px 40px; cursor: pointer; color: #fff; background: linear-gradient(#ff3b2f, #b3120a); border: 3px solid #000;
      transform: skewX(-12deg); box-shadow: 5px 5px 0 #000, 0 0 24px rgba(255,60,40,.5); transition: transform .1s; }
    #start-screen .sf-btn > span { display: inline-block; transform: skewX(12deg); font-family: 'ZCOOL QingKe HuangYou', sans-serif; font-size: 26px; letter-spacing: .2em; }
    #start-screen .sf-btn em { margin-left: 12px; font-style: normal; font-family: 'Bangers', cursive; font-size: 24px; letter-spacing: .1em; color: #ffd166; }
    #start-screen .sf-btn:hover { transform: skewX(-12deg) scale(1.05); }
    #start-screen .sf-keys { margin-top: 18px; display: flex; gap: 16px; font-size: 13px; color: #d6ccf5; }
    #start-screen kbd { display: inline-block; margin-right: 4px; padding: 0 6px; font-family: 'Bangers', cursive; font-size: 15px; letter-spacing: .05em; color: #000;
      background: #ffd166; border: 2px solid #000; }
    #start-screen .sf-p1, #start-screen .sf-p2 { position: absolute; bottom: 70px; width: 192px; height: 192px; background-size: 960px 960px; background-repeat: no-repeat; }
    #start-screen .sf-p1 { left: 60px; background-image: url('assets/sprites/PlayerStickman.webp'); animation: sf-punch 1.2s steps(5) infinite;
      filter: drop-shadow(0 0 14px rgba(255,60,60,.6)); }
    #start-screen .sf-p2 { right: 60px; background-image: url('assets/sprites/EnemyStickman.webp'); transform: scaleX(-1); animation: sf-kick 1.4s steps(5) infinite;
      filter: drop-shadow(0 0 14px rgba(140,90,255,.6)); }
    @keyframes sf-punch { from { background-position: 0 -384px; } to { background-position: -960px -384px; } }
    @keyframes sf-kick  { from { background-position: 0 -576px; } to { background-position: -960px -576px; } }
    @keyframes sf-spin  { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { #start-screen, #start-screen * { animation: none !important; } }
    /* ── 开场遮罩 · 主题化 END ── */
  </style>
</head>
<body>
  <div id="game-wrapper">
    <div id="game-container"></div>

    <!-- HUD overlay -->
    <div id="hud">
      <div id="hud-hearts" title="生命值">♥♥♥</div>
        <div id="hud-score">K.O.数: <span id="hud-score-value">0</span></div>
        <div id="hud-objective"><span id="hud-objective-text">击败前来的暗影战士，证明你的格斗实力！</span></div>
    </div>

    <!-- Start screen overlay：格斗游戏主题（无选择页的游戏保留这一次点击，样式见 style 末尾） -->
    <div id="start-screen" class="game-overlay">
      <div class="sf-burst" aria-hidden="true"></div>
      <div class="sf-p1" aria-hidden="true"></div>
      <div class="sf-p2" aria-hidden="true"></div>
      <div class="sf-wrap">
        <div class="sf-round">ROUND 1 · FIGHT!</div>
        <h2 class="sf-title">火柴人</h2>
        <div class="sf-sub">终极决斗</div>
        <p class="sf-story">黑白线条与霓虹交织的几何次元，暗影克隆体占领了废弃的像素街头。<br>击败 3 名暗影战士与首领。</p>
        <button id="start-btn" class="sf-btn" onclick="window.__hudStart()"><span>开始闯关<em>FIGHT!</em></span></button>
        <div class="sf-keys"><span><kbd>A</kbd><kbd>D</kbd>移动</span><span><kbd>W</kbd>跳</span><span><kbd>S</kbd>格挡</span><span><kbd>J</kbd>拳</span><span><kbd>K</kbd>腿</span></div>
      </div>
    </div>

    <!-- Game over overlay -->
    <div id="gameover-screen" class="game-overlay" style="display:none">
      <div class="overlay-card">
        <h2 id="gameover-title">GAME OVER</h2>
        <p id="gameover-message" class="story-setting"></p>
        <button id="restart-btn" class="game-btn" onclick="location.reload()">↩ RESTART</button>
      </div>
    </div>
  </div>

  <script>

    // 心形 HUD 字形（共享 _engine/hud.js 默认 ◆，此处覆盖为 ♥）
    window.GAME_HUD_GLYPHS = { full: '♥', empty: '♡' };
  </script>

  <!-- ── 共享引擎层（game_runs/_engine：GameHUD 契约，22 游戏共用）── -->
  <script src="../_engine/hud.js"></script>

  <!-- ── 本游戏：常量 → 核心场景 → 系统(原型增补) → 装配（按依赖顺序）── -->
  <script src="game/config.js"></script>
  <script src="game/data.js"></script>
  <script src="game/scenes/MainScene.js"></script>
  <script src="game/systems/animations.js"></script>
  <script src="game/systems/world.js"></script>
  <script src="game/systems/hud.js"></script>
  <script src="game/systems/combat.js"></script>
  <script src="game/systems/fx.js"></script>
  <script src="game/systems/ai.js"></script>
  <script src="game/main.js"></script>
  <script>
    /* Fit the whole stage (canvas + HUD overlays) to the viewport so everything
       scales as one piece — keeps HUD proportions correct at any screen size. */
    (function () {
      var W = 960, H = 576;
      var wrap = document.getElementById('game-wrapper');
      function fit() {
        if (!wrap) return;
        var s = Math.min(window.innerWidth / W, window.innerHeight / H, 1);
        wrap.style.transform = 'scale(' + s + ')';
      }
      window.addEventListener('resize', fit);
      window.addEventListener('orientationchange', fit);
      fit();
    })();
  </script>
</body>
</html>
