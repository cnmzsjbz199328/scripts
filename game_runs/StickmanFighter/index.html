<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>火柴人：终极决斗</title>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0b0f19;
      color: #fff;
      font-family: 'Segoe UI', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    h1#game-title {
      font-size: 1.6rem;
      letter-spacing: 0.12em;
      color: #e2e8f0;
      margin-bottom: 10px;
    }

    /* ── game wrapper ── */
    #game-wrapper {
      position: relative;
      border: 3px solid #3b82f6;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      overflow: hidden;
    }

    /* ── HUD overlay ── */
    #hud {
      display: none;
      position: absolute;
      top: 0; left: 0; right: 0;
      padding: 10px 14px;
      gap: 18px;
      flex-direction: row;
      align-items: center;
      background: linear-gradient(to bottom, rgba(0,0,0,0.55), transparent);
      pointer-events: none;
      z-index: 10;
      font-size: 15px;
      user-select: none;
    }

    #hud-hearts { color: #f87171; letter-spacing: 2px; font-size: 18px; }
    #hud-score  { color: #fbbf24; }
    #hud-objective { color: #a5f3fc; flex: 1; text-align: center; }
    #hud-day    { color: #86efac; margin-left: auto; }

    /* ── shared overlay styles ── */
    .game-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
      background: rgba(8, 12, 24, 0.88);
      backdrop-filter: blur(3px);
    }

    .overlay-card {
      text-align: center;
      max-width: 520px;
      padding: 36px 40px;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid #334155;
      border-radius: 12px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }

    .overlay-card h2 {
      font-size: 2rem;
      margin-bottom: 8px;
      color: #f1f5f9;
      letter-spacing: 0.08em;
    }

    .overlay-card .tagline {
      font-size: 0.95rem;
      color: #94a3b8;
      margin-bottom: 16px;
      font-style: italic;
    }

    .overlay-card .story-setting {
      font-size: 0.88rem;
      color: #64748b;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .overlay-card .controls-hint {
      font-size: 0.78rem;
      color: #475569;
      line-height: 1.8;
      margin-top: 14px;
    }

    /* ── buttons ── */
    .game-btn {
      display: inline-block;
      padding: 12px 36px;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.1s;
    }

    .game-btn:hover  { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,0,0,0.4); }
    .game-btn:active { transform: translateY(0); }

    #start-btn   { background: #2563eb; color: #fff; }
    #restart-btn { background: #dc2626; color: #fff; }

    /* ── game-over title colours ── */
    #gameover-title.win  { color: #4ade80; }
    #gameover-title.lose { color: #f87171; }
  </style>
</head>
<body>
  <h1 id="game-title">火柴人：终极决斗</h1>

  <div id="game-wrapper">
    <div id="game-container"></div>

    <!-- HUD overlay -->
    <div id="hud">
      <div id="hud-hearts" title="生命值">♥♥♥</div>
        <div id="hud-score">K.O.数: <span id="hud-score-value">0</span></div>
        <div id="hud-objective"><span id="hud-objective-text">击败前来的暗影战士，证明你的格斗实力！</span></div>
    </div>

    <!-- Start screen overlay -->
    <div id="start-screen" class="game-overlay">
      <div class="overlay-card">
        <h2>火柴人：终极决斗</h2>
        <p class="tagline">经典火柴人街头对决，用指尖点燃热血！</p>
        <p class="story-setting">在黑白线条与电子霓虹交织的几何次元，无数流浪的火柴人斗士汇聚在废弃的像素街头，为争夺‘终极战神’的称号展开死斗。</p>
        <button id="start-btn" class="game-btn" onclick="window.__hudStart()">▶ START GAME</button>
        <p class="controls-hint">
          Controls: A/D or Arrow Keys to move left/right | W or UP: Jump | S or DOWN: Block<br>J: Punch &nbsp;|&nbsp; K: Kick
        </p>
      </div>
    </div>

    <!-- Game over overlay -->
    <div id="gameover-screen" class="game-overlay" style="display:none">
      <div class="overlay-card">
        <h2 id="gameover-title">GAME OVER</h2>
        <p id="gameover-message" class="story-setting"></p>
        <button id="restart-btn" class="game-btn" onclick="location.reload()">↩ RESTART</button>
      </div>
    </div>
  </div>

    // Expose GameHUD API before game-logic.js loads
    window.GameHUD = (function () {
      let _startCallback = null;
      let _started = false;

      function showHud() {
        document.getElementById('hud').style.display = 'flex';
      }

      // __hudStart must be before return to capture _startCallback and showHud from closure
      window.__hudStart = function () {
        if (_started) return;
        _started = true;
        document.getElementById('start-screen').style.display = 'none';
        showHud();
        if (_startCallback) _startCallback();
      };

      return {
    setHearts(current, maxHp) {
      const el = document.getElementById('hud-hearts');
      if (!el) return;
      const filled = Math.max(0, Math.min(current, maxHp ?? 3));
      const empty  = (maxHp ?? 3) - filled;
      el.textContent = '♥'.repeat(filled) + '♡'.repeat(empty);
    },
    setScore(value) {
      const el = document.getElementById('hud-score-value');
      if (el) el.textContent = value;
    },
    setObjective(text) {
      const el = document.getElementById('hud-objective-text');
      if (el) el.textContent = text;
    },

        onStart(cb) {
          _startCallback = cb;
        },

        showGameOver(win, message) {
          const overlay = document.getElementById('gameover-screen');
          const title   = document.getElementById('gameover-title');
          const msg     = document.getElementById('gameover-message');
          if (title) title.textContent = win ? '🎉 YOU WIN' : 'GAME OVER';
          if (msg)   msg.textContent   = message ?? '';
          if (overlay) overlay.style.display = 'flex';
          document.getElementById('hud').style.display = 'none';
        },
      };
    })();

    // Wire gameover title colour after DOM is ready
    const _origShowGameOver = window.GameHUD.showGameOver.bind(window.GameHUD);
    window.GameHUD.showGameOver = function(win, message) {
      _origShowGameOver(win, message);
      const title = document.getElementById('gameover-title');
      if (title) title.className = win ? 'win' : 'lose';
    };

    // Headless autostart trigger for gameplay screenshot capture
    if (window.location.search.includes('autostart')) {
      window.addEventListener('load', () => {
        setTimeout(() => {
          if (window.__hudStart) window.__hudStart();
        }, 200);
      });
    }
