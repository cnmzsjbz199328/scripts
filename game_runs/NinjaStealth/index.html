<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>暗影刺客 (Shadow Assassin)</title>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0b0f19;
      color: #fff;
      font-family: 'Segoe UI', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* ── game wrapper ── */
    #game-wrapper {
      position: relative;
      border: 3px solid #3b82f6;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      overflow: hidden;
    }

    /* ── HUD overlay ── */
    #hud {
      display: none;
      position: absolute;
      top: 0; left: 0; right: 0;
      padding: 10px 14px;
      gap: 18px;
      flex-direction: row;
      align-items: center;
      background: linear-gradient(to bottom, rgba(0,0,0,0.55), transparent);
      pointer-events: none;
      z-index: 10;
      font-size: 15px;
      user-select: none;
    }

    #hud-hearts { color: #f87171; letter-spacing: 2px; font-size: 18px; }
    #hud-score  { color: #fbbf24; }
    #hud-objective { color: #a5f3fc; flex: 1; text-align: center; }
    #hud-day    { color: #86efac; margin-left: auto; }

    /* ── shared overlay styles ── */
    .game-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
      background: rgba(8, 12, 24, 0.88);
      backdrop-filter: blur(3px);
    }

    .overlay-card {
      text-align: center;
      max-width: 520px;
      padding: 36px 40px;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid #334155;
      border-radius: 12px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }

    .overlay-card h2 {
      font-size: 2rem;
      margin-bottom: 8px;
      color: #f1f5f9;
      letter-spacing: 0.08em;
    }

    .overlay-card .tagline {
      font-size: 0.95rem;
      color: #94a3b8;
      margin-bottom: 16px;
      font-style: italic;
    }

    .overlay-card .story-setting {
      font-size: 0.88rem;
      color: #64748b;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .overlay-card .controls-hint {
      font-size: 0.78rem;
      color: #475569;
      line-height: 1.8;
      margin-top: 14px;
    }

    /* ── buttons ── */
    .game-btn {
      display: inline-block;
      padding: 12px 36px;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.1s;
    }

    .game-btn:hover  { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,0,0,0.4); }
    .game-btn:active { transform: translateY(0); }

    #start-btn   { background: #2563eb; color: #fff; }
    #restart-btn { background: #dc2626; color: #fff; }

    /* ── game-over title colours ── */
    #gameover-title.win  { color: #4ade80; }
    #gameover-title.lose { color: #f87171; }
  </style>
</head>
<body>
  <div id="game-wrapper">
    <div id="game-container"></div>

    <!-- HUD overlay -->
    <div id="hud">
      <div id="hud-hearts" title="生命值">♥♥♥</div>
        <div id="hud-score">情报卷轴: <span id="hud-score-value">0</span></div>
        <div id="hud-objective"><span id="hud-objective-text">第一关：城堡庭院 - 避开守卫，收集 3 个情报卷轴并到达石门出口！</span></div>
    </div>

    <!-- Start screen overlay -->
    <div id="start-screen" class="game-overlay">
      <div class="overlay-card">
        <h2>暗影刺客 (Shadow Assassin)</h2>
        <p class="tagline">避开守卫，潜行暗杀，收集情报，在黑夜中执行正义！</p>
        <p class="story-setting">古老的幕府时代，守卫森严的城堡与敌营被夜幕笼罩。在火把与阴影的交错中，潜藏着致命的危机。</p>
        <button id="start-btn" class="game-btn" onclick="window.__hudStart()">▶ START GAME</button>
        <p class="controls-hint">
          操作说明：<br>
          <b>移动</b>：WASD / 方向键<br>
          <b>背后暗杀</b>：空格键 (SPACE) / J 键<br>
          <b>投掷烟雾弹</b>：K 键 / X 键<br>
          <span style="font-size:0.8em; color:#64748b;">(注：从守卫背后接近并按下暗杀键可将其消灭。若从正面被发现则会触发警报与战斗，扣减生命。)</span>
        </p>
      </div>
    </div>

    <!-- Game over overlay -->
    <div id="gameover-screen" class="game-overlay" style="display:none">
      <div class="overlay-card">
        <h2 id="gameover-title">GAME OVER</h2>
        <p id="gameover-message" class="story-setting"></p>
        <button id="restart-btn" class="game-btn" onclick="location.reload()">↩ RESTART</button>
      </div>
    </div>
  </div>

    // Expose GameHUD API before game-logic.js loads
    window.GameHUD = (function () {
      let _startCallback = null;
      let _started = false;
      let _isPvP = false;

      function showHud() {
        document.getElementById('hud').style.display = 'flex';
      }

      // __hudStart must be before return to capture _startCallback and showHud from closure
      window.__hudStart = function (isPvP = false) {
        if (_started) return;
        _started = true;
        _isPvP = isPvP;
        document.getElementById('start-screen').style.display = 'none';
        showHud();
        if (_startCallback) _startCallback(isPvP);
      };

      return {
    setHearts(current, maxHp) {
      const el = document.getElementById('hud-hearts');
      if (!el) return;
      const filled = Math.max(0, Math.min(current, maxHp ?? 3));
      const empty  = (maxHp ?? 3) - filled;
      el.textContent = '♥'.repeat(filled) + '♡'.repeat(empty);
    },
    setScore(value) {
      const el = document.getElementById('hud-score-value');
      if (el) el.textContent = value;
    },
    setObjective(text) {
      const el = document.getElementById('hud-objective-text');
      if (el) el.textContent = text;
    },

        onStart(cb) {
          _startCallback = cb;
          if (_started) {
            cb(_isPvP);
          }
        },

        showGameOver(win, message) {
          const overlay = document.getElementById('gameover-screen');
          const title   = document.getElementById('gameover-title');
          const msg     = document.getElementById('gameover-message');
          if (title) title.textContent = win ? '🎉 YOU WIN' : 'GAME OVER';
          if (msg)   msg.textContent   = message ?? '';
          if (overlay) overlay.style.display = 'flex';
          document.getElementById('hud').style.display = 'none';
        },
      };
    })();

    // Wire gameover title colour after DOM is ready
    const _origShowGameOver = window.GameHUD.showGameOver.bind(window.GameHUD);
    window.GameHUD.showGameOver = function(win, message) {
      _origShowGameOver(win, message);
      const title = document.getElementById('gameover-title');
      if (title) {
        title.className = win ? 'win' : 'lose';
        if (!win) title.textContent = 'GAME OVER';
      }
    };

    // Headless autostart trigger for gameplay screenshot capture
    if (window.location.search.includes('autostart')) {
      setTimeout(() => {
        if (window.__hudStart) {
          const isPvP = window.location.search.includes('pvp');
          window.__hudStart(isPvP);
        }
      }, 300);
    }
