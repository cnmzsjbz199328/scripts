<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="像素游戏工坊 — AI 驱动的独立像素游戏合集">
  <meta name="theme-color" content="#080c18">
  <meta property="og:title" content="像素游戏工坊 · PIXELWORKS">
  <meta property="og:description" content="AI × 像素 × 独立游戏">
  <title>像素游戏工坊 · PIXELWORKS</title>
  <style>
    /* ── Reset ──────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #080c18;
      --surface:     #0d1526;
      --surface-hi:  #121e36;
      --border:      #1a2540;
      --border-hi:   #2a3d5e;
      --text:        #e2e8f0;
      --text-dim:    #94a3b8;
      --text-muted:  #64748b;
      --accent:      #3b82f6;   /* default; overridden per card via --a */
      --radius:      12px;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      line-height: 1.6;
    }

    /* ── A11y skip link ─────────────────────────────────────── */
    .skip {
      position: absolute; top: -48px; left: 16px; z-index: 9999;
      background: var(--accent); color: #fff;
      padding: 8px 16px; border-radius: 0 0 8px 8px;
      font-size: .82rem; font-weight: 700; text-decoration: none;
      transition: top .2s;
    }
    .skip:focus { top: 0; }

    /* ── Header ─────────────────────────────────────────────── */
    header {
      position: relative;
      padding: 60px 24px 52px;
      text-align: center;
      border-bottom: 1px solid var(--border);
      overflow: hidden;
    }

    header::before {
      content: '';
      position: absolute; inset: 0;
      background:
        radial-gradient(ellipse 80% 55% at 50% -5%,  rgba(59,130,246,.13) 0%, transparent 65%),
        radial-gradient(ellipse 45% 30% at 15% 110%, rgba(99,102,241,.07) 0%, transparent 60%),
        radial-gradient(ellipse 45% 30% at 85% 110%, rgba(168,85,247,.05) 0%, transparent 60%);
      pointer-events: none;
    }

    /* subtle pixel-grid texture */
    header::after {
      content: '';
      position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,.018) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.018) 1px, transparent 1px);
      background-size: 32px 32px;
      pointer-events: none;
    }

    .header-inner { position: relative; z-index: 1; }

    /* live indicator pill */
    .site-pill {
      display: inline-flex; align-items: center; gap: 8px;
      font-size: .67rem; font-weight: 700; letter-spacing: .22em; text-transform: uppercase;
      color: #60a5fa;
      border: 1px solid rgba(96,165,250,.28); background: rgba(96,165,250,.07);
      padding: 5px 14px; border-radius: 999px; margin-bottom: 24px;
    }
    .pill-dot {
      width: 6px; height: 6px; border-radius: 50%; background: #60a5fa;
      animation: blink 2s ease-in-out infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.2} }

    h1 {
      font-size: clamp(2.2rem, 5.5vw, 4rem);
      font-weight: 800; letter-spacing: -.028em; color: #f1f5f9; line-height: 1.1;
      margin-bottom: 14px;
    }
    .h1-grad {
      background: linear-gradient(130deg, #60a5fa 0%, #a78bfa 55%, #f472b6 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }

    .site-sub { font-size: .9rem; color: var(--text-muted); letter-spacing: .1em; }

    .count-pill {
      display: inline-block; margin-top: 22px;
      font-size: .72rem; color: var(--text-muted);
      background: var(--surface); border: 1px solid var(--border);
      padding: 5px 14px; border-radius: 999px;
    }

    /* ── Main ───────────────────────────────────────────────── */
    main {
      max-width: 1320px; margin: 0 auto;
      padding: 52px 24px 96px;
    }

    .section-row {
      display: flex; align-items: center; gap: 14px; margin-bottom: 34px;
    }
    .section-label {
      font-size: .66rem; font-weight: 700; letter-spacing: .22em;
      text-transform: uppercase; color: var(--text-muted); white-space: nowrap;
    }
    .section-rule { flex: 1; height: 1px; background: var(--border); }

    /* ── Grid ───────────────────────────────────────────────── */
    #games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 24px;
      list-style: none;
    }

    /* ── Skeleton cards ─────────────────────────────────────── */
    .skel {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); overflow: hidden;
    }
    .skel-preview { width: 100%; aspect-ratio: 5/3; background: #0a1020; }
    .skel-body { padding: 20px 22px; display: flex; flex-direction: column; gap: 12px; }
    .skel-line {
      border-radius: 4px;
      background: linear-gradient(90deg, #111827 25%, #1e2a40 50%, #111827 75%);
      background-size: 200% 100%;
      animation: shimmer 1.6s infinite;
    }
    @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

    /* ── Game card ──────────────────────────────────────────── */
    .game-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); overflow: hidden;
      display: flex; flex-direction: column;
      transition: transform .22s ease, border-color .22s ease, box-shadow .22s ease;
    }
    .game-card:hover {
      transform: translateY(-5px);
      border-color: var(--a, var(--accent));
      box-shadow:
        0 18px 52px rgba(0,0,0,.55),
        0 0 0 1px var(--a, var(--accent)),
        0 0 28px -6px var(--a, var(--accent));
    }

    /* preview wrapper */
    .card-preview {
      position: relative; width: 100%; aspect-ratio: 5/3;
      overflow: hidden; background: var(--pbg, #040810); flex-shrink: 0;
    }

    /* panorama poster */
    .card-poster {
      position: absolute; inset: 0; z-index: 1;
      background-size: cover; background-position: center;
      transition: opacity .5s ease;
    }

    /* scrim: bottom of preview bleeds into card body */
    .card-preview::after {
      content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 48%;
      background: linear-gradient(to bottom, transparent, var(--surface));
      z-index: 3; pointer-events: none;
    }

    /* scaled iframe */
    .card-preview iframe {
      position: absolute; top: 0; left: 0;
      width: 960px; height: 576px;
      border: none; transform-origin: top left;
      pointer-events: none; z-index: 2;
      opacity: 0; transition: opacity .5s ease;
    }
    .card-preview iframe.ready { opacity: 1; }

    /* icon placeholder (no poster, no iframe yet) */
    .card-placeholder {
      position: absolute; inset: 0; z-index: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .card-placeholder-icon { font-size: 3.8rem; opacity: .07; user-select: none; }

    /* accent bar */
    .card-bar { height: 2px; background: var(--a, var(--accent)); flex-shrink: 0; opacity: .8; }

    /* card body */
    .card-body {
      padding: 18px 22px 22px; flex: 1;
      display: flex; flex-direction: column; gap: 8px;
    }

    .genre-tag {
      display: inline-block;
      font-size: .62rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase;
      color: var(--a, var(--accent));
      background: color-mix(in srgb, var(--a, var(--accent)) 10%, transparent);
      border: 1px solid color-mix(in srgb, var(--a, var(--accent)) 26%, transparent);
      padding: 3px 9px; border-radius: 4px; white-space: nowrap;
      align-self: flex-start;
    }

    .card-title {
      font-size: 1.13rem; font-weight: 700; color: #f1f5f9; line-height: 1.3;
    }

    .card-tagline {
      font-size: .81rem; color: var(--text-muted); line-height: 1.55; flex: 1;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }

    .card-footer {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; margin-top: 6px;
    }

    .card-engine { font-size: .66rem; color: var(--border-hi); letter-spacing: .04em; }

    .play-btn {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 9px 20px;
      font-size: .78rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
      color: #fff; background: var(--a, var(--accent));
      border: none; border-radius: 6px; cursor: pointer; flex-shrink: 0;
      transition: filter .15s, transform .1s;
    }
    .play-btn:hover  { filter: brightness(1.18); }
    .play-btn:active { transform: scale(.96); }
    .play-btn svg    { width: 10px; height: 10px; fill: currentColor; flex-shrink: 0; }

    /* ── Error state ────────────────────────────────────────── */
    .error-state {
      grid-column: 1 / -1; padding: 72px 24px; text-align: center; color: var(--text-muted);
    }
    .error-state h2 { font-size: 1.15rem; margin-bottom: 8px; color: var(--text-dim); }
    .error-state code {
      font-family: monospace; font-size: .85rem;
      background: var(--surface); border: 1px solid var(--border);
      padding: 2px 6px; border-radius: 4px; color: #60a5fa;
    }
    .error-state p { margin-top: 6px; font-size: .82rem; }

    /* ── Play modal ─────────────────────────────────────────── */
    #play-modal {
      position: fixed; inset: 0; z-index: 9000;
      display: flex; align-items: center; justify-content: center; padding: 20px;
      background: rgba(4, 6, 14, .94);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      opacity: 0; visibility: hidden;
      transition: opacity .25s ease, visibility .25s ease;
    }
    #play-modal.open { opacity: 1; visibility: visible; }

    .modal-wrap {
      width: 100%; max-width: 990px;
      display: flex; flex-direction: column; gap: 10px;
    }

    .modal-bar {
      display: flex; align-items: center; justify-content: space-between; padding: 0 2px;
    }

    #modal-title {
      font-size: .8rem; font-weight: 600; color: var(--text-dim); letter-spacing: .06em;
    }

    .modal-actions { display: flex; gap: 8px; }

    .modal-icon-btn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 32px; height: 32px;
      background: none; border: 1px solid var(--border-hi);
      border-radius: 6px; color: var(--text-dim); cursor: pointer;
      font-size: .9rem; text-decoration: none;
      transition: background .15s, color .15s, border-color .15s;
    }
    .modal-icon-btn:hover {
      background: var(--surface-hi); color: var(--text); border-color: var(--text-muted);
    }

    .modal-frame {
      position: relative; width: 100%; aspect-ratio: 5/3;
      background: #000; border-radius: 10px; overflow: hidden;
      border: 1px solid var(--border-hi);
      box-shadow: 0 28px 72px rgba(0,0,0,.75);
    }

    #modal-iframe {
      position: absolute; inset: 0; width: 100%; height: 100%; border: none;
    }

    /* ── Footer ─────────────────────────────────────────────── */
    footer {
      border-top: 1px solid var(--border); padding: 24px;
      text-align: center; font-size: .74rem; color: var(--text-muted);
    }
    footer a { color: var(--text-dim); text-decoration: none; transition: color .15s; }
    footer a:hover { color: var(--text); }

    /* ── Responsive ─────────────────────────────────────────── */
    @media (max-width: 640px) {
      header { padding: 36px 16px 30px; }
      main   { padding: 36px 16px 64px; }
      #games-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<a href="#games" class="skip">跳至游戏列表</a>

<!-- ── Header ─────────────────────────────────────────────────────── -->
<header>
  <div class="header-inner">
    <div class="site-pill" aria-hidden="true">
      <span class="pill-dot"></span>PIXELWORKS ARCADE
    </div>
    <h1>像素游戏<span class="h1-grad">工坊</span></h1>
    <p class="site-sub">AI &nbsp;×&nbsp; 像素 &nbsp;×&nbsp; 独立游戏</p>
    <span id="count-pill" class="count-pill" aria-live="polite"></span>
  </div>
</header>

<!-- ── Main ──────────────────────────────────────────────────────── -->
<main>
  <div class="section-row">
    <span class="section-label" aria-hidden="true">游戏库 / GAME LIBRARY</span>
    <span class="section-rule" aria-hidden="true"></span>
  </div>

  <ul id="games-grid" role="list" aria-label="游戏列表">
    <!-- skeleton placeholders -->
    <li class="skel" aria-hidden="true">
      <div class="skel-preview"></div>
      <div class="skel-body">
        <div class="skel-line" style="height:10px;width:32%"></div>
        <div class="skel-line" style="height:18px;width:80%"></div>
        <div class="skel-line" style="height:12px;width:95%"></div>
        <div class="skel-line" style="height:12px;width:68%"></div>
      </div>
    </li>
    <li class="skel" aria-hidden="true">
      <div class="skel-preview"></div>
      <div class="skel-body">
        <div class="skel-line" style="height:10px;width:40%"></div>
        <div class="skel-line" style="height:18px;width:68%"></div>
        <div class="skel-line" style="height:12px;width:88%"></div>
        <div class="skel-line" style="height:12px;width:54%"></div>
      </div>
    </li>
    <li class="skel" aria-hidden="true">
      <div class="skel-preview"></div>
      <div class="skel-body">
        <div class="skel-line" style="height:10px;width:36%"></div>
        <div class="skel-line" style="height:18px;width:74%"></div>
        <div class="skel-line" style="height:12px;width:90%"></div>
        <div class="skel-line" style="height:12px;width:62%"></div>
      </div>
    </li>
  </ul>
</main>

<!-- ── Play modal ────────────────────────────────────────────────── -->
<div id="play-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="modal-wrap">
    <div class="modal-bar">
      <span id="modal-title"></span>
      <div class="modal-actions">
        <a id="modal-newtab" class="modal-icon-btn" target="_blank" rel="noopener"
           aria-label="在新标签页中打开游戏" title="新标签页">↗</a>
        <button id="modal-close" class="modal-icon-btn" aria-label="关闭游戏 (Esc)">✕</button>
      </div>
    </div>
    <div class="modal-frame">
      <iframe id="modal-iframe" allow="autoplay"
              sandbox="allow-scripts allow-same-origin allow-forms"
              allowfullscreen></iframe>
    </div>
  </div>
</div>

<!-- ── Footer ────────────────────────────────────────────────────── -->
<footer>
  <p>
    Powered by <a href="https://phaser.io" target="_blank" rel="noopener">Phaser 3</a>
    &nbsp;·&nbsp;
    Generated with <a href="https://claude.ai/code" target="_blank" rel="noopener">Claude Code</a>
    &nbsp;·&nbsp;
    © 2026
  </p>
</footer>

<script>
(() => {
  'use strict';

  const NATIVE_W = 960;

  // ── Fetch + render ───────────────────────────────────────────────
  async function init() {
    let games;
    try {
      const r = await fetch('./games.json');
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      games = await r.json();
    } catch (err) {
      renderError(err);
      return;
    }
    renderGames(games);
  }

  function renderError(err) {
    const grid = document.getElementById('games-grid');
    grid.innerHTML = `
      <li class="error-state">
        <h2>无法加载游戏列表</h2>
        <p>请先运行 <code>node game_runs/_build.js</code> 生成 games.json</p>
        <p style="margin-top:10px;font-size:.75rem;color:#334155">${esc(err.message)}</p>
      </li>`;
  }

  function renderGames(games) {
    document.getElementById('count-pill').textContent = `${games.length} 款游戏`;

    const grid = document.getElementById('games-grid');
    grid.innerHTML = '';

    // IntersectionObserver: lazy-load iframes as cards scroll into view
    const io = new IntersectionObserver(onIntersect, { rootMargin: '100px' });

    // ResizeObserver: keep iframe scale correct when card resizes
    const ro = new ResizeObserver(entries => {
      for (const { target, contentRect } of entries) {
        const iframe = target.querySelector('iframe');
        if (iframe) iframe.style.transform = `scale(${contentRect.width / NATIVE_W})`;
      }
    });

    for (const game of games) {
      const li = buildCard(game);
      grid.appendChild(li);
      io.observe(li);
      ro.observe(li.querySelector('.card-preview'));
    }
  }

  function onIntersect(entries) {
    for (const { isIntersecting, target } of entries) {
      if (!isIntersecting) continue;
      const iframe = target.querySelector('iframe[data-src]');
      if (iframe) {
        iframe.src = iframe.dataset.src;
        delete iframe.dataset.src;
        iframe.addEventListener('load', () => iframe.classList.add('ready'), { once: true });
      }
      // once loaded, stop observing
      this.unobserve(target);
    }
  }

  function buildCard(game) {
    const li = document.createElement('li');
    li.className = 'game-card';
    li.style.setProperty('--a',   game.accent);
    li.style.setProperty('--pbg', game.previewBg);

    const posterHtml = game.thumbnail
      ? `<div class="card-poster" style="background-image:url('./${esc(game.thumbnail)}')" aria-hidden="true"></div>`
      : '';

    li.innerHTML = `
      <div class="card-preview">
        <div class="card-placeholder" aria-hidden="true">
          <span class="card-placeholder-icon">${game.icon}</span>
        </div>
        ${posterHtml}
        <iframe
          data-src="./${esc(game.path)}"
          title="${esc(game.title)} — 预览"
          sandbox="allow-scripts allow-same-origin"
          scrolling="no"
          tabindex="-1"
          aria-hidden="true"
        ></iframe>
      </div>
      <div class="card-bar" aria-hidden="true"></div>
      <div class="card-body">
        <span class="genre-tag">${esc(game.genre)}</span>
        <h2 class="card-title">${esc(game.title)}</h2>
        <p class="card-tagline">${esc(game.tagline)}</p>
        <div class="card-footer">
          <span class="card-engine">Phaser 3 · Pixel</span>
          <button class="play-btn"
                  data-path="${esc(game.path)}"
                  data-title="${esc(game.title)}"
                  aria-label="开始游玩 ${esc(game.title)}">
            <svg viewBox="0 0 10 12" aria-hidden="true"><path d="M0 0l10 6-10 6z"/></svg>
            PLAY
          </button>
        </div>
      </div>`;
    return li;
  }

  // ── Modal ────────────────────────────────────────────────────────
  const modal       = document.getElementById('play-modal');
  const modalIframe = document.getElementById('modal-iframe');
  const modalTitle  = document.getElementById('modal-title');
  const modalClose  = document.getElementById('modal-close');
  const modalNewTab = document.getElementById('modal-newtab');
  let returnFocus   = null;

  function openGame(path, title) {
    returnFocus = document.activeElement;
    modalTitle.textContent = title;
    modalIframe.src = `./${path}`;
    modalNewTab.href = `./${path}`;
    modal.classList.add('open');
    modalClose.focus();
    document.body.style.overflow = 'hidden';
  }

  function closeGame() {
    modal.classList.remove('open');
    document.body.style.overflow = '';
    // slight delay so transition finishes before clearing src
    setTimeout(() => { modalIframe.src = 'about:blank'; }, 260);
    returnFocus?.focus();
  }

  modalClose.addEventListener('click', closeGame);
  modal.addEventListener('click', e => { if (e.target === modal) closeGame(); });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && modal.classList.contains('open')) {
      e.preventDefault();
      closeGame();
    }
  });

  // delegate play button clicks from the grid
  document.getElementById('games-grid').addEventListener('click', e => {
    const btn = e.target.closest('.play-btn');
    if (btn) openGame(btn.dataset.path, btn.dataset.title);
  });

  // ── Helpers ──────────────────────────────────────────────────────
  function esc(s) {
    return String(s ?? '')
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  init();
})();
</script>
</body>
</html>
