<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="像素游戏工坊 — AI 驱动的独立像素游戏合集">
  <meta name="theme-color" content="#080c18">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <meta property="og:title" content="像素游戏工坊 · PIXELWORKS">
  <meta property="og:description" content="作者是纯懒，游戏逻辑不想写，贴图不想找，全靠AI生图、脚本切分动画帧和抠图，最后结合逻辑生成器拼成的合集，欢迎游玩！">
  <title>像素游戏工坊 · PIXELWORKS</title>
  <style>
    /* ── Reset ──────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #080c18;
      --surface:     #0d1526;
      --surface-hi:  #121e36;
      --border:      #1a2540;
      --border-hi:   #2a3d5e;
      --text:        #e2e8f0;
      --text-dim:    #94a3b8;
      --text-muted:  #64748b;
      --accent:      #3b82f6;   /* default; overridden per card via --a */
      --radius:      12px;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      line-height: 1.6;
    }

    /* ── A11y skip link ─────────────────────────────────────── */
    .skip {
      position: absolute; top: -48px; left: 16px; z-index: 9999;
      background: var(--accent); color: #fff;
      padding: 8px 16px; border-radius: 0 0 8px 8px;
      font-size: .82rem; font-weight: 700; text-decoration: none;
      transition: top .2s;
    }
    .skip:focus { top: 0; }

    /* ── Header ─────────────────────────────────────────────── */
    header {
      position: relative;
      padding: 32px 24px 28px;
      text-align: center;
      border-bottom: 1px solid var(--border);
      overflow: hidden;
    }

    header::before {
      content: '';
      position: absolute; inset: 0;
      background:
        radial-gradient(ellipse 80% 55% at 50% -5%,  rgba(59,130,246,.13) 0%, transparent 65%),
        radial-gradient(ellipse 45% 30% at 15% 110%, rgba(99,102,241,.07) 0%, transparent 60%),
        radial-gradient(ellipse 45% 30% at 85% 110%, rgba(168,85,247,.05) 0%, transparent 60%);
      pointer-events: none;
    }

    /* subtle pixel-grid texture */
    header::after {
      content: '';
      position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,.018) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.018) 1px, transparent 1px);
      background-size: 32px 32px;
      pointer-events: none;
    }

    .header-inner { position: relative; z-index: 1; }

    /* live indicator pill */
    .site-pill {
      display: inline-flex; align-items: center; gap: 8px;
      font-size: .67rem; font-weight: 700; letter-spacing: .22em; text-transform: uppercase;
      color: #60a5fa;
      border: 1px solid rgba(96,165,250,.28); background: rgba(96,165,250,.07);
      padding: 5px 14px; border-radius: 999px; margin-bottom: 14px;
    }
    .pill-dot {
      width: 6px; height: 6px; border-radius: 50%; background: #60a5fa;
      animation: blink 2s ease-in-out infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.2} }

    h1 {
      font-size: clamp(2.2rem, 5.5vw, 4rem);
      font-weight: 800; letter-spacing: -.028em; color: #f1f5f9; line-height: 1.1;
      margin-bottom: 8px;
    }
    .h1-grad {
      background: linear-gradient(130deg, #60a5fa 0%, #a78bfa 55%, #f472b6 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }

    .site-sub { font-size: .9rem; color: var(--text-muted); letter-spacing: .1em; }

    .site-logo-icon {
      width: 48px; height: 48px;
      display: block; margin: 0 auto 14px;
      filter: drop-shadow(0 0 18px rgba(167,139,250,.35));
    }

    .count-pill {
      display: inline-block;
      font-size: .66rem; font-weight: 700; letter-spacing: .12em;
      color: var(--text-muted);
    }
    .count-pill::before { content: '['; }
    .count-pill::after  { content: ']'; }

    /* ── Main ───────────────────────────────────────────────── */
    main {
      max-width: 1320px; margin: 0 auto;
      padding: 52px 24px 96px;
    }

    .section-row {
      display: flex; align-items: center; gap: 14px; margin-bottom: 34px;
    }
    .section-label {
      font-size: .66rem; font-weight: 700; letter-spacing: .22em;
      text-transform: uppercase; color: var(--text-muted); white-space: nowrap;
    }
    .section-rule { flex: 1; height: 1px; background: var(--border); }

    /* ── Browser (master-detail) ────────────────────────────────
       Only ONE game preview is ever live at a time — a single iframe in
       the stage whose src swaps on selection. This caps the page to one
       Phaser/WebGL context regardless of how many games exist, so mobile
       Safari never runs out of memory / WebGL contexts.                  */
    .browser { display: flex; flex-direction: column; gap: 22px; }

    /* Stage — the single live preview */
    .stage { flex: 1; min-width: 0; }
    .stage-frame {
      position: relative; width: 100%; aspect-ratio: 5/3;
      background: var(--pbg, #040810);
      border: 1px solid var(--border); border-radius: var(--radius);
      overflow: hidden;
    }
    .stage-placeholder {
      position: absolute; inset: 0; z-index: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 4.6rem; opacity: .08; user-select: none;
    }
    .stage-poster {
      position: absolute; inset: 0; z-index: 1;
      background-size: cover; background-position: center;
      transition: opacity .4s ease;
    }
    /* Looping muted gameplay clip shown as the live preview (above poster, below iframe). */
    .stage-pvideo {
      position: absolute; inset: 0; z-index: 1;
      width: 100%; height: 100%; object-fit: cover;
      opacity: 0; transition: opacity .4s ease;
    }
    .stage-pvideo.show { opacity: 1; }
    .stage-iframe {
      position: absolute; top: 0; left: 0;
      width: 960px; height: 576px;
      border: none; transform-origin: top left;
      pointer-events: none;       /* preview only — play happens via the button; keeps page scrollable on mobile */
      z-index: 2; opacity: 0; transition: opacity .45s ease;
      background: var(--pbg, #040810);
    }
    .stage-iframe.ready { opacity: 1; }
    /* boot spinner shown while a freshly-selected game loads */
    .stage-spinner {
      position: absolute; z-index: 3; left: 50%; top: 50%;
      width: 34px; height: 34px; margin: -17px 0 0 -17px;
      border: 3px solid rgba(255,255,255,.16);
      border-top-color: var(--a, var(--accent));
      border-radius: 50%; animation: spin .8s linear infinite;
      opacity: 0; transition: opacity .2s; pointer-events: none;
    }
    .stage-frame.is-loading .stage-spinner { opacity: 1; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* The whole stage is the play target (like the old clickable card) */
    .stage-frame { cursor: pointer; }
    .stage-link { position: absolute; inset: 0; z-index: 5; }
    .stage-link:focus-visible { outline: 3px solid var(--a, var(--accent)); outline-offset: -3px; }
    .stage-veil {
      position: absolute; inset: 0; z-index: 4;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,0); transition: background .22s; pointer-events: none;
    }
    .stage-frame:hover .stage-veil,
    .stage-link:focus-visible ~ .stage-veil { background: rgba(0,0,0,.32); }
    .stage-cta {
      opacity: 0; transform: scale(.8); transition: opacity .22s, transform .22s;
      font-size: 3rem; color: #fff; text-shadow: 0 0 20px rgba(255,255,255,.5);
    }
    .stage-frame:hover .stage-cta,
    .stage-link:focus-visible ~ .stage-veil .stage-cta { opacity: 1; transform: scale(1); }

    /* Stage meta */
    .stage-meta { margin-top: 18px; }
    .stage-genre {
      font-size: .64rem; font-weight: 700; letter-spacing: .2em;
      text-transform: uppercase; color: var(--a, var(--accent));
    }
    .stage-title {
      font-size: clamp(1.3rem, 3vw, 1.95rem); font-weight: 800;
      color: #f1f5f9; margin: 6px 0 8px; line-height: 1.2;
    }
    .stage-tagline { color: var(--text-dim); font-size: .94rem; max-width: 64ch; }

    /* Picker — scrollable title list (horizontal filmstrip on mobile) */
    .picker {
      display: flex; gap: 12px;
      overflow-x: auto; overflow-y: hidden; padding-bottom: 10px;
      scrollbar-width: thin; scroll-snap-type: x proximity;
      -webkit-overflow-scrolling: touch;
    }
    .picker:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 8px; }
    .picker-item {
      flex: 0 0 auto; width: 170px; scroll-snap-align: start;
      display: flex; flex-direction: column; gap: 0;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; overflow: hidden; padding: 0;
      color: inherit; font: inherit; text-align: left; cursor: pointer;
      transition: border-color .18s, transform .18s, box-shadow .18s;
    }
    .picker-item:hover { transform: translateY(-3px); border-color: var(--border-hi); }
    .picker-item.active {
      border-color: var(--pa, var(--accent));
      box-shadow: 0 0 0 1px var(--pa, var(--accent)), 0 10px 26px -10px var(--pa, var(--accent));
    }
    .picker-thumb {
      position: relative; overflow: hidden;
      width: 100%; aspect-ratio: 5/3;
      background-size: cover; background-position: center;
      background-color: var(--ppbg, #040810);
    }
    .picker-thumb .pthumb-vid {
      position: absolute; inset: 0;
      width: 100%; height: 100%; object-fit: cover;
    }
    .picker-label { padding: 8px 11px 11px; }
    .picker-genre {
      font-size: .56rem; font-weight: 700; letter-spacing: .14em;
      text-transform: uppercase; color: var(--pa, var(--accent));
    }
    .picker-title {
      font-size: .82rem; font-weight: 600; color: var(--text);
      margin-top: 3px; line-height: 1.3;
      display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }

    /* Wide: titles on the LEFT (vertical), preview on the RIGHT */
    @media (min-width: 900px) {
      .browser { flex-direction: row; align-items: flex-start; gap: 28px; }
      .picker {
        order: -1; flex-direction: column;
        width: 286px; flex: 0 0 286px;
        overflow-x: hidden; overflow-y: auto;
        max-height: 80vh; padding-bottom: 0; padding-right: 6px;
        scroll-snap-type: y proximity;
      }
      .picker-item { width: auto; flex-direction: row; align-items: stretch; }
      .picker-item .picker-thumb { width: 96px; flex: 0 0 96px; aspect-ratio: auto; }
      .picker-item .picker-label { flex: 1; display: flex; flex-direction: column; justify-content: center; }
    }

    /* ── Error state ────────────────────────────────────────── */
    .error-state {
      padding: 72px 24px; text-align: center; color: var(--text-muted);
    }
    .error-state h2 { font-size: 1.15rem; margin-bottom: 8px; color: var(--text-dim); }
    .error-state code {
      font-family: monospace; font-size: .85rem;
      background: var(--surface); border: 1px solid var(--border);
      padding: 2px 6px; border-radius: 4px; color: #60a5fa;
    }
    .error-state p { margin-top: 6px; font-size: .82rem; }

    /* ── Footer ─────────────────────────────────────────────── */
    footer {
      border-top: 1px solid var(--border); padding: 24px;
      text-align: center; font-size: .74rem; color: var(--text-muted);
    }
    footer a { color: var(--text-dim); text-decoration: none; transition: color .15s; }
    footer a:hover { color: var(--text); }

    /* ── Responsive ─────────────────────────────────────────── */
    @media (max-width: 640px) {
      header { padding: 36px 16px 30px; }
      main   { padding: 36px 16px 64px; }
    }

    /* ── Header game animation chars ───────────────────────────── */
    .hc { display: inline-block; opacity: 0; }
    .hc-g {
      background: linear-gradient(130deg, #60a5fa 0%, #a78bfa 55%, #f472b6 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    /* Pendulum wobble during free fall; --fall-y set per-element in JS */
    @keyframes char-drop {
      0%   { opacity:0; transform:translateY(var(--fall-y)) rotate(-28deg) scale(.85); }
      10%  { opacity:1; }
      30%  { transform:translateY(calc(var(--fall-y)*.58)) rotate(35deg); }
      58%  { transform:translateY(calc(var(--fall-y)*.12)) rotate(-18deg); }
      76%  { transform:translateY(14px) rotate(7deg); }
      87%  { transform:translateY(-7px) rotate(-3deg); }
      94%  { transform:translateY(4px) rotate(1deg); }
      100% { opacity:1; transform:none; }
    }
    /* Shot mid-air: spins from impact position, lands at random tilt (东倒西歪) */
    @keyframes char-impact-fall {
      0%   { opacity:1; transform:translateY(var(--impact-y)) rotate(var(--impact-rot)); }
      22%  { transform:translateY(calc(var(--impact-y)*0.45)) rotate(calc(var(--impact-rot) - 160deg)) scale(1.12); }
      50%  { transform:translateY(-12px) rotate(calc(var(--land-rot) + 55deg)); }
      74%  { transform:translateY(7px)   rotate(calc(var(--land-rot) - 10deg)); }
      90%  { transform:translateY(-3px)  rotate(calc(var(--land-rot) + 2deg)); }
      100% { transform:translateY(0)     rotate(var(--land-rot)); }
    }
    /* Logo: translate + tilt (pinned — wobbles but won't fall) */
    @keyframes logo-wobble {
      0%,100% { transform:translateX(0) rotate(0deg); }
      18%     { transform:translateX(-9px) rotate(-4deg); }
      40%     { transform:translateX(7px) rotate(2.5deg); }
      62%     { transform:translateX(-3px) rotate(-1deg); }
      82%     { transform:translateX(2px) rotate(.5deg); }
    }
    /* Pill: translate only, keep text readable */
    @keyframes pill-wobble {
      0%,100% { transform:translateX(0); }
      18%     { transform:translateX(-7px); }
      40%     { transform:translateX(5px); }
      62%     { transform:translateX(-2px); }
      82%     { transform:translateX(1px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .hc, .site-logo-icon, .site-pill { animation: none !important; }
    }
  </style>
</head>

<script id="header-anim">
/* ── Header interactive animations ─────────────────────────────────────
   Unified header scene — all elements participate:
   · Soldiers at far edges use space beside logo/pill
   · Chars fall from above logo, pendulum-wobble in air, land at h1
   · Bullet (moving pixel) hits → 2-spin tumble → settle
   · SHOW rest: idle shots hit logo (tilt wobble) & pill (slide wobble)
   · Chars dissolve outward → repeat (~8 s cycle)
   Subtitle: snake eats scattered chars → rest → scatter → repeat
   Mobile  : staggered drop-in only
   prefers-reduced-motion: skip all
─────────────────────────────────────────────────────────────────────── */
(function () {
  'use strict';

  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  // Hide h1 immediately to prevent FOUC while spans are being set up
  const _h1early = document.querySelector('header h1');
  if (_h1early) _h1early.style.opacity = '0';

  const MOBILE = window.innerWidth < 540;

  /* ══════════════════════════════════════════════════════════════
     TITLE LOOP  —  unified header scene
     Soldiers stand at far left/right edges (beside logo & pill).
     Chars fall from above the logo, pendulum-wobbling in the air,
     land at h1 row → bullet hits → 2-spin tumble → settle.
     SHOW phase: soldiers fire idle shots that hit logo & pill
     (pinned → wobble only). Then chars dissolve outward → repeat.
     Mobile: staggered drop-in, no soldiers.
  ══════════════════════════════════════════════════════════════ */
  function titleLoop() {
    const h1     = document.querySelector('header h1');
    const hi     = document.querySelector('.header-inner');
    const logoEl = hi && hi.querySelector('.site-logo-icon');
    const pillEl = hi && hi.querySelector('.site-pill');
    if (!h1 || !hi) return;

    const GRAD  = new Set(['工', '坊']);
    const CHARS = '像素游戏工坊';

    h1.innerHTML = CHARS.split('').map(ch =>
      `<span class="hc${GRAD.has(ch) ? ' hc-g' : ''}">${ch}</span>`
    ).join('');
    h1.style.opacity = '';

    const spans = [...h1.querySelectorAll('.hc')];



    function resetSpans() {
      spans.forEach(sp => {
        sp.style.animation  = 'none';
        sp.style.transition = 'none';
        sp.style.opacity    = '';
        sp.style.transform  = '';
        sp.style.filter     = '';
      });
      void h1.offsetHeight;
    }

    // Exit: struggle → magnetic snap → rise — loops back to the fall
    function dissolveLoop(onDone) {
      // Freeze each span at its landing-tilt state; extract current rotation for struggle
      const frozenRots = spans.map(sp => {
        const cs  = window.getComputedStyle(sp);
        const mtx = new DOMMatrix(cs.transform);
        sp.style.animation = 'none';
        sp.style.opacity   = '1';
        sp.style.transform = cs.transform === 'none' ? '' : cs.transform;
        return Math.atan2(mtx.m12, mtx.m11) * 180 / Math.PI;
      });
      void h1.offsetHeight;

      // Centre of h1 relative to header-inner (same coord space as sp.offsetLeft/Top)
      const cx = h1.offsetLeft + h1.offsetWidth  / 2;
      const cy = h1.offsetTop  + h1.offsetHeight / 2;
      const targets = spans.map(sp => ({
        tx:  cx - (sp.offsetLeft + sp.offsetWidth  / 2) + (Math.random() - 0.5) * 22,
        ty:  cy - (sp.offsetTop  + sp.offsetHeight / 2),   // same Y for all — one horizontal line
        rot: Math.random() * 540 - 270,
      }));

      // Phase 0: struggle — nudge away from centre + rotation jitter (resisting the pull)
      spans.forEach((sp, i) => {
        const { tx, ty } = targets[i];
        const jitter = (Math.random() - 0.5) * 20;
        sp.style.transition = `transform .2s ease-out ${i * 14}ms`;
        sp.style.transform  =
          `translate(${(-tx * 0.14).toFixed(1)}px,${(-ty * 0.14).toFixed(1)}px)` +
          ` rotate(${(frozenRots[i] + jitter).toFixed(1)}deg)`;
      });

      // Phase 1: magnetic snap — cubic-bezier front-loaded inertia then fast-snap to cluster
      const T1 = 220 + spans.length * 14;
      setTimeout(() => {
        spans.forEach((sp, i) => {
          const { tx, ty, rot } = targets[i];
          sp.style.transition =
            `transform .52s cubic-bezier(.85,0,.2,1) ${i * 20}ms,` +
            `opacity .2s ease ${i * 20 + 340}ms`;
          sp.style.transform  = `translate(${tx}px,${ty}px) rotate(${rot}deg) scale(.85)`;
          sp.style.opacity    = '0.8';
        });

        // Phase 2: cluster rises to the exact height chars fall from
        const T2 = 550 + spans.length * 20;
        setTimeout(() => {
          spans.forEach((sp, i) => {
            const { tx, ty, rot } = targets[i];
            sp.style.transition =
              `transform .56s ease-in ${i * 14}ms,` +
              `opacity .36s ease-in ${i * 14}ms`;
            sp.style.transform  =
              `translate(${tx}px,${ty - fallDist}px)` +
              ` rotate(${rot + (i % 2 === 0 ? 80 : -80)}deg) scale(.5)`;
            sp.style.opacity    = '0';
          });
          setTimeout(() => { resetSpans(); setTimeout(onDone, 220); }, 620);
        }, T2);
      }, T1);
    }

    // Mobile: simple staggered drop, no soldiers, no idle shots
    if (MOBILE) {
      const fallDist = spans[0].offsetTop + 60;
      function mobileReveal() {
        resetSpans();
        spans.forEach((sp, i) => {
          sp.style.setProperty('--fall-y', `-${fallDist}px`);
          setTimeout(() => {
            sp.style.animation = 'char-drop 560ms linear forwards';
          }, i * 140);
        });
        setTimeout(() => dissolveLoop(mobileReveal),
          spans.length * 140 + 560 + 2500);
      }
      setTimeout(mobileReveal, 400);
      return;
    }

    // ── Desktop ───────────────────────────────────────────────
    const HI_W   = hi.offsetWidth;
    const SOL_W  = 18, SOL_H = 20, SOL_PAD = 14;

    // Layout positions via offsetLeft (unaffected by CSS transforms)
    const charData = spans.map(sp => ({
      sp,
      cx: sp.offsetLeft + sp.offsetWidth  / 2,
      cy: sp.offsetTop  + sp.offsetHeight / 2,
    }));
    // Soldiers at bottom of header-inner — bullets travel diagonally upward at falling chars
    const solY     = hi.offsetHeight - SOL_H - 8;
    // Chars start 80 px above header-inner top (passes through logo/pill area)
    const fallDist = charData[0].sp.offsetTop + 80;
    charData.forEach(cd => cd.sp.style.setProperty('--fall-y', `-${fallDist}px`));

    const SOL_SVG =
      `<svg width="${SOL_W}" height="${SOL_H}" viewBox="0 0 9 10" xmlns="http://www.w3.org/2000/svg">` +
      `<rect x="4" y="0" width="2" height="2" fill="#93c5fd"/>` +
      `<rect x="3" y="2" width="4" height="3" fill="#3b82f6"/>` +
      `<rect x="6" y="2" width="3" height="1" fill="#93c5fd"/>` +
      `<rect x="3" y="5" width="1" height="3" fill="#1d4ed8"/>` +
      `<rect x="5" y="5" width="1" height="3" fill="#1d4ed8"/>` +
      `<rect x="2" y="8" width="2" height="2" fill="#60a5fa"/>` +
      `<rect x="5" y="8" width="2" height="2" fill="#60a5fa"/>` +
      `</svg>`;

    function makeSoldier(flip) {
      const d  = document.createElement('div');
      d.setAttribute('aria-hidden', 'true');
      d.style.cssText =
        `position:absolute;left:${flip ? HI_W - SOL_W - SOL_PAD : SOL_PAD}px;top:${solY}px;` +
        `width:${SOL_W}px;height:${SOL_H}px;pointer-events:none;z-index:10;` +
        (flip ? 'transform:scaleX(-1);' : '');
      d.innerHTML = SOL_SVG;
      hi.appendChild(d);
      return d;
    }
    const leftSol  = makeSoldier(false);
    const rightSol = makeSoldier(true);

    const leftGunX  = SOL_PAD + SOL_W;
    const rightGunX = HI_W - SOL_PAD - SOL_W;

    // Moving-pixel bullet (5×3 px glow dot travelling to target)
    function spawnBullet(sx, sy, tx, ty, color, shadow, travelMs, onArrive) {
      const b = document.createElement('div');
      b.style.cssText =
        `position:absolute;left:${sx}px;top:${sy - 1.5}px;` +
        `width:5px;height:3px;border-radius:1px;pointer-events:none;z-index:6;` +
        `background:${color};box-shadow:${shadow};transition:transform ${travelMs}ms linear;`;
      hi.appendChild(b);
      void b.offsetWidth;
      b.style.transform = `translate(${tx - sx}px,${ty - sy}px)`;
      setTimeout(() => {
        b.style.transition = 'opacity 60ms';
        b.style.opacity = '0';
        setTimeout(() => { b.remove(); if (onArrive) onArrive(); }, 70);
      }, travelMs);
    }

    // Bullet fired mid-fall; travels diagonally upward to char's resting X/Y
    function fireBullet(fromLeft, cd) {
      const sx = fromLeft ? leftGunX : rightGunX;
      spawnBullet(sx, solY + SOL_H / 2, cd.cx, cd.cy,
        '#e0f2fe', '0 0 5px #93c5fd,0 0 10px #3b82f6', 150, null);
    }

    // Hit logo or pill — yellow tracer from soldier, wobble on arrival
    function hitTarget(target, anim, fromLeft) {
      if (!target) return;
      const sol = fromLeft ? leftSol : rightSol;
      sol.style.filter = 'brightness(3)';
      setTimeout(() => { sol.style.filter = ''; }, 120);
      const hiBox = hi.getBoundingClientRect();
      const tBox  = target.getBoundingClientRect();
      const tCx   = tBox.left - hiBox.left + tBox.width  / 2;
      const tCy   = tBox.top  - hiBox.top  + tBox.height / 2;
      spawnBullet(fromLeft ? leftGunX : rightGunX, solY + SOL_H / 2, tCx, tCy,
        '#fde68a', '0 0 6px #f59e0b', 220,
        () => {
          target.style.filter = 'brightness(2.2)';
          setTimeout(() => { target.style.filter = ''; }, 180);
          target.style.animation = 'none';
          void target.offsetHeight;
          target.style.animation = `${anim} 640ms ease-out`;
          target.addEventListener('animationend',
            () => { target.style.animation = ''; }, { once: true });
        });
    }

    // Idle shots during SHOW rest — 2 stray shots (chars already took some mid-reveal)
    function idleShots() {
      setTimeout(() => hitTarget(logoEl, 'logo-wobble', true),   350);
      setTimeout(() => hitTarget(pillEl, 'pill-wobble', false), 1300);
    }

    const DROP_DUR      = 480;
    const CHAR_GAP      = 540;
    const IMPACT_DUR    = 380;
    const SHOW_DUR      = 6000;
    const FIRE_OFFSET   = Math.round(DROP_DUR * 0.20);  // 96 ms — char still high in air
    const BULLET_TRAVEL = 150;                           // arrives at 246 ms (51% of fall)

    function doReveal() {
      resetSpans();
      charData.forEach(cd => {
        cd.sp.style.setProperty('--fall-y',   `-${fallDist}px`);
        // Random landing tilt: ±4–14°, alternating sign for variety
        const tilt = (Math.random() * 10 + 4) * (Math.random() < 0.5 ? 1 : -1);
        cd.sp.style.setProperty('--land-rot', `${tilt.toFixed(1)}deg`);
      });

      let t = 200;
      charData.forEach((cd, i) => {
        const fromLeft  = i % 2 === 0;
        const charStart = t;

        setTimeout(() => {
          cd.sp.style.animation = `char-drop ${DROP_DUR}ms linear forwards`;

          // Fire when char is ~20% through fall — still clearly in the air
          setTimeout(() => {
            fireBullet(fromLeft, cd);

            // Bullet arrives — read actual animated position, switch to impact-fall
            setTimeout(() => {
              const cs  = window.getComputedStyle(cd.sp);
              const mtx = new DOMMatrix(cs.transform);
              const impactY   = mtx.m42;
              const impactRot = Math.atan2(mtx.m12, mtx.m11) * 180 / Math.PI;
              cd.sp.style.setProperty('--impact-y',   `${impactY.toFixed(1)}px`);
              cd.sp.style.setProperty('--impact-rot', `${impactRot.toFixed(1)}deg`);
              cd.sp.style.animation = 'none';
              cd.sp.style.opacity   = '1';
              void cd.sp.offsetHeight;
              cd.sp.style.animation = `char-impact-fall ${IMPACT_DUR}ms ease-out forwards`;
            }, BULLET_TRAVEL);
          }, FIRE_OFFSET);
        }, charStart);

        // Stray shots woven into reveal: logo after char[1] impact, pill after char[3]
        const impactTime = charStart + FIRE_OFFSET + BULLET_TRAVEL;
        if (i === 1) setTimeout(() => hitTarget(logoEl, 'logo-wobble', true),  impactTime + 120);
        if (i === 3) setTimeout(() => hitTarget(pillEl, 'pill-wobble', false), impactTime + 120);

        t += CHAR_GAP;
      });

      // showStart = last char fully landed
      const showStart = (t - CHAR_GAP) + FIRE_OFFSET + BULLET_TRAVEL + IMPACT_DUR;
      setTimeout(idleShots, showStart);
      setTimeout(() => dissolveLoop(doReveal), showStart + SHOW_DUR);
    }

    setTimeout(doReveal, 300);
  }

  /* ══════════════════════════════════════════════════════════════
     SNAKE LOOP
     EAT     : snake navigates to each scattered char and eats it;
               eaten chars appear in a text strip at canvas bottom
     SHOW    : 3s rest — full text visible, snake idles
     SCATTER : chars animate from strip back to new random positions
     (repeat)
  ══════════════════════════════════════════════════════════════ */
  function snakeLoop() {
    const p = document.querySelector('.site-sub');
    if (!p) return;

    const TEXT  = p.textContent.trim();
    p.style.opacity = '0'; // visually hidden; stays in DOM for a11y

    const CELL    = MOBILE ? 8  : 11;
    const CH      = MOBILE ? 90 : 122;
    const FSZ_G   = MOBILE ? 8  : 10;  // grid char size
    const FSZ_S   = MOBILE ? 8  : 11;  // strip text size
    const STEP_MS    = MOBILE ? 52 : 36;  // snake step interval
    const SWELL_MS   = 350;   // chars inflate
    const TREMBLE_MS = 420;   // chars shake with growing amplitude
    const EXPLODE_MS = 630;   // chars fly to grid positions
    const SCATTER_TOTAL = SWELL_MS + TREMBLE_MS + EXPLODE_MS; // ~1400 ms

    const cvs = document.createElement('canvas');
    cvs.setAttribute('aria-hidden', 'true');
    cvs.style.cssText = `display:block;width:100%;height:${CH}px;`;
    p.before(cvs);

    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const CW  = cvs.parentElement.offsetWidth;
    cvs.width  = CW * dpr;
    cvs.height = CH * dpr;
    const ctx  = cvs.getContext('2d');
    ctx.scale(dpr, dpr);

    const COLS    = Math.floor(CW / CELL);
    const ROWS    = Math.floor(CH / CELL);
    const STRIP_Y = CH - (MOBILE ? 6 : 8);

    // Precompute strip x-centre for each char (indexed by text order)
    ctx.font = `${FSZ_S}px "Segoe UI",system-ui,sans-serif`;
    const cws    = TEXT.split('').map(ch => ctx.measureText(ch).width);
    const totalW = cws.reduce((a, b) => a + b, 0);
    const stripXs = [];
    let bx = CW / 2 - totalW / 2;
    cws.forEach(w => { stripXs.push(bx + w / 2); bx += w; });

    function randPos() {
      const used = new Set();
      return TEXT.split('').map(() => {
        let col, row, n = 0;
        do {
          col = 1 + Math.floor(Math.random() * (COLS - 2));
          row = 1 + Math.floor(Math.random() * (ROWS - 3));
        } while (used.has(`${col},${row}`) && ++n < 300);
        used.add(`${col},${row}`);
        return { col, row };
      });
    }

    function makeChars(positions) {
      return TEXT.split('').map((ch, i) => ({
        ch, order: i, eaten: false,
        col: positions[i].col, row: positions[i].row,
      }));
    }

    let chars  = makeChars(randPos());
    let snake  = [{ col: 0, row: 0 }];
    let ate    = [];
    let stepT  = 0;
    let phase  = 'EAT'; // 'EAT' | 'SHOW' | 'SCATTER'
    let phaseT = 0;
    let scatterFrom = [];
    let scatterTo   = [];

    function nearest() {
      const h = snake[0];
      return chars.filter(c => !c.eaten).reduce((b, c) => {
        const d  = Math.abs(c.col - h.col) + Math.abs(c.row - h.row);
        const bd = b ? Math.abs(b.col - h.col) + Math.abs(b.row - h.row) : Infinity;
        return d < bd ? c : b;
      }, null);
    }

    function forceFinish() {
      chars.filter(c => !c.eaten).forEach(c => { c.eaten = true; ate.push(c); });
      phase = 'SHOW'; phaseT = 0;
    }

    function stepSnake() {
      const tgt = nearest();
      if (!tgt) { forceFinish(); return; }
      const h    = snake[0];
      const body = new Set(snake.slice(0, -1).map(s => `${s.col},${s.row}`));
      const dc   = Math.sign(tgt.col - h.col);
      const dr   = Math.sign(tgt.row - h.row);
      const opts = [];
      if (dc) opts.push([dc, 0]);
      if (dr) opts.push([0, dr]);
      opts.push([1, 0], [-1, 0], [0, 1], [0, -1]);
      for (const [dc2, dr2] of opts) {
        const nc = h.col + dc2, nr = h.row + dr2;
        if (nc < 0 || nc >= COLS || nr < 0 || nr >= ROWS) continue;
        if (body.has(`${nc},${nr}`)) continue;
        if (snake.length > 1 && nc === snake[1].col && nr === snake[1].row) continue;
        snake.unshift({ col: nc, row: nr });
        const e = chars.find(c => !c.eaten && c.col === nc && c.row === nr);
        if (e) { e.eaten = true; ate.push(e); }
        else snake.pop();
        return;
      }
      forceFinish(); // snake is stuck
    }

    function eio(t) { return t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }

    function drawSnake() {
      for (let i = 0; i < snake.length; i++) {
        const s = snake[i];
        ctx.fillStyle = i === 0 ? '#4ade80' : `rgba(74,222,128,${Math.max(.12, .85 - i * .02)})`;
        ctx.fillRect(s.col * CELL + 1, s.row * CELL + 1, CELL - 2, CELL - 2);
      }
    }

    let lt = performance.now();
    function draw(now) {
      const dt = Math.min(now - lt, 50); lt = now;

      // Phase transitions
      if (phase === 'EAT') {
        stepT += dt;
        if (stepT >= STEP_MS) { stepT = 0; stepSnake(); }
        if (chars.every(c => c.eaten)) { phase = 'SHOW'; phaseT = 0; }
      } else if (phase === 'SHOW') {
        phaseT += dt;
        if (phaseT >= 4000) {
          const np  = randPos();
          scatterFrom = chars.map(c => ({ x: stripXs[c.order], y: STRIP_Y }));
          scatterTo   = np;
          phase = 'SCATTER'; phaseT = 0;
        }
      } else if (phase === 'SCATTER') {
        phaseT += dt;
        if (phaseT >= SCATTER_TOTAL) {
          chars.forEach((c, i) => {
            c.col = scatterTo[i].col; c.row = scatterTo[i].row; c.eaten = false;
          });
          snake = [{ col: 0, row: 0 }]; ate = []; stepT = 0;
          phase = 'EAT';
        }
      }

      ctx.clearRect(0, 0, CW, CH);

      if (phase === 'EAT') {
        ctx.font = `${FSZ_G}px monospace`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        for (const c of chars) {
          if (c.eaten) continue;
          ctx.fillStyle = 'rgba(148,163,184,.6)';
          ctx.fillText(c.ch, c.col * CELL + CELL / 2, c.row * CELL + CELL / 2);
        }
        drawSnake();
        const sorted = [...ate].sort((a, b) => a.order - b.order).map(c => c.ch).join('');
        ctx.font = `${FSZ_S}px "Segoe UI",system-ui,sans-serif`;
        ctx.fillStyle = '#94a3b8'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(sorted, CW / 2, STRIP_Y);

      } else if (phase === 'SHOW') {
        ctx.font = `${FSZ_S}px "Segoe UI",system-ui,sans-serif`;
        ctx.fillStyle = '#94a3b8'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(TEXT, CW / 2, STRIP_Y);
        drawSnake();

      } else if (phase === 'SCATTER') {
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillStyle = '#94a3b8';
        const t = phaseT;

        if (t < SWELL_MS) {
          // ① Swell: font inflates smoothly, chars hold position
          const p     = t / SWELL_MS;
          const scale = 1 + eio(p) * 0.22;
          ctx.font = `${Math.round(FSZ_S * scale)}px "Segoe UI",system-ui,sans-serif`;
          ctx.globalAlpha = 1;
          chars.forEach((c, i) => {
            ctx.fillText(c.ch, scatterFrom[i].x, scatterFrom[i].y);
          });

        } else if (t < SWELL_MS + TREMBLE_MS) {
          // ② Tremble: shake amplitude ramps up quadratically (tension builds)
          const tp  = (t - SWELL_MS) / TREMBLE_MS;
          const amp = tp * tp * 5.5;
          ctx.font = `${Math.round(FSZ_S * 1.22)}px "Segoe UI",system-ui,sans-serif`;
          ctx.globalAlpha = 1;
          chars.forEach((c, i) => {
            const dx = Math.sin(t * 0.058 + i * 1.9) * amp;
            const dy = Math.cos(t * 0.051 + i * 2.5) * amp * 0.65;
            ctx.fillText(c.ch, scatterFrom[i].x + dx, scatterFrom[i].y + dy);
          });

        } else {
          // ③ Explode: chars burst outward to grid positions
          const ep   = (t - SWELL_MS - TREMBLE_MS) / EXPLODE_MS;
          const prog = eio(Math.min(ep, 1));
          ctx.font = `${FSZ_G}px monospace`;
          chars.forEach((c, i) => {
            const fx = scatterFrom[i].x, fy = scatterFrom[i].y;
            const tx = scatterTo[i].col * CELL + CELL / 2;
            const ty = scatterTo[i].row * CELL + CELL / 2;
            ctx.globalAlpha = 0.25 + prog * 0.38;
            ctx.fillText(c.ch, fx + (tx - fx) * prog, fy + (ty - fy) * prog);
          });
        }
        ctx.globalAlpha = 1;
      }

      requestAnimationFrame(draw);
    }

    setTimeout(() => requestAnimationFrame(draw), 200);
  }

  /* ── Boot ───────────────────────────────────────────────────── */
  function boot() {
    // Double RAF ensures layout is complete before measuring positions
    requestAnimationFrame(() => requestAnimationFrame(() => {
      titleLoop();
      snakeLoop();
    }));
  }
  document.readyState === 'loading'
    ? document.addEventListener('DOMContentLoaded', boot)
    : boot();
})();
</script>

<script>
(() => {
  'use strict';

  const NATIVE_W = 960;          // games render at 960×576; the iframe is scaled to fit

  // Module state — exactly ONE live preview exists at any moment.
  let GAMES = [];
  let selectedId = null;
  let loadTimer = null;
  const els = {};                // cached stage DOM refs

  // ── Fetch + render ───────────────────────────────────────────────
  async function init() {
    try {
      const r = await fetch('./games.json');
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      GAMES = await r.json();
    } catch (err) {
      renderError(err);
      return;
    }
    render();
  }

  function renderError(err) {
    document.getElementById('browser-root').innerHTML = `
      <div class="error-state">
        <h2>无法加载游戏列表</h2>
        <p>请先运行 <code>node game_runs/_build.js</code> 生成 games.json</p>
        <p style="margin-top:10px;font-size:.75rem;color:#334155">${esc(err.message)}</p>
      </div>`;
  }

  function render() {
    document.getElementById('count-pill').textContent = `${GAMES.length} 款游戏`;

    const root = document.getElementById('browser-root');
    root.innerHTML = `
      <div class="browser">
        <div class="stage">
          <div class="stage-frame is-loading">
            <div class="stage-placeholder" aria-hidden="true"></div>
            <div class="stage-poster" aria-hidden="true"></div>
            <video class="stage-pvideo" muted loop playsinline preload="metadata" aria-hidden="true"></video>
            <iframe class="stage-iframe"
                    title="游戏预览"
                    sandbox="allow-scripts allow-same-origin"
                    scrolling="no" tabindex="-1" aria-hidden="true"></iframe>
            <div class="stage-spinner" aria-hidden="true"></div>
            <a class="stage-link"></a>
            <div class="stage-veil" aria-hidden="true"><span class="stage-cta">▶</span></div>
          </div>
          <div class="stage-meta">
            <div class="stage-genre"></div>
            <h2 class="stage-title"></h2>
            <p class="stage-tagline"></p>
          </div>
        </div>
        <div class="picker" role="group" aria-label="游戏标题，方向键切换"></div>
      </div>`;

    els.browser = root.querySelector('.browser');
    els.frame   = root.querySelector('.stage-frame');
    els.iframe  = root.querySelector('.stage-iframe');
    els.poster  = root.querySelector('.stage-poster');
    els.pvideo  = root.querySelector('.stage-pvideo');
    els.icon    = root.querySelector('.stage-placeholder');
    els.genre   = root.querySelector('.stage-genre');
    els.title   = root.querySelector('.stage-title');
    els.tagline = root.querySelector('.stage-tagline');
    els.link    = root.querySelector('.stage-link');
    els.picker  = root.querySelector('.picker');

    GAMES.forEach((g, i) => els.picker.appendChild(buildPickerItem(g, i)));

    // Keep the single iframe scaled to the stage as it resizes
    new ResizeObserver(([e]) => {
      els.iframe.style.transform = `scale(${e.contentRect.width / NATIVE_W})`;
    }).observe(els.frame);

    // Reveal the game once it boots; ignore the about:blank teardown load
    els.iframe.addEventListener('load', () => {
      const src = els.iframe.getAttribute('src');
      if (!src || src === 'about:blank') return;
      els.frame.classList.remove('is-loading');
      els.iframe.classList.add('ready');
    });

    els.picker.addEventListener('keydown', onPickerKey);

    // Auto-select the first game (live, but don't steal focus / scroll on load)
    if (GAMES.length) selectGame(GAMES[0].id, false);
  }

  function buildPickerItem(g, i) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'picker-item';
    btn.dataset.id = g.id;
    btn.tabIndex = i === 0 ? 0 : -1;        // roving tabindex
    btn.style.setProperty('--pa',   g.accent);
    btn.style.setProperty('--ppbg', g.previewBg);
    btn.setAttribute('aria-label', `预览 ${g.title}`);
    const thumb = g.thumbnail
      ? ` style="background-image:url('./${esc(g.thumbnail)}')"` : '';
    const thumbVid = g.previewVideo
      ? `<video class="pthumb-vid" src="./${esc(g.previewVideo)}" muted loop playsinline autoplay preload="metadata"></video>` : '';
    btn.innerHTML = `
      <span class="picker-thumb"${thumb} aria-hidden="true">${thumbVid}</span>
      <span class="picker-label">
        <span class="picker-genre">${esc(g.genre || '')}</span>
        <span class="picker-title">${esc(g.title)}</span>
      </span>`;
    btn.addEventListener('click', () => selectGame(g.id));
    return btn;
  }

  // Switch the stage to a game. The previous preview is torn down first so only
  // one Phaser/WebGL context is ever alive; the load is debounced so rapidly
  // arrowing through the list doesn't thrash the renderer.
  function selectGame(id, focus = true) {
    if (id === selectedId) return;
    const g = GAMES.find(x => x.id === id);
    if (!g) return;
    selectedId = id;

    els.picker.querySelectorAll('.picker-item').forEach(el => {
      const on = el.dataset.id === id;
      el.classList.toggle('active', on);
      el.tabIndex = on ? 0 : -1;
      if (on && focus) {
        el.focus();
        el.scrollIntoView({ block: 'nearest', inline: 'nearest', behavior: 'smooth' });
      }
    });

    els.browser.style.setProperty('--a',   g.accent);
    els.browser.style.setProperty('--pbg', g.previewBg);
    els.poster.style.backgroundImage = g.thumbnail ? `url('./${esc(g.thumbnail)}')` : '';
    // Looping gameplay clip as the stage preview; falls back to the static poster.
    if (g.previewVideo) {
      els.pvideo.src = `./${esc(g.previewVideo)}`;
      els.pvideo.classList.add('show');
      els.pvideo.play().catch(() => {});
    } else {
      els.pvideo.pause();
      els.pvideo.removeAttribute('src');
      els.pvideo.classList.remove('show');
    }
    els.icon.textContent = g.icon || '';
    setMeta(g);

    // Dispose the previous game immediately, show poster + spinner, then load.
    els.iframe.classList.remove('ready');
    els.frame.classList.add('is-loading');
    els.iframe.src = 'about:blank';
    clearTimeout(loadTimer);
    loadTimer = setTimeout(() => { els.iframe.src = `./${g.path}`; }, 220);
  }

  function setMeta(g) {
    els.genre.textContent   = g.genre || '';
    els.title.textContent   = g.title;
    els.tagline.textContent = g.tagline || '';
    els.link.href           = `./play.html?game=${encodeURIComponent(g.id)}`;
    els.link.setAttribute('aria-label', `开始游玩 ${g.title}`);
  }

  function onPickerKey(e) {
    const NAV = ['ArrowDown', 'ArrowUp', 'ArrowLeft', 'ArrowRight', 'Home', 'End'];
    if (!NAV.includes(e.key)) return;
    e.preventDefault();
    const i = GAMES.findIndex(g => g.id === selectedId);
    let n = i;
    if (e.key === 'ArrowDown' || e.key === 'ArrowRight') n = Math.min(GAMES.length - 1, i + 1);
    else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') n = Math.max(0, i - 1);
    else if (e.key === 'Home') n = 0;
    else if (e.key === 'End')  n = GAMES.length - 1;
    if (n !== i) selectGame(GAMES[n].id);
  }

  // ── Helpers ──────────────────────────────────────────────────────
  function esc(s) {
    return String(s ?? '')
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  init();
})();
</script>
</body>
</html>
