<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>墨水力学：蓝图实验室</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Noto+Sans+SC:wght@500;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0b0f19;
      color: #fff;
      font-family: 'Segoe UI', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* ── game wrapper ── */
    #game-wrapper {
      position: relative;
      border: 3px solid #2f6fb0;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      overflow: hidden;
    }

    /* ── HUD overlay ── */
    #hud {
      display: none;
      position: absolute;
      top: 0; left: 0; right: 0;
      padding: 10px 14px;
      gap: 18px;
      flex-direction: row;
      align-items: center;
      background: linear-gradient(to bottom, rgba(255,255,255,0.55), transparent);
      pointer-events: none;
      z-index: 10;
      font-size: 15px;
      user-select: none;
    }

    #hud-hearts { color: #2f6fb0; letter-spacing: 2px; font-size: 18px; text-shadow: 0 1px 2px rgba(255,255,255,0.5); }
    #hud-score  { color: #1f3a5f; font-weight: 700; text-shadow: 0 1px 2px rgba(255,255,255,0.5); }
    #hud-objective { color: #21384f; flex: 1; text-align: center; font-weight: 600; text-shadow: 0 1px 2px rgba(255,255,255,0.6); }

    /* ── shared overlay styles ── */
    .game-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
      background: rgba(238, 242, 246, 0.93);
      backdrop-filter: blur(3px);
    }

    .overlay-card {
      text-align: center;
      max-width: 520px;
      padding: 36px 40px;
      background: #fbfdff;
      border: 2px solid #21384f;
      border-radius: 12px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.22);
    }

    .overlay-card h2 {
      font-size: 2rem;
      margin-bottom: 8px;
      color: #21384f;
      letter-spacing: 0.08em;
    }

    .overlay-card .tagline {
      font-size: 0.95rem;
      color: #2f6fb0;
      margin-bottom: 16px;
      font-style: italic;
    }

    .overlay-card .story-setting {
      font-size: 0.88rem;
      color: #51647a;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .overlay-card .controls-hint {
      font-size: 0.78rem;
      color: #7a8aa0;
      line-height: 1.8;
      margin-top: 14px;
    }

    /* ── buttons ── */
    .game-btn {
      display: inline-block;
      padding: 12px 36px;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.1s;
    }

    .game-btn:hover  { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,0,0,0.2); }
    .game-btn:active { transform: translateY(0); }

    #start-btn   { background: #2f6fb0; color: #fff; }
    #restart-btn { background: #c0524a; color: #fff; }

    /* ── game-over title colours ── */
    #gameover-title.win  { color: #2f6fb0; }
    #gameover-title.lose { color: #c0524a; }

    /* ── responsive stage scaling (canvas + HUD scale together) ── */
    html, body { width: 100%; height: 100%; }
    #game-wrapper {
      width: 960px; height: 576px;
      flex: 0 0 auto;
      transform-origin: center center;
    }
    /* ── 开场遮罩 · 主题化 BEGIN（只作用于 #start-screen；胜负遮罩仍用通用卡）── */
    #start-screen { flex-direction: column; overflow: hidden; backdrop-filter: none; }    #start-screen { color: #1e3a6e; font-family: 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
      background: linear-gradient(rgba(244,248,255,.5), rgba(244,248,255,.7)), url('scene/panorama.png') center / cover, #f4f8ff; }
    #start-screen .im-sheet { position: relative; width: 610px; border: 2px solid #1e3a6e; background: rgba(250,252,255,.94); box-shadow: 7px 7px 0 rgba(30,58,110,.18); }
    #start-screen .im-head { display: flex; border-bottom: 1.5px solid #1e3a6e; font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #3b5b93; }
    #start-screen .im-head span { flex: 1; padding: 5px 10px; border-right: 1px solid rgba(30,58,110,.45); }
    #start-screen .im-head span:last-child { border-right: none; }
    #start-screen .im-head b { margin-left: 6px; color: #1e3a6e; font-weight: 600; }
    #start-screen .im-body { padding: 18px 34px 20px; text-align: center; }
    #start-screen .im-dim { position: relative; width: 300px; height: 14px; margin: 0 auto 8px; border-left: 1.5px solid #3b5b93; border-right: 1.5px solid #3b5b93;
      font-family: 'IBM Plex Mono', monospace; font-size: 10px; line-height: 14px; color: #3b5b93; }
    #start-screen .im-dim::before { content: ''; position: absolute; left: 0; right: 0; top: 7px; border-top: 1px solid #3b5b93; }
    #start-screen .im-dim span { position: relative; padding: 0 8px; background: rgba(250,252,255,1); }
    #start-screen .im-title { margin: 0; font-weight: 900; font-size: 60px; line-height: 1.1; letter-spacing: .16em; color: #1e3a6e; }
    #start-screen .im-sub { margin-top: 2px; font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: .32em; color: #3b5b93; }
    #start-screen .im-story { margin-top: 12px; font-size: 13.5px; line-height: 1.85; color: #2d4a7c; }
    #start-screen .im-btn { margin-top: 16px; padding: 9px 38px; cursor: pointer; font-family: 'Noto Sans SC', sans-serif; font-weight: 900; font-size: 20px; letter-spacing: .3em;
      color: #fff; background: #1e3a6e; border: none; box-shadow: 4px 4px 0 #fbbf24; transition: transform .1s, box-shadow .1s; }
    #start-screen .im-btn:hover { transform: translate(-2px,-2px); box-shadow: 6px 6px 0 #fbbf24; }
    #start-screen .im-keys { margin-top: 16px; display: flex; justify-content: center; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: #3b5b93; }
    #start-screen kbd { display: inline-block; margin-right: 4px; padding: 0 6px; font-family: 'IBM Plex Mono', 'Microsoft YaHei', monospace; font-size: 11px; font-weight: 600;
      color: #1e3a6e; border: 1px solid #1e3a6e; background: #fff; }
    @media (prefers-reduced-motion: reduce) { #start-screen, #start-screen * { animation: none !important; } }
    /* ── 开场遮罩 · 主题化 END ── */
  </style>
</head>
<body>
  <div id="game-wrapper">
    <div id="game-container"></div>

    <!-- HUD overlay -->
    <div id="hud">
      <div id="hud-hearts" title="本关剩余发射机会">◆◆◆◆</div>
      <div id="hud-score">通关: <span id="hud-score-value">0</span></div>
      <div id="hud-objective"><span id="hud-objective-text">拖鼠标画墨线，把墨水引进墨井</span></div>
    </div>

    <!-- Start screen overlay：工程蓝图标题栏主题（无选择页的游戏保留这一次点击，样式见 style 末尾） -->
    <div id="start-screen" class="game-overlay">
      <div class="im-sheet">
        <div class="im-head"><span>图号<b>IM-01</b></span><span>比例<b>1 : 1</b></span><span>工况<b>重力引流</b></span><span>设计<b>你</b></span></div>
        <div class="im-body">
          <div class="im-dim"><span>一条线</span></div>
          <h2 class="im-title">墨水力学</h2>
          <div class="im-sub">BLUEPRINT LAB</div>
          <p class="im-story">在蓝图上画一条线，重力替你把墨水送进井里。<br>每一关都是一道纸上的引流谜题：你亲手补上的那条线，就是解法本身。</p>
          <button id="start-btn" class="im-btn" onclick="window.__hudStart()">开始实验</button>
          <div class="im-keys"><span><kbd>鼠标拖动</kbd>画墨线</span><span><kbd>空格</kbd>/<kbd>J</kbd>放水</span><span><kbd>R</kbd>重置水滴</span><span><kbd>C</kbd>清空墨线</span></div>
        </div>
      </div>
    </div>

    <!-- Game over overlay -->
    <div id="gameover-screen" class="game-overlay" style="display:none">
      <div class="overlay-card">
        <h2 id="gameover-title">GAME OVER</h2>
        <p id="gameover-message" class="story-setting"></p>
        <button id="restart-btn" class="game-btn" onclick="location.reload()">↩ RESTART</button>
      </div>
    </div>
  </div>

  <script>
    // 关卡脚手架数据（保留：供 _build.js / 未来 fetch 用，schema 见 levels.js / MIGRATION.md）
    window.GAME_CONFIG  = {
      "map": { "width": 960, "height": 540, "tileWidth": 64, "tileHeight": 64 },
      "player": { "spawn": { "x": 90, "y": 270 }, "speed": 0 },
      "renderMode": "procedural-lineart",
      "engine": "phaser-custom-verlet",
      "note": "Side-view gravity ink-routing puzzle. Mouse-drag to draw ink lines that become solid slopes; gravity pulls a droplet into an ink-well goal, avoiding spikes / no-draw zones / rotating levers. 5 linear levels (no level-select, no save), procedural lineart."
    };
    window.TILEMAP_DATA = { "width": 15, "height": 9, "tileWidth": 64, "tileHeight": 64, "tileIndex": {}, "layers": { "obstacles": [] } };
    window.ENTITIES_DATA = [];
  </script>

  <!-- ── 共享引擎层（game_runs/_engine：22 游戏共用同一份，改一次全受益）── -->
  <script src="../_engine/audio.js"></script>
  <script src="../_engine/hud.js"></script>

  <!-- ── 本游戏：数据 → 系统 → 场景 → 装配（按依赖顺序）── -->
  <script src="game/config.js"></script>
  <script src="game/levels.js"></script>
  <script src="game/physics.js"></script>
  <script src="game/render.js"></script>
  <script src="game/scenes/BootScene.js"></script>
  <script src="game/scenes/LevelScene.js"></script>
  <script src="game/main.js"></script>
  <script>
    /* Fit the whole stage (canvas + HUD overlays) to the viewport so everything
       scales as one piece — keeps HUD proportions correct at any screen size. */
    (function () {
      var W = 960, H = 576;
      var wrap = document.getElementById('game-wrapper');
      function fit() {
        if (!wrap) return;
        var s = Math.min(window.innerWidth / W, window.innerHeight / H, 1);
        wrap.style.transform = 'scale(' + s + ')';
      }
      window.addEventListener('resize', fit);
      window.addEventListener('orientationchange', fit);
      fit();
    })();
  </script>
</body>
</html>
