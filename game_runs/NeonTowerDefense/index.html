<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>霓虹防御：终极战线</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@700;900&family=ZCOOL+QingKe+HuangYou&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0b0f19;
      color: #fff;
      font-family: 'Segoe UI', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* ── game wrapper ── */
    #game-wrapper {
      position: relative;
      border: 3px solid #3b82f6;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      overflow: hidden;
    }

    /* ── HUD overlay ── */
    #hud {
      display: none;
      position: absolute;
      top: 0; left: 0; right: 0;
      padding: 10px 14px;
      gap: 18px;
      flex-direction: row;
      align-items: center;
      background: linear-gradient(to bottom, rgba(0,0,0,0.55), transparent);
      pointer-events: none;
      z-index: 10;
      font-size: 15px;
      user-select: none;
    }

    #hud-hearts { color: #f87171; letter-spacing: 2px; font-size: 18px; }
    #hud-score  { color: #fbbf24; }
    #hud-objective { color: #a5f3fc; flex: 1; text-align: center; }
    #hud-day    { color: #86efac; margin-left: auto; }

    /* ── shared overlay styles ── */
    .game-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
      background: rgba(8, 12, 24, 0.88);
      backdrop-filter: blur(3px);
    }

    .overlay-card {
      text-align: center;
      max-width: 520px;
      padding: 36px 40px;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid #334155;
      border-radius: 12px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }

    .overlay-card h2 {
      font-size: 2rem;
      margin-bottom: 8px;
      color: #f1f5f9;
      letter-spacing: 0.08em;
    }

    .overlay-card .tagline {
      font-size: 0.95rem;
      color: #94a3b8;
      margin-bottom: 16px;
      font-style: italic;
    }

    .overlay-card .story-setting {
      font-size: 0.88rem;
      color: #64748b;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .overlay-card .controls-hint {
      font-size: 0.78rem;
      color: #475569;
      line-height: 1.8;
      margin-top: 14px;
    }

    /* ── buttons ── */
    .game-btn {
      display: inline-block;
      padding: 12px 36px;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.1s;
    }

    .game-btn:hover  { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,0,0,0.4); }
    .game-btn:active { transform: translateY(0); }

    #start-btn   { background: #2563eb; color: #fff; }
    #restart-btn { background: #dc2626; color: #fff; }

    /* ── game-over title colours ── */
    #gameover-title.win  { color: #4ade80; }
    #gameover-title.lose { color: #f87171; }
    /* ── responsive stage scaling (canvas + HUD scale together) ── */
    html, body { width: 100%; height: 100%; }
    #game-wrapper {
      width: 960px; height: 576px;
      flex: 0 0 auto;
      transform-origin: center center;
    }
    /* ── 开场遮罩 · 主题化 BEGIN（只作用于 #start-screen；胜负遮罩仍用通用卡）── */
    #start-screen { flex-direction: column; overflow: hidden; backdrop-filter: none; }    #start-screen { flex-direction: row; gap: 30px; color: #bdf6ff; font-family: 'Share Tech Mono', 'Consolas', monospace;
      background: radial-gradient(ellipse at 50% 50%, rgba(2,10,24,.5), rgba(1,4,12,.92) 72%), url('scene/neon_td_panorama.png') center / cover, #020814; }
    #start-screen .td-core { position: relative; flex: 0 0 150px; height: 150px; display: flex; align-items: center; justify-content: center; }
    #start-screen .td-core i { width: 96px; height: 96px; background: url('assets/objects/core_database.webp') 0 0 / 384px 96px no-repeat; animation: td-core .6s steps(4) infinite; }
    #start-screen .td-core::before, #start-screen .td-core::after { content: ''; position: absolute; inset: 0; border-radius: 50%; border: 2px solid rgba(0,229,255,.75);
      animation: td-ring 2s ease-out infinite; }
    #start-screen .td-core::after { animation-delay: -1s; }
    #start-screen .td-panel { position: relative; width: 560px; padding: 22px 28px 20px; background: rgba(2,14,28,.8); border: 1px solid rgba(0,229,255,.35);
      box-shadow: inset 0 0 24px rgba(0,229,255,.15); }
    #start-screen .td-panel::before, #start-screen .td-panel::after { content: ''; position: absolute; width: 22px; height: 22px; border: 3px solid #00e5ff; }
    #start-screen .td-panel::before { left: -3px; top: -3px; border-right: none; border-bottom: none; }
    #start-screen .td-panel::after { right: -3px; bottom: -3px; border-left: none; border-top: none; }
    #start-screen .td-alert { font-size: 13px; letter-spacing: .25em; color: #ff4d6d; animation: td-blink 1s steps(2) infinite; }
    #start-screen .td-title { margin: 8px 0 0; font-family: 'ZCOOL QingKe HuangYou', sans-serif; font-weight: 400; font-size: 66px; line-height: 1.05; color: #e8feff;
      text-shadow: 0 0 14px rgba(0,229,255,.8); }
    #start-screen .td-title small { margin-left: 14px; font-size: 28px; color: #00e5ff; }
    #start-screen .td-log { margin-top: 12px; font-size: 13.5px; line-height: 1.75; color: #8fe9f5; }
    #start-screen .td-log p::before { content: '> '; color: #fbbf24; }
    #start-screen .td-btn { margin-top: 16px; padding: 9px 34px; cursor: pointer; font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 15px; letter-spacing: .25em;
      color: #021018; background: #00e5ff; border: none; clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%); transition: background .15s; }
    #start-screen .td-btn span { margin-right: 10px; font-family: 'ZCOOL QingKe HuangYou', sans-serif; font-weight: 400; font-size: 21px; letter-spacing: .2em; }
    #start-screen .td-btn:hover { background: #fbbf24; }
    #start-screen .td-keys { margin-top: 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 6px 18px; font-size: 12.5px; color: #7fd2df; }
    #start-screen .td-keys em { font-style: normal; color: #fbbf24; }
    #start-screen kbd { display: inline-block; min-width: 20px; margin-right: 6px; padding: 0 5px; text-align: center; font-family: 'Share Tech Mono', monospace; font-size: 12px;
      color: #021018; background: #8fe9f5; border-radius: 2px; }
    @keyframes td-core { to { background-position: -384px 0; } }
    @keyframes td-ring { from { transform: scale(.7); opacity: 1; } to { transform: scale(1.3); opacity: 0; } }
    @keyframes td-blink { 50% { opacity: .25; } }
    @media (prefers-reduced-motion: reduce) { #start-screen, #start-screen * { animation: none !important; } }
    /* ── 开场遮罩 · 主题化 END ── */
  </style>
</head>
<body>
  <div id="game-wrapper">
    <div id="game-container"></div>

    <!-- HUD overlay -->
    <div id="hud">
      <div id="hud-hearts" title="生命值">♥♥♥</div>
        <div id="hud-score">能量水晶: <span id="hud-score-value">0</span></div>
        <div id="hud-objective"><span id="hud-objective-text">消灭病毒，收集电荷，按J/K键建造防御塔保护终点！</span></div>
        <div id="hud-day">关卡 <span id="hud-day-value">1</span></div>
    </div>

    <!-- Start screen overlay：入侵警报终端主题（无选择页的游戏保留这一次点击，样式见 style 末尾） -->
    <div id="start-screen" class="game-overlay">
      <div class="td-core" aria-hidden="true"><i></i></div>
      <div class="td-panel">
        <div class="td-alert">⚠ SYSTEM BREACH DETECTED</div>
        <h2 class="td-title">霓虹防御<small>终极战线</small></h2>
        <div class="td-log"><p>赛博网络核心数据库高负荷运转中</p><p>病毒程序沿光轨无休止地入侵</p><p>驾驶无人机建造炮塔，守住核心</p></div>
        <button id="start-btn" class="td-btn" onclick="window.__hudStart()"><span>部署防线</span>DEPLOY</button>
        <div class="td-keys">
          <span><kbd>WASD</kbd>移动无人机</span>
          <span><kbd>J</kbd><kbd>K</kbd>建造炮塔 <em>50/80💎</em></span>
          <span><kbd>E</kbd>升级最近的炮塔</span>
          <span><kbd>Z</kbd>连锁闪电 <em>15💎</em></span>
          <span><kbd>SPACE</kbd>系统超频 <em>50💎</em></span>
        </div>
      </div>
    </div>

    <!-- Game over overlay -->
    <div id="gameover-screen" class="game-overlay" style="display:none">
      <div class="overlay-card">
        <h2 id="gameover-title">GAME OVER</h2>
        <p id="gameover-message" class="story-setting"></p>
        <button id="restart-btn" class="game-btn" onclick="location.reload()">↩ RESTART</button>
      </div>
    </div>
  </div>

  <script>
    // NeonTowerDefense 有核心血量,沿用 ♥/♡ 字形。
    window.GAME_HUD_GLYPHS = { full: '♥', empty: '♡' };
  </script>
  <!-- 共享引擎层 -->
  <script src="../_engine/hud.js"></script>
  <script>
    // 游戏特有 HUD 扩展:天数计数(共享 hud.js 不含),增补到 GameHUD。
    window.GameHUD.setDay = function (day) {
      const el = document.getElementById('hud-day-value');
      if (el) el.textContent = day;
    };
  </script>
  <!-- 数据(地图/瓦片/实体 + 深度常量) -->
  <script src="game/config.js"></script>
  <script src="game/data.js"></script>
  <!-- 场景核心 + 系统模块(原型分割) -->
  <script src="game/scenes/MainScene.js"></script>
  <script src="game/systems/world.js"></script>
  <script src="game/systems/player.js"></script>
  <script src="game/systems/enemies.js"></script>
  <script src="game/systems/turrets.js"></script>
  <script src="game/systems/flow.js"></script>
  <script src="game/systems/fx.js"></script>
  <!-- Phaser 装配 -->
  <script src="game/main.js"></script>
  <script>
    /* Fit the whole stage (canvas + HUD overlays) to the viewport so everything
       scales as one piece — keeps HUD proportions correct at any screen size. */
    (function () {
      var W = 960, H = 576;
      var wrap = document.getElementById('game-wrapper');
      function fit() {
        if (!wrap) return;
        var s = Math.min(window.innerWidth / W, window.innerHeight / H, 1);
        wrap.style.transform = 'scale(' + s + ')';
      }
      window.addEventListener('resize', fit);
      window.addEventListener('orientationchange', fit);
      fit();
    })();
  </script>
</body>
</html>
