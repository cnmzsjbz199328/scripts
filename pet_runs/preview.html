<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>Pet Preview</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #1a1a2e;
      --panel: #16213e;
      --border: #0f3460;
      --accent: #e94560;
      --text: #a8b2d8;
      --text-bright: #ccd6f6;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 20px;
      padding: 32px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    h1 {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text);
    }

    select {
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--text-bright);
      font-size: 13px;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      outline: none;
      transition: border-color 0.15s;
    }

    select:hover, select:focus { border-color: var(--accent); }

    .stage {
      position: relative;
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      background-image:
        linear-gradient(45deg, #2a2a3e 25%, transparent 25%),
        linear-gradient(-45deg, #2a2a3e 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #2a2a3e 75%),
        linear-gradient(-45deg, transparent 75%, #2a2a3e 75%);
      background-size: 16px 16px;
      background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
      background-color: #222235;
      min-width: 192px;
      min-height: 208px;
    }

    canvas { display: block; }

    .controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .anim-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }

    button {
      padding: 7px 18px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s;
      text-transform: capitalize;
    }

    button:hover { border-color: var(--accent); color: var(--text-bright); }
    button.active { background: var(--accent); border-color: var(--accent); color: #fff; }

    .meta {
      font-size: 12px;
      color: var(--text);
      display: flex;
      gap: 20px;
    }

    .meta span { opacity: 0.7; }
    .meta strong { color: var(--text-bright); }

    .scale-row {
      display: flex;
      gap: 6px;
      align-items: center;
      font-size: 12px;
    }

    .scale-row button { padding: 4px 10px; font-size: 11px; }

    .error {
      color: var(--accent);
      font-size: 13px;
      text-align: center;
      max-width: 400px;
      line-height: 1.6;
    }

    .error code {
      background: var(--panel);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 12px;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>Pet Preview</h1>
    <select id="petSelect"><option value="">— select pet —</option></select>
  </div>

  <div class="stage" id="stage">
    <canvas id="canvas"></canvas>
  </div>

  <div class="controls">
    <div class="anim-buttons" id="animButtons"></div>

    <div class="meta">
      <div><span>animation </span><strong id="metaAnim">—</strong></div>
      <div><span>frame </span><strong id="metaFrame">—</strong></div>
      <div><span>fps </span><strong id="metaFps">—</strong></div>
    </div>

    <div class="scale-row">
      <span>scale</span>
      <button data-scale="1">1×</button>
      <button data-scale="2" class="active">2×</button>
      <button data-scale="3">3×</button>
    </div>
  </div>

  <!-- Auto-generated by assemble.ts: defines window.PET_REGISTRY -->
  <script src="registry.js"></script>

  <script>
    // ── PetAnimator ──────────────────────────────────────────────────────────
    class PetAnimator {
      constructor(canvas, img, config) {
        this.canvas = canvas;
        this.ctx    = canvas.getContext('2d');
        this.img    = img;
        this.config = config;
        this._anim     = null;
        this._animName = '';
        this._frame    = 0;
        this._elapsed  = 0;
        this._lastTs   = null;
        this._done     = false;
        this._rafId    = requestAnimationFrame(ts => this._tick(ts));
      }

      play(name) {
        const anim = this.config.animations[name];
        if (!anim) return;
        this._animName = name;
        this._anim     = anim;
        this._frame    = 0;
        this._elapsed  = 0;
        this._done     = false;
      }

      setScale(s) {
        this._scale = s;
        const { width: fw, height: fh } = this.config.frameSize;
        this.canvas.width  = fw * s;
        this.canvas.height = fh * s;
        this.ctx.imageSmoothingEnabled = false;
      }

      destroy() {
        cancelAnimationFrame(this._rafId);
      }

      _tick(ts) {
        if (this._lastTs !== null && this._anim && !this._done) {
          this._elapsed += ts - this._lastTs;
          const msPerFrame = 1000 / this._anim.fps;
          if (this._elapsed >= msPerFrame) {
            this._frame += Math.floor(this._elapsed / msPerFrame);
            this._elapsed %= msPerFrame;
            if (this._frame >= this._anim.frameCount) {
              this._frame = this._anim.loop
                ? this._frame % this._anim.frameCount
                : this._anim.frameCount - 1;
              if (!this._anim.loop) this._done = true;
            }
          }
        }
        this._lastTs = ts;
        this._draw();
        this._rafId = requestAnimationFrame(ts => this._tick(ts));
      }

      _draw() {
        const { width: fw, height: fh } = this.config.frameSize;
        const s  = this._scale ?? 2;
        const dw = fw * s;
        const dh = fh * s;
        this.ctx.clearRect(0, 0, dw, dh);
        if (!this._anim) return;
        this.ctx.drawImage(
          this.img,
          this._frame * fw, this._anim.row * fh, fw, fh,
          0, 0, dw, dh
        );
        document.getElementById('metaAnim').textContent  = this._animName;
        document.getElementById('metaFrame').textContent =
          `${this._frame + 1} / ${this._anim.frameCount}`;
        document.getElementById('metaFps').textContent   = this._anim.fps;
      }
    }

    // ── State ────────────────────────────────────────────────────────────────
    let currentAnimator = null;
    let currentScale    = 2;

    const canvas     = document.getElementById('canvas');
    const petSelect  = document.getElementById('petSelect');
    const btnPanel   = document.getElementById('animButtons');

    // ── Registry check ───────────────────────────────────────────────────────
    if (typeof window.PET_REGISTRY === 'undefined') {
      document.getElementById('stage').style.display = 'none';
      document.querySelector('.controls').style.display = 'none';
      document.querySelector('.header').insertAdjacentHTML('afterend',
        `<p class="error">
          registry.js not found.<br>
          Run <code>npx tsx scripts/assemble.ts &lt;pet_name&gt;</code> to generate it.
        </p>`
      );
    } else {
      // Populate dropdown
      for (const name of Object.keys(window.PET_REGISTRY)) {
        const opt = document.createElement('option');
        opt.value = name;
        opt.textContent = name;
        petSelect.appendChild(opt);
      }

      // Auto-load first pet
      const firstName = Object.keys(window.PET_REGISTRY)[0];
      if (firstName) {
        petSelect.value = firstName;
        loadPet(firstName);
      }

      petSelect.addEventListener('change', e => {
        if (e.target.value) loadPet(e.target.value);
      });
    }

    // ── Load pet ─────────────────────────────────────────────────────────────
    function loadPet(petName) {
      const config = window.PET_REGISTRY?.[petName];
      if (!config) return;

      if (currentAnimator) {
        currentAnimator.destroy();
        currentAnimator = null;
      }
      btnPanel.innerHTML = '';

      const img = new Image();
      img.onload = () => {
        currentAnimator = new PetAnimator(canvas, img, config);
        currentAnimator.setScale(currentScale);

        for (const name of Object.keys(config.animations)) {
          const btn = document.createElement('button');
          btn.textContent = name;
          btn.dataset.anim = name;
          btn.addEventListener('click', () => {
            currentAnimator.play(name);
            setActiveAnimBtn(name);
          });
          btnPanel.appendChild(btn);
        }

        const defaultAnim =
          Object.entries(config.animations).find(([, v]) => v.loop)?.[0]
          ?? Object.keys(config.animations)[0];
        currentAnimator.play(defaultAnim);
        setActiveAnimBtn(defaultAnim);
      };
      img.onerror = () => {
        btnPanel.innerHTML =
          `<span class="error">spritesheet not found for <strong>${petName}</strong></span>`;
      };
      img.src = config.spritesheet;
    }

    // ── Helpers ──────────────────────────────────────────────────────────────
    function setActiveAnimBtn(name) {
      document.querySelectorAll('[data-anim]').forEach(b =>
        b.classList.toggle('active', b.dataset.anim === name));
    }

    document.querySelectorAll('[data-scale]').forEach(btn => {
      btn.addEventListener('click', () => {
        currentScale = parseInt(btn.dataset.scale);
        currentAnimator?.setScale(currentScale);
        document.querySelectorAll('[data-scale]').forEach(b =>
          b.classList.toggle('active', b.dataset.scale === btn.dataset.scale));
      });
    });
  </script>
</body>
</html>
